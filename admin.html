<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Mágnum - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .btn-tono { transition: transform 0.08s, background 0.15s; }
        .btn-tono:active { transform: scale(0.92); }
        #gainBar { transition: width 2.5s ease, background-color 1s ease; }
        @keyframes tonoFlash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .tono-flash { animation: tonoFlash 0.25s ease; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center font-sans p-6 py-8">

    <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl flex flex-col gap-6">
        <header class="flex items-center gap-4 pb-4 border-b border-zinc-800">
            <img src="logo.png" alt="Mi Karaoke Latino" class="h-14 w-auto flex-shrink-0 object-contain">
            <div class="min-w-0">
                <h1 class="text-xl font-black text-amber-400 tracking-wide leading-tight">CONSOLE ADMIN</h1>
                <p class="text-sm text-zinc-500 mt-0.5">Control Remoto de TV Principal</p>
            </div>
        </header>

        <div>
            <h2 class="text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider text-center">Sesión de sala</h2>
            <div id="panelSesion" class="bg-zinc-950/95 border border-zinc-700/60 rounded-2xl p-4 text-center">
                <p class="text-zinc-600 italic text-sm">Cargando...</p>
            </div>
        </div>

        <div class="text-left">
            <h2 class="text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider">Canciones en espera</h2>
            <div class="max-h-56 overflow-y-auto rounded-xl border border-zinc-800 bg-zinc-950/50 p-3">
                <div id="adminQueue" class="flex flex-col gap-1.5 text-sm text-zinc-300">
                    <p class="text-zinc-600 italic text-sm">Cargando cola...</p>
                </div>
            </div>
        </div>

        <div>
            <h2 class="text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider text-center">Control de audio</h2>
            <div id="controlPanel" class="bg-zinc-950/95 backdrop-blur-sm border border-zinc-700/60 rounded-2xl shadow-2xl shadow-black/70 overflow-hidden">
                <div class="flex items-center gap-1.5 px-3 pt-3 pb-2 flex-wrap justify-center">
                    <span class="text-zinc-500 text-[10px] font-black tracking-widest uppercase w-14">Tono</span>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-blue-950 border border-zinc-700 hover:border-blue-700 rounded-lg text-[11px] text-blue-400 font-black" onclick="enviarTono(-3)">-3</button>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-blue-950 border border-zinc-700 hover:border-blue-700 rounded-lg text-[11px] text-blue-400 font-black" onclick="enviarTono(-2)">-2</button>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-blue-950 border border-zinc-700 hover:border-blue-700 rounded-lg text-[11px] text-blue-400 font-black" onclick="enviarTono(-1)">-1</button>
                    <div id="tonoDisplay" class="px-3 py-1 bg-zinc-900 border border-zinc-600 rounded-lg text-amber-400 text-sm font-black min-w-[3.5rem] text-center tracking-wide">0</div>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-rose-950 border border-zinc-700 hover:border-rose-700 rounded-lg text-[11px] text-rose-400 font-black" onclick="enviarTono(1)">+1</button>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-rose-950 border border-zinc-700 hover:border-rose-700 rounded-lg text-[11px] text-rose-400 font-black" onclick="enviarTono(2)">+2</button>
                    <button type="button" class="btn-tono px-2 py-1 bg-zinc-800/80 hover:bg-rose-950 border border-zinc-700 hover:border-rose-700 rounded-lg text-[11px] text-rose-400 font-black" onclick="enviarTono(3)">+3</button>
                    <button type="button" class="btn-tono ml-1 px-2.5 py-1 bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-600 rounded-lg text-zinc-400 hover:text-white text-xs font-black" onclick="enviarResetTono()" title="Resetear tono">↺</button>
                </div>
                <div class="mx-3 border-t border-zinc-800"></div>
                <div class="flex items-center gap-2 px-3 py-2">
                    <span class="text-zinc-500 text-[10px] font-black tracking-widest uppercase w-14">Auto vol</span>
                    <div class="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden min-w-[80px]">
                        <div id="gainBar" class="h-full bg-emerald-500 rounded-full" style="width: 50%"></div>
                    </div>
                    <span id="gainLabel" class="text-[10px] text-zinc-500 font-mono w-12 text-right">—</span>
                </div>
                <div class="px-3 pb-2 text-[9px] text-zinc-600 font-mono tracking-wide text-center">
                    Ajuste remoto de tono en la TV
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-4">
            <button onclick="enviarComando('pausa')" class="w-full bg-zinc-800 hover:bg-zinc-700 text-white font-bold py-4 rounded-xl text-lg border border-zinc-700 active:scale-95 transition-all">
                ⏯️ PAUSAR / CONTINUAR
            </button>

            <button onclick="enviarComando('reiniciar')" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl text-lg active:scale-95 transition-all shadow-lg shadow-blue-600/20">
                🔄 COMENZAR DE NUEVO
            </button>

            <button onclick="enviarComando('saltar')" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-black py-4 rounded-xl text-lg active:scale-95 transition-all shadow-lg shadow-amber-500/20">
                ⏭️ SALTAR A LA SIGUIENTE
            </button>
        </div>

        <div>
            <h2 class="text-zinc-400 text-xs font-bold mb-3 uppercase tracking-wider text-center">Efectos Especiales</h2>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="enviarEfecto('aplausos')" class="bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-emerald-900/20">
                    👏 Aplausos
                </button>
                <button onclick="enviarEfecto('buuu')" class="bg-red-900/40 hover:bg-red-800/60 border border-red-700/50 text-red-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-red-900/20">
                    👎 Buuu
                </button>
                <button onclick="enviarEfecto('corneta')" class="bg-violet-900/40 hover:bg-violet-800/60 border border-violet-700/50 text-violet-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-violet-900/20">
                    📯 Corneta
                </button>
                <button onclick="enviarEfecto('chacal')" class="bg-amber-900/40 hover:bg-amber-800/60 border border-amber-700/50 text-amber-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-amber-900/20">
                    🎺 Chacal
                </button>
                <button onclick="enviarEfecto('gato')" class="bg-orange-900/40 hover:bg-orange-800/60 border border-orange-700/50 text-orange-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-orange-900/20">
                    🐱 Gato
                </button>
                <button onclick="enviarEfecto('trombon')" class="bg-sky-900/40 hover:bg-sky-800/60 border border-sky-700/50 text-sky-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-sky-900/20">
                    🎶 Fracaso
                </button>
                <button onclick="enviarEfecto('grillos')" class="bg-lime-900/40 hover:bg-lime-800/60 border border-lime-700/50 text-lime-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-lime-900/20">
                    🦗 Grillos
                </button>
                <button onclick="enviarEfecto('redoble')" class="bg-fuchsia-900/40 hover:bg-fuchsia-800/60 border border-fuchsia-700/50 text-fuchsia-300 font-bold py-3.5 px-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-fuchsia-900/20">
                    🥁 Redoble
                </button>
            </div>
        </div>

        <div class="pt-4 mt-2 border-t border-zinc-800">
            <button type="button" id="btnPanicoOperador" class="btn-panico-operador" aria-label="Llamar al operador">
                <span class="panico-icon" aria-hidden="true">🛎️</span>
                <span class="panico-text" id="btnPanicoOperadorTexto">Llamar al Operador</span>
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://mefrjbmjfdphdqndpzcw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const channel = supabaseClient.channel('admin-commands');
        const tonoDisplay = document.getElementById('tonoDisplay');
        const gainBar = document.getElementById('gainBar');
        const gainLabel = document.getElementById('gainLabel');
        let semitonosAdmin = 0;

        function actualizarBarraAutoVol(valor) {
            if (!gainBar || !gainLabel) return;
            const pct = Math.round(((valor - 0.3) / (3.0 - 0.3)) * 100);
            const pctOk = Math.max(2, Math.min(100, pct));
            gainBar.style.width = `${pctOk}%`;
            gainBar.style.backgroundColor =
                pctOk > 65 ? '#10b981' :
                pctOk > 30 ? '#eab308' :
                             '#ef4444';
            const db = Math.round(20 * Math.log10(Math.max(0.001, valor)));
            gainLabel.innerText = `${db >= 0 ? '+' : ''}${db} dB`;
        }

        // ------------------------------------------------------------------
        // Sesiones de sala
        //
        // El codigo solo se ve en la TV, asi que teclearlo demuestra estar en
        // la sala. Al cerrar la sesion, quien vino ayer queda fuera solo.
        // ------------------------------------------------------------------

        const panelSesion = document.getElementById('panelSesion');

        function pinOperador(forzar) {
            let pin = localStorage.getItem('karaoke_pin_operador');
            if (!pin || forzar) {
                pin = prompt('PIN de operador:');
                if (!pin) return null;
                localStorage.setItem('karaoke_pin_operador', pin);
            }
            return pin;
        }

        async function llamarSesion(accion, extra = {}) {
            const pin = pinOperador(false);
            if (!pin) return null;

            let data;
            try {
                const res = await fetch('/api/sesion', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion, pin, ...extra })
                });
                data = await res.json();
            } catch (e) {
                console.error('Error de red en /api/sesion:', e);
                return { ok: false, error: 'Sin conexión' };
            }

            // PIN malo: se borra el guardado para que vuelva a preguntar.
            if (!data.ok && data.error === 'PIN incorrecto') {
                localStorage.removeItem('karaoke_pin_operador');
            }
            return data;
        }

        function pintarPanelSesion(data) {
            if (!data) {
                panelSesion.innerHTML = `<p class="text-zinc-600 italic text-sm">PIN no ingresado.</p>
                    <button onclick="refrescarPanelSesion(true)" class="mt-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-4 py-2 rounded-xl text-xs">Ingresar PIN</button>`;
                return;
            }

            if (data.sinConfigurar || data.faltaSql) {
                // Se muestra lo que dice el servidor, no un texto fijo: puede
                // faltar el PIN, las claves de Supabase o el SQL, y cada una
                // se arregla distinto.
                panelSesion.innerHTML = `<p class="text-zinc-500 text-xs leading-relaxed">
                    Sesiones desactivadas.<br>${data.error || 'Falta configuración en Vercel.'}</p>
                    <button onclick="refrescarPanelSesion(false)"
                        class="mt-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-4 py-2 rounded-xl text-xs">
                        Volver a comprobar
                    </button>`;
                return;
            }

            if (!data.ok) {
                panelSesion.innerHTML = `<p class="text-red-400 text-sm font-bold mb-3">${data.error || 'Error'}</p>
                    <button onclick="refrescarPanelSesion(true)" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-4 py-2 rounded-xl text-xs">Reintentar</button>`;
                return;
            }

            if (!data.sesion) {
                panelSesion.innerHTML = `
                    <p class="text-zinc-500 text-xs mb-1">Sin sesión abierta</p>
                    <p class="text-zinc-600 text-[11px] mb-4 leading-relaxed">
                        Todos pueden pedir canciones sin código.
                    </p>
                    <button onclick="abrirSesion()"
                        class="w-full bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-300 font-bold py-3 rounded-xl text-sm active:scale-95 transition-all">
                        ▶ Abrir sesión
                    </button>`;
                return;
            }

            const desde = new Date(data.sesion.abierta_en);
            const hora = desde.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });
            const grupo = data.sesion.nombre_grupo
                ? `<p class="text-zinc-400 text-xs mb-1">${data.sesion.nombre_grupo}</p>` : '';

            panelSesion.innerHTML = `
                ${grupo}
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-1">Código en pantalla</p>
                <div class="text-5xl font-black text-amber-400 tracking-[0.25em] mb-1">${data.sesion.codigo}</div>
                <p class="text-zinc-600 text-[11px] mb-4">Abierta desde las ${hora}</p>
                <div id="panelTiempo" class="border-t border-zinc-800 pt-4 mb-4"></div>
                <button onclick="cerrarSesion()"
                    class="w-full bg-red-900/40 hover:bg-red-800/60 border border-red-700/50 text-red-300 font-bold py-3 rounded-xl text-sm active:scale-95 transition-all">
                    ■ Cerrar sesión
                </button>`;

            pintarPanelTiempo(data.sesion);
        }

        // ------------------------------------------------------------------
        // Tiempo contratado
        // ------------------------------------------------------------------

        function formatRestante(seg) {
            const s = Math.abs(seg);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const txt = h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${m} min`;
            return seg < 0 ? `-${txt}` : txt;
        }

        function pintarPanelTiempo(sesion) {
            const cont = document.getElementById('panelTiempo');
            if (!cont) return;

            // Todavia sin programar: se pide hora de inicio y horas pagadas.
            if (!sesion.programada) {
                const ahora = new Date();
                const hhmm = String(ahora.getHours()).padStart(2, '0') + ':' +
                             String(ahora.getMinutes()).padStart(2, '0');

                cont.innerHTML = `
                    <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-3">Tiempo contratado</p>
                    <div class="flex items-center gap-2 mb-3">
                        <input type="time" id="inicioSesion" value="${hhmm}"
                            class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg py-2 px-2 text-zinc-100 text-sm text-center">
                        <input type="number" id="horasSesion" value="3" min="0.5" max="24" step="0.5"
                            class="w-20 bg-zinc-900 border border-zinc-700 rounded-lg py-2 px-2 text-zinc-100 text-sm text-center">
                        <span class="text-zinc-500 text-xs">horas</span>
                    </div>
                    <button onclick="programarTiempo()"
                        class="w-full bg-emerald-900/40 hover:bg-emerald-800/60 border border-emerald-700/50 text-emerald-300 font-bold py-2.5 rounded-xl text-sm active:scale-95 transition-all">
                        ⏱ Iniciar conteo
                    </button>`;
                return;
            }

            const seg = sesion.segundos_restantes;
            const fin = new Date(sesion.fin_previsto)
                .toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });

            let color = 'text-emerald-400';
            let nota = `Termina a las ${fin}`;
            if (sesion.fase === 'por_terminar') {
                color = 'text-amber-400';
                nota = `Termina a las ${fin} — avisando en la TV`;
            } else if (sesion.fase === 'cortesia') {
                color = 'text-orange-400';
                nota = `Tiempo agotado · cortesía de ${sesion.minutos_gracia} min`;
            } else if (sesion.fase === 'terminada') {
                color = 'text-red-400';
                nota = 'Sesión finalizada en la TV';
            }

            cont.innerHTML = `
                <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-1">Tiempo restante</p>
                <div class="text-3xl font-black ${color} mb-1">${formatRestante(seg)}</div>
                <p class="text-zinc-600 text-[11px] mb-3">${nota}</p>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="extenderTiempo(30)"
                        class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 font-bold py-2 rounded-lg text-xs active:scale-95 transition-all">+30 min</button>
                    <button onclick="extenderTiempo(60)"
                        class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700 text-zinc-300 font-bold py-2 rounded-lg text-xs active:scale-95 transition-all">+1 hora</button>
                    <button onclick="extenderTiempo(-15)"
                        class="bg-zinc-800/80 hover:bg-zinc-700 border border-zinc-700 text-zinc-500 font-bold py-2 rounded-lg text-xs active:scale-95 transition-all">−15 min</button>
                </div>`;
        }

        async function programarTiempo() {
            const hhmm = document.getElementById('inicioSesion').value;
            const horas = Number(document.getElementById('horasSesion').value);
            if (!hhmm || !(horas > 0)) return;

            const [h, m] = hhmm.split(':').map(Number);
            const inicio = new Date();
            inicio.setHours(h, m, 0, 0);

            // Si la hora ya paso hace mucho, es de la madrugada siguiente:
            // a las 00:30 poner "23:00" significa anoche, no dentro de 22h.
            const doceHoras = 12 * 3600000;
            if (Date.now() - inicio.getTime() > doceHoras) {
                inicio.setDate(inicio.getDate() + 1);
            }

            pintarPanelSesion(await llamarSesion('programar', {
                inicio: inicio.toISOString(),
                horas
            }));
        }

        async function extenderTiempo(minutos) {
            pintarPanelSesion(await llamarSesion('extender', { minutos }));
        }

        async function refrescarPanelSesion(forzarPin) {
            if (forzarPin) pinOperador(true);
            pintarPanelSesion(await llamarSesion('estado'));
        }

        async function abrirSesion() {
            const nombre = prompt('Nombre del grupo (opcional):') || '';
            pintarPanelSesion(await llamarSesion('abrir', { nombre }));
        }

        async function cerrarSesion() {
            if (!confirm('¿Cerrar la sesión? Los clientes tendrán que pedir un código nuevo.')) return;
            const r = await llamarSesion('cerrar');
            if (r && r.ok) return refrescarPanelSesion(false);
            pintarPanelSesion(r);
        }

        function actualizarDisplayTono() {
            const texto = semitonosAdmin > 0 ? `+${semitonosAdmin}` : `${semitonosAdmin}`;
            tonoDisplay.innerText = texto;
            tonoDisplay.className = tonoDisplay.className.replace(/text-(amber|blue|rose)-\d+/g, '');
            if (semitonosAdmin > 0) tonoDisplay.classList.add('text-rose-400');
            else if (semitonosAdmin < 0) tonoDisplay.classList.add('text-blue-400');
            else tonoDisplay.classList.add('text-amber-400');
            tonoDisplay.classList.remove('tono-flash');
            void tonoDisplay.offsetWidth;
            tonoDisplay.classList.add('tono-flash');
        }

        function enviarTono(delta) {
            semitonosAdmin = Math.max(-6, Math.min(6, semitonosAdmin + delta));
            actualizarDisplayTono();
            channel.send({
                type: 'broadcast',
                event: 'control',
                payload: { accion: 'tono', delta: delta }
            }).then(() => {
                console.log(`Tono ${delta > 0 ? '+' : ''}${delta} enviado a la TV.`);
            });
        }

        function enviarResetTono() {
            semitonosAdmin = 0;
            actualizarDisplayTono();
            channel.send({
                type: 'broadcast',
                event: 'control',
                payload: { accion: 'reset_tono' }
            }).then(() => {
                console.log('Reset de tono enviado a la TV.');
            });
        }

        function enviarComando(accion) {
            if (accion === 'saltar') {
                semitonosAdmin = 0;
                actualizarDisplayTono();
            }
            channel.send({
                type: 'broadcast',
                event: 'control',
                payload: { accion: accion }
            }).then(() => {
                console.log(`Comando '${accion}' enviado a la TV.`);
            });
        }

        function enviarEfecto(sonido) {
            channel.send({
                type: 'broadcast',
                event: 'control',
                payload: { accion: 'efecto', valor: sonido }
            }).then(() => {
                console.log(`Efecto '${sonido}' enviado a la TV.`);
            });
        }

        async function actualizarCola() {
            const { data } = await supabaseClient
                .from('Solicitudes')
                .select('cancion_info, nombre_usuario')
                .eq('estado', 'pendiente')
                .order('id', { ascending: true });

            const adminQueue = document.getElementById('adminQueue');
            if (!data || data.length === 0) {
                adminQueue.innerHTML = `<p class="text-zinc-600 italic text-sm">No hay canciones en espera.</p>`;
                return;
            }

            adminQueue.innerHTML = data.map((s, i) =>
                `<div class="truncate py-0.5"><span class="text-amber-500 font-bold mr-1">${i + 1}.</span>${s.cancion_info} <span class="text-zinc-500 text-xs">(${s.nombre_usuario})</span></div>`
            ).join('');
        }

        channel
            .on('broadcast', { event: 'control' }, ({ payload }) => {
                if (payload.accion === 'autovol' && payload.valor !== undefined) {
                    actualizarBarraAutoVol(payload.valor);
                }
                if (payload.accion === 'sync_tono') {
                    semitonosAdmin = payload.valor ?? 0;
                    actualizarDisplayTono();
                }
            })
            .subscribe();

        supabaseClient.channel('admin-queue-sync').on('postgres_changes', { event: '*', schema: 'public', table: 'Solicitudes' }, actualizarCola).subscribe();

        actualizarCola();
        refrescarPanelSesion(false);
    </script>

    <!-- ── Alerta operador (módulo aislado) ─────────────────────────────── -->
    <style>
        .btn-panico-operador {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid rgba(127, 29, 29, 0.55);
            border-radius: 0.75rem;
            background: linear-gradient(180deg, rgba(69, 10, 10, 0.92) 0%, rgba(120, 53, 15, 0.88) 100%);
            color: #fecaca;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.12s ease, opacity 0.2s ease;
        }
        .btn-panico-operador:hover:not(:disabled) {
            background: linear-gradient(180deg, rgba(91, 15, 15, 0.96) 0%, rgba(146, 64, 14, 0.92) 100%);
            color: #fff7ed;
        }
        .btn-panico-operador:active:not(:disabled) {
            transform: scale(0.98);
        }
        .btn-panico-operador:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            background: rgba(39, 39, 42, 0.95);
            border-color: rgba(63, 63, 70, 0.8);
            color: #a1a1aa;
        }
        .btn-panico-operador .panico-icon {
            font-size: 1.1rem;
            line-height: 1;
        }
    </style>

    <script>
        (function () {
            'use strict';

            const COOLDOWN_SEGUNDOS = 180;
            const TEXTO_NORMAL = 'Llamar al Operador';

            const btnPanico = document.getElementById('btnPanicoOperador');
            const btnPanicoTexto = document.getElementById('btnPanicoOperadorTexto');
            let cooldownTimer = null;
            let segundosRestantes = 0;

            async function enviarAlertaTelegram() {
                try {
                    const response = await fetch('/api/alerta-operador', { method: 'POST' });
                    if (response.ok) {
                        console.log('Alerta enviada con éxito');
                    } else {
                        const data = await response.json().catch(() => ({}));
                        const motivo = data.telegramDescription || data.details?.description || data.error;
                        console.error('Error al enviar alerta:', response.status, motivo, data);
                    }
                } catch (error) {
                    console.error('Error crítico de red:', error);
                }
            }

            function actualizarTextoCooldown() {
                btnPanicoTexto.textContent = `Operador Notificado... (${segundosRestantes} s)`;
            }

            function iniciarCooldown() {
                segundosRestantes = COOLDOWN_SEGUNDOS;
                btnPanico.disabled = true;
                actualizarTextoCooldown();

                if (cooldownTimer) clearInterval(cooldownTimer);

                cooldownTimer = setInterval(() => {
                    segundosRestantes -= 1;
                    if (segundosRestantes <= 0) {
                        clearInterval(cooldownTimer);
                        cooldownTimer = null;
                        btnPanico.disabled = false;
                        btnPanicoTexto.textContent = TEXTO_NORMAL;
                        return;
                    }
                    actualizarTextoCooldown();
                }, 1000);
            }

            btnPanico.addEventListener('click', () => {
                if (btnPanico.disabled) return;
                enviarAlertaTelegram();
                iniciarCooldown();
            });
        })();
    </script>
</body>
</html>
