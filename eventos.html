<style>
    html { scroll-behavior: smooth; }
    section[id] { scroll-margin-top: 1rem; }

    .degradado-marca {
        background: linear-gradient(100deg, #FF5A1F 0%, #FF8000 45%, #FFC000 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .resplandor { position: relative; isolation: isolate; }
    .resplandor::before {
        content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background:
            radial-gradient(60% 50% at 15% 0%,   rgba(255,128,0,.16), transparent 70%),
            radial-gradient(50% 45% at 90% 100%, rgba(240,51,140,.10), transparent 70%);
    }

    /* El velo de la portada. En pantalla ancha va en horizontal: oscuro a la
       izquierda, donde esta el texto, y claro a la derecha, donde se ve la
       fiesta. La segunda capa, vertical, funde la foto con el negro de abajo. */
    .velo-fiesta {
        background:
            linear-gradient(to right,
                rgba(13,11,9,.94) 0%,  rgba(13,11,9,.86) 28%,
                rgba(13,11,9,.52) 55%, rgba(13,11,9,.26) 80%,
                rgba(13,11,9,.24) 100%),
            linear-gradient(to bottom,
                rgba(13,11,9,.60) 0%,  rgba(13,11,9,.08) 22%,
                rgba(13,11,9,.38) 70%, rgb(13,11,9) 100%);
    }
    /* El encuadre de la portada.
       En pantalla ancha la seccion es mucho mas baja que la foto (la foto es
       4:3 y el hueco sale casi 2.4:1), asi que un recorte centrado se come por
       arriba las caras de las que cantan, que es lo unico que no puede faltar.
       Se sube el encuadre a la cuarta parte.
       En movil NO se toca: ahi el hueco es alto y se ven enteras. */
    .foto-fiesta { object-position: center; }
    @media (min-width: 768px) {
        .foto-fiesta { object-position: center 18%; }
    }

    /* En movil el texto cae ENCIMA de la mitad de abajo de la foto, que es la
       parte clara (el vestido, las botellas, el mantel). El velo horizontal no
       sirve ahi: se cambia por uno vertical que deja ver a las que cantan
       arriba y oscurece de la mitad para abajo, donde va el texto. */
    @media (max-width: 767px) {
        .velo-fiesta {
            background: linear-gradient(to bottom,
                rgba(13,11,9,.35) 0%,  rgba(13,11,9,.12) 26%,
                rgba(13,11,9,.72) 46%, rgba(13,11,9,.90) 68%,
                rgb(13,11,9) 100%);
        }
    }

    .aparece { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
    }
</style>

let idioma = 'es';

function escapar(t) {
    return String(t).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    document.querySelectorAll('[data-t]').forEach((el) => {
        const valor = t[el.dataset.t];
        if (typeof valor === 'string') el.textContent = valor;
    });

    document.getElementById('btnArriba').setAttribute('aria-label', t.irArriba);
    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    // Todos los botones llevan al mismo sitio, con el mensaje ya escrito.
    const enlace = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);

    document.getElementById('equipo-lista').innerHTML = t.equipo.map((x) => `

            <svg class="w-8 h-8 text-marca-500 mb-4" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.7" stroke-linecap="round"

            <p class="text-crema-400 text-sm leading-relaxed">${escapar(x.d)}</p>
        </div>`).join('');

    document.getElementById('pasos').innerHTML = t.pasos.map((x) => `
        <div class="aparece text-center">
            <div class="w-14 h-14 rounded-2xl bg-marca-500/10 border border-marca-500/30
                        flex items-center justify-center mx-auto mb-5">
                <span class="text-2xl font-black text-marca-500">${escapar(x.n)}</span>
            </div>
            <h3 class="font-black text-lg mb-2">${escapar(x.t)}</h3>
            <p class="text-crema-400 text-sm leading-relaxed">${escapar(x.d)}</p>
        </div>`).join('');

    document.getElementById('precio-incluye').innerHTML = t.precioIncluye.map((x) => `
        <li class="flex items-start gap-2.5 text-sm text-crema-300">
            <svg class="w-4 h-4 text-marca-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
            <span>${escapar(x)}</span>
        </li>`).join('');

    document.getElementById('preguntas-lista').innerHTML = t.preguntas.map((x) => `
        <div class="bg-noche-950/60 border border-noche-800 rounded-xl p-5">
            <p class="text-crema-100 font-bold mb-1.5">${escapar(x.p)}</p>
            <p class="text-crema-400 text-sm leading-relaxed">${escapar(x.r)}</p>
        </div>`).join('');

    observarAparicion();
    try { localStorage.setItem('kl_idioma', idioma); } catch (e) {}
}

function observarAparicion() {
    const cajas = document.querySelectorAll('.aparece:not(.visible)');
    if (!('IntersectionObserver' in window)) {
        cajas.forEach((c) => c.classList.add('visible'));
        return;
    }
    const ojo = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add('visible'); ojo.unobserve(e.target); }
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    cajas.forEach((c) => ojo.observe(c));
}

// El boton de subir. Se esconde arriba del todo porque ahi no sirve de nada,
// y encima taparia la burbuja de WhatsApp sin motivo.
const btnArriba = document.getElementById('btnArriba');

btnArriba.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

function alDesplazarse() {
    if (window.scrollY > 600) {
        btnArriba.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    } else {
        btnArriba.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }
}
window.addEventListener('scroll', alDesplazarse, { passive: true });
alDesplazarse();

// Los enlaces a secciones de esta misma pagina se desplazan a mano, para que
// la direccion no se llene de "#precio" y quede fea al compartirla.
document.querySelectorAll('a[href^="#"]').forEach((enlace) => {
    enlace.addEventListener('click', (ev) => {
        const destino = document.getElementById(enlace.getAttribute('href').slice(1));
        if (!destino) return;
        ev.preventDefault();
        destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

    idioma = idioma === 'es' ? 'en' : 'es';
    aplicarIdioma();
});
