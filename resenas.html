let idioma = 'es';

// ------------------------------------------------------------------ idioma
function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    document.querySelectorAll('[data-t]').forEach((el) => {
        const v = t[el.dataset.t];

    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

}


// -------------------------------------------------------------------- foto
// Se encoge antes de subirla. Un celular de hoy saca fotos de 4 o 5 MB y no
// hace ninguna falta: en la web se ve a 400 px de alto.
function encogerFoto(archivo) {
    return new Promise((resolve, reject) => {
        const lector = new FileReader();
        lector.onerror = () => reject(new Error('lectura'));
        lector.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error('imagen'));
            img.onload = () => {
                const MAX = 1400;
                let { width: an, height: al } = img;
                if (an > MAX || al > MAX) {
                    const f = Math.min(MAX / an, MAX / al);
                    an = Math.round(an * f);
                    al = Math.round(al * f);
                }
                const lienzo = document.createElement('canvas');
                lienzo.width = an;
                lienzo.height = al;
                lienzo.getContext('2d').drawImage(img, 0, 0, an, al);
                lienzo.toBlob(
                    (b) => b ? resolve(b) : reject(new Error('blob')),
                    'image/jpeg', 0.82
                );
            };
            img.src = lector.result;
        };
        lector.readAsDataURL(archivo);
    });
}

document.getElementById('campoFoto').addEventListener('change', (ev) => {
    const archivo = ev.target.files && ev.target.files[0];
    if (!archivo) return;

    if (!/^image\/(jpeg|png|webp)$/.test(archivo.type)) {
        return mostrarError(TEXTOS[idioma].errorFotoTipo);
    }
    if (archivo.size > 15 * 1024 * 1024) {
        return mostrarError(TEXTOS[idioma].errorFotoGrande);
    }

    fotoElegida = archivo;
    ocultarError();

    const url = URL.createObjectURL(archivo);
    document.getElementById('previaImagen').src = url;
    document.getElementById('previaFoto').classList.remove('hidden');
    document.getElementById('cajaFoto').classList.add('hidden');
});

document.getElementById('btnQuitarFoto').addEventListener('click', () => {
    fotoElegida = null;
    document.getElementById('campoFoto').value = '';
    document.getElementById('previaFoto').classList.add('hidden');
    document.getElementById('cajaFoto').classList.remove('hidden');
});


// ------------------------------------------------------------------ avisos
function mostrarError(texto) {
    const e = document.getElementById('error');
    e.textContent = texto;
    e.classList.remove('hidden');
}
function ocultarError() {
    document.getElementById('error').classList.add('hidden');
}


// ------------------------------------------------------------------ enviar
async function enviar() {
    const t = TEXTOS[idioma];
    const nombre = document.getElementById('campoNombre').value.trim();
    const texto = document.getElementById('campoTexto').value.trim();

    if (nombre.length < 2) return mostrarError(t.errorNombre);
    if (texto.length < 10) return mostrarError(t.errorTexto);

    ocultarError();
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true;
    btn.textContent = t.enviando;

    try {
        let urlFoto = null;

        if (fotoElegida) {
            const comprimida = await encogerFoto(fotoElegida);
            const nombreArchivo = Date.now() + '-' +
                Math.random().toString(36).slice(2, 10) + '.jpg';

            const { error: errSubida } = await cliente.storage
                .from('resenas')
                .upload(nombreArchivo, comprimida, { contentType: 'image/jpeg' });

            if (errSubida) throw errSubida;

            urlFoto = cliente.storage.from('resenas')
                .getPublicUrl(nombreArchivo).data.publicUrl;
        }

        const { error } = await cliente.rpc('dejar_resena', {
            p_nombre: nombre,
            p_texto: texto,
            p_estrellas: puntuacion,
            p_foto: urlFoto
        });
        if (error) throw error;

        document.getElementById('formulario').classList.add('hidden');
        document.getElementById('gracias').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });

    } catch (e) {
        console.warn('[Reseña]', e.message);
        mostrarError(t.errorEnvio);
        btn.disabled = false;
        btn.textContent = t.btnEnviar;
    }
}
