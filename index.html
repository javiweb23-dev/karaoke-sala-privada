<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control VIP - MiKaraokeLatino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .portada-slot img { transition: opacity 0.35s ease-out; }
        .genre-slider-wrap { scroll-behavior: smooth; scrollbar-width: none; -ms-overflow-style: none; }
        .genre-slider-wrap::-webkit-scrollbar { display: none; }
    </style>
    <script src="canciones.js"></script>
    <script src="videos_disponibles.js"></script>

</head>
<body class="bg-zinc-950 text-zinc-100 h-screen overflow-hidden flex flex-col font-sans select-none relative">

    <div id="nameModal" class="fixed inset-0 bg-black/90 z-[100] flex flex-col justify-center items-center p-6 hidden">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold text-amber-400 mb-2">¡Bienvenido!</h2>
            <p class="text-zinc-400 text-sm mb-6">Ingresa tu nombre para pedir canciones</p>
            <input type="text" id="userNameInput" placeholder="Ej: María, Carlos..." class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-3 px-4 text-white font-bold text-center mb-4 focus:outline-none focus:border-amber-500">
            <button onclick="guardarNombre()" class="w-full bg-amber-500 text-black font-black py-3 rounded-xl active:scale-95 transition-all">ENTRAR A LA SALA</button>
        </div>
    </div>

    <!-- Va por encima del modal de nombre: primero se demuestra estar en la
         sala, despues se pregunta quien eres. -->
    <div id="codeModal" class="fixed inset-0 bg-black/95 z-[110] flex flex-col justify-center items-center p-6 hidden">
        <div class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold text-amber-400 mb-2">Código de sala</h2>
            <p class="text-zinc-400 text-sm mb-6 leading-relaxed">
                Escribe los 4 números que aparecen en la pantalla del televisor
            </p>
            <input type="tel" id="codeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4"
                placeholder="0000" autocomplete="off"
                class="w-full bg-zinc-950 border border-zinc-700 rounded-xl py-4 px-4 text-white font-black text-4xl text-center tracking-[0.3em] mb-4 focus:outline-none focus:border-amber-500">
            <button onclick="validarCodigoSala()" id="codeBtn"
                class="w-full bg-amber-500 text-black font-black py-3 rounded-xl active:scale-95 transition-all">
                ENTRAR
            </button>
            <p id="codeError" class="text-red-400 text-xs font-bold mt-4 h-4"></p>
        </div>
    </div>

    <div id="statusAlert" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-[200] rounded-xl p-4 text-center text-sm font-bold shadow-2xl transition-all duration-300 opacity-0 pointer-events-none translate-y-4"></div>

    <div id="pageScroll" class="flex-1 min-h-0 overflow-y-auto overscroll-y-contain">
        <header class="bg-zinc-900 border-b border-zinc-800 w-full shrink-0">
            <div class="max-w-md mx-auto px-4 py-3 flex flex-col items-center justify-center gap-1.5">
                <img src="logo.png" alt="Mi Karaoke Latino" class="h-16 w-auto max-w-[85%] object-contain">
                <p id="displayNombre" class="text-xs text-zinc-400 text-center tracking-wide">Cantante: -</p>
            </div>
        </header>

        <div class="sticky top-0 z-40 bg-zinc-950 border-b border-zinc-800/80 shadow-lg shadow-black/40">
            <div class="max-w-md w-full mx-auto px-4 py-3 space-y-3">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                    <h3 class="text-zinc-400 text-xs font-bold mb-2 uppercase tracking-wider">Canciones en Cola</h3>
                    <div id="liveQueue" class="flex flex-col gap-1 text-sm text-zinc-300">
                        <p class="text-zinc-600 italic">No hay canciones en espera.</p>
                    </div>
                </div>

                <div class="relative">
                    <input type="text" id="searchBar" placeholder="Busca artista, canción, género o idioma..." 
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-xl py-3.5 px-4 pl-11 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-amber-500 transition-all text-base">
                    <span class="absolute left-4 top-3.5 text-zinc-500">🔍</span>
                </div>

                <div class="flex items-center gap-1.5">
                    <button type="button" id="genreScrollPrev" aria-label="Géneros anteriores"
                        class="shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-300 hover:bg-zinc-700 hover:text-white active:scale-95 transition-all text-sm font-bold">&lt;</button>
                    <div id="genreSlider" class="genre-slider-wrap flex-1 min-w-0 flex gap-2 overflow-x-auto py-0.5"></div>
                    <button type="button" id="genreScrollNext" aria-label="Géneros siguientes"
                        class="shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-zinc-800 border border-zinc-700 text-zinc-300 hover:bg-zinc-700 hover:text-white active:scale-95 transition-all text-sm font-bold">&gt;</button>
                </div>
            </div>
        </div>

        <main class="max-w-md w-full mx-auto px-4 pb-6 pt-3">
            <div class="flex flex-col gap-2" id="songList"></div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = "https://mefrjbmjfdphdqndpzcw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let miNombre = localStorage.getItem('karaoke_nombre');
        let cancionesPopulares = [];
        let generoActivo = 'Todos';
        let pedidoEnCurso = false;

        const CHIP_GENERO_INACTIVO = 'genre-chip shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wide whitespace-nowrap bg-zinc-800 border border-zinc-700 text-zinc-300 hover:bg-zinc-700 hover:text-zinc-100 transition-all active:scale-95';
        const CHIP_GENERO_ACTIVO   = 'genre-chip shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wide whitespace-nowrap bg-amber-500 border border-amber-400 text-black shadow-sm shadow-amber-500/20 transition-all active:scale-95';

        function sinAcentos(texto) {
            return (texto || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        // El modal de nombre ya no se abre solo: primero hay que pasar el
        // control de sala (si es que hay una sesion abierta).
        function mostrarGateNombre() {
            if (!miNombre) {
                document.getElementById('nameModal').classList.remove('hidden');
            } else {
                document.getElementById('displayNombre').innerText = `Cantante: ${miNombre}`;
            }
        }

        if (miNombre) {
            document.getElementById('displayNombre').innerText = `Cantante: ${miNombre}`;
        }

        function guardarNombre() {
            const input = document.getElementById('userNameInput').value.trim();
            if (input.length > 1) {
                miNombre = input.toUpperCase();
                localStorage.setItem('karaoke_nombre', miNombre);
                document.getElementById('displayNombre').innerText = `Cantante: ${miNombre}`;
                document.getElementById('nameModal').classList.add('hidden');
            }
        }

        // ------------------------------------------------------------------
        // Control de sala
        //
        // No se pregunta DONDE esta el cliente, sino si esta AQUI Y AHORA: el
        // codigo solo se ve en la TV de la sala. Cero permisos de GPS, cero
        // contraseñas que inventar, y quien vino ayer queda fuera solo cuando
        // el operador cierra la sesion.
        //
        // Es opcional: sin sesion abierta no se le pide codigo a nadie y todo
        // funciona igual que siempre.
        // ------------------------------------------------------------------

        let sesionSalaId = null;

        async function verificarSesionSala() {
            let activa = null;
            try {
                // La vista solo expone el id: el codigo NO es consultable desde
                // el navegador, o el control no serviria de nada.
                const { data, error } = await supabaseClient
                    .from('sesion_activa')
                    .select('id')
                    .limit(1);
                if (error) throw error;
                activa = data && data.length ? data[0] : null;
            } catch (e) {
                // Si la tabla no existe todavia (SQL sin correr), no bloqueamos
                // a nadie: el sistema sigue funcionando como antes.
                console.warn('[Sala] Sin control de sesion:', e.message || e);
                sesionSalaId = null;
                return true;
            }

            if (!activa) {
                sesionSalaId = null;
                return true;
            }

            sesionSalaId = activa.id;

            if (Number(localStorage.getItem('karaoke_sesion_id')) === activa.id) {
                return true;
            }

            localStorage.removeItem('karaoke_sesion_id');
            document.getElementById('codeModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('codeInput').focus(), 100);
            return false;
        }

        async function validarCodigoSala() {
            const input = document.getElementById('codeInput');
            const btn = document.getElementById('codeBtn');
            const err = document.getElementById('codeError');
            const codigo = input.value.replace(/\D/g, '');

            if (codigo.length !== 4) {
                err.innerText = 'Son 4 números';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'VERIFICANDO...';
            err.innerText = '';

            let data;
            try {
                const res = await fetch('/api/validar-codigo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ codigo })
                });
                data = await res.json();
            } catch (e) {
                data = { ok: false, error: 'Sin conexión' };
            }

            btn.disabled = false;
            btn.textContent = 'ENTRAR';

            if (!data.ok) {
                err.innerText = data.error || 'Código incorrecto';
                input.value = '';
                input.focus();
                return;
            }

            if (data.sesion_id) {
                localStorage.setItem('karaoke_sesion_id', String(data.sesion_id));
                sesionSalaId = data.sesion_id;
            }

            document.getElementById('codeModal').classList.add('hidden');
            mostrarGateNombre();
        }

        const cachePortadas = new Map();
        const pendientesPortadas = new Map();

        function identificadorPortada(song) {
            return `${(song.artista || '').trim()} - ${(song.titulo || '').trim()}`.toUpperCase();
        }

        async function consultarPortadaCache(identificador) {
            const { data, error } = await supabaseClient
                .from('portadas_cache')
                .select('caratula_url')
                .eq('identificador', identificador)
                .maybeSingle();
            if (error) {
                console.error("Error en Supabase:", error);
                return undefined;
            }
            if (!data) return undefined;
            return data.caratula_url;
        }

        async function guardarPortadaCache(identificador, url) {
            const { error } = await supabaseClient
                .from('portadas_cache')
                .upsert(
                    { identificador: identificador, caratula_url: url },
                    { onConflict: 'identificador' }
                );
            if (error) console.error("Error en Supabase:", error);
        }

        function htmlFallbackPortada() {
            return `<div class="w-16 h-16 rounded-lg bg-gradient-to-tr from-zinc-800 to-zinc-700 flex items-center justify-center shadow-md border border-zinc-600/50"><span class="text-2xl text-amber-400 drop-shadow-md" aria-hidden="true">🎤</span></div>`;
        }

        async function obtenerPortadaItunes(song) {
            const identificador = identificadorPortada(song);
            if (cachePortadas.has(identificador)) return cachePortadas.get(identificador);
            if (pendientesPortadas.has(identificador)) return pendientesPortadas.get(identificador);

            const promesa = (async () => {
                let intentosItunes = {};
                try {
                    intentosItunes = JSON.parse(localStorage.getItem('intentos_itunes') || '{}');
                } catch {
                    intentosItunes = {};
                }

                const urlCache = await consultarPortadaCache(identificador);
                if (urlCache !== undefined) {
                    if (urlCache === 'no_encontrado') return null;
                    return urlCache;
                }

                try {
                    const term = encodeURIComponent(`${song.artista} ${song.titulo}`);
                    const res = await fetch(`https://itunes.apple.com/search?term=${term}&entity=song&limit=1`);
                    if (!res.ok) {
                        intentosItunes[identificador] = (intentosItunes[identificador] || 0) + 1;
                        localStorage.setItem('intentos_itunes', JSON.stringify(intentosItunes));
                        if (intentosItunes[identificador] >= 10) {
                            await guardarPortadaCache(identificador, 'no_encontrado');
                        }
                        return null;
                    }
                    const json = await res.json();
                    if (!json.results || json.results.length === 0) {
                        await guardarPortadaCache(identificador, 'no_encontrado');
                        return null;
                    }
                    const urlItunes = json.results[0].artworkUrl100 || null;
                    if (urlItunes) {
                        await guardarPortadaCache(identificador, urlItunes);
                        return urlItunes;
                    }
                    await guardarPortadaCache(identificador, 'no_encontrado');
                    return null;
                } catch {
                    intentosItunes[identificador] = (intentosItunes[identificador] || 0) + 1;
                    localStorage.setItem('intentos_itunes', JSON.stringify(intentosItunes));
                    if (intentosItunes[identificador] >= 10) {
                        await guardarPortadaCache(identificador, 'no_encontrado');
                    }
                    return null;
                }
            })();

            pendientesPortadas.set(identificador, promesa);
            const url = await promesa;
            pendientesPortadas.delete(identificador);
            if (url !== null) {
                cachePortadas.set(identificador, url);
            } else {
                let intentosCheck = {};
                try {
                    intentosCheck = JSON.parse(localStorage.getItem('intentos_itunes') || '{}');
                } catch {
                    intentosCheck = {};
                }
                if ((intentosCheck[identificador] || 0) >= 10) {
                    cachePortadas.set(identificador, null);
                }
            }
            return url;
        }

        async function cargarPortadaLazy(portadaSlot, song) {
            // Las de YouTube ya traen su propia miniatura: sale gratis y evita
            // consultarle a iTunes por un "artista" que es un canal.
            const url = song.fuente === 'youtube' && song.video_id
                ? `https://i.ytimg.com/vi/${encodeURIComponent(song.video_id)}/mqdefault.jpg`
                : await obtenerPortadaItunes(song);
            if (!portadaSlot?.isConnected) return;

            if (!url) return;

            const img = new Image();
            img.alt = '';
            img.className = 'w-16 h-16 rounded-lg object-cover shadow-md border border-zinc-700/40 opacity-0';

            await new Promise(resolve => {
                img.onload = resolve;
                img.onerror = resolve;
                img.src = url;
                if (img.complete) resolve();
            });

            if (!portadaSlot.isConnected) return;

            portadaSlot.innerHTML = '';
            portadaSlot.appendChild(img);
            requestAnimationFrame(() => img.classList.replace('opacity-0', 'opacity-100'));
        }

        const observerPortadas = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;

                const card = entry.target;
                if (card.dataset.portadaProcesada === 'true') {
                    observerPortadas.unobserve(card);
                    return;
                }

                if (!card.dataset.artista || !card.dataset.titulo) {
                    card.dataset.portadaProcesada = 'true';
                    observerPortadas.unobserve(card);
                    return;
                }

                const song = {
                    artista: card.dataset.artista,
                    titulo: card.dataset.titulo
                };
                const portadaSlot = card.querySelector('[data-portada]');

                cargarPortadaLazy(portadaSlot, song).finally(() => {
                    card.dataset.portadaProcesada = 'true';
                    observerPortadas.unobserve(card);
                });
            });
        }, { root: null, rootMargin: '100px', threshold: 0.05 });

        async function cargarCancionesPopulares() {
            const { data, error } = await supabaseClient
                .from('canciones_populares')
                .select('identificador')
                .gte('total_pedidos', 10);

            if (error) {
                console.warn('No se pudieron cargar canciones populares:', error);
                cancionesPopulares = [];
                return;
            }

            cancionesPopulares = (data || []).map(fila => fila.identificador);
        }

        function esCancionPopular(titulo, artista) {
            return cancionesPopulares.includes(`${titulo} - ${artista}`);
        }

        function claveArchivoCancion(song) {
            return `${song.artista.toUpperCase()} - ${song.titulo.toUpperCase()}`;
        }

        // El catalogo local mas lo que el agente nocturno fue resolviendo.
        function catalogoCompleto() {
            const extra = (typeof window !== 'undefined' && Array.isArray(window.CANCIONES_YOUTUBE))
                ? window.CANCIONES_YOUTUBE
                : [];
            return extra.length ? cancionesREAL.concat(extra) : cancionesREAL;
        }

        function cancionTieneVideo(song) {
            // Las de YouTube no tienen archivo, y no hace falta: tienen video_id.
            if (song.fuente === 'youtube') return Boolean(song.video_id);
            if (typeof VIDEOS_DISPONIBLES === 'undefined' || !VIDEOS_DISPONIBLES) return true;
            const clave = claveArchivoCancion(song);
            if (VIDEOS_DISPONIBLES[clave]) return true;
            if (typeof VIDEOS_DISPONIBLES_NORM !== 'undefined' && VIDEOS_DISPONIBLES_NORM) {
                const norm = sinAcentos(clave).toUpperCase();
                if (VIDEOS_DISPONIBLES_NORM[norm]) return true;
            }
            return false;
        }

        function obtenerGenerosUnicos() {
            const generos = new Set();
            for (const c of catalogoCompleto()) {
                if (!cancionTieneVideo(c)) continue;
                const g = (c.genero || '').trim();
                if (g) generos.add(g);
            }
            return [...generos].sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
        }

        function actualizarChipsGenero() {
            document.querySelectorAll('.genre-chip').forEach(chip => {
                const activo = chip.dataset.genero === generoActivo;
                chip.className = activo ? CHIP_GENERO_ACTIVO : CHIP_GENERO_INACTIVO;
            });
        }

        function seleccionarGenero(genero) {
            generoActivo = genero;
            actualizarChipsGenero();
            aplicarFiltros();
        }

        function filtrarCanciones() {
            const q = sinAcentos(document.getElementById('searchBar').value);
            return catalogoCompleto().filter(c => {
                if (!cancionTieneVideo(c)) return false;
                const coincideGenero = generoActivo === 'Todos'
                    || sinAcentos(c.genero) === sinAcentos(generoActivo);
                if (!coincideGenero) return false;
                if (!q) return true;
                return sinAcentos(c.artista).includes(q)
                    || sinAcentos(c.titulo).includes(q)
                    || sinAcentos(c.genero).includes(q)
                    || sinAcentos(c.idioma).includes(q);
            });
        }

        function aplicarFiltros() {
            cargarCanciones(filtrarCanciones());
        }

        // ------------------------------------------------------------------
        // Canciones que no estan en el catalogo
        // ------------------------------------------------------------------

        // Los titulos de YouTube son texto de terceros: nunca van crudos al DOM.
        function escaparHtml(texto) {
            return String(texto == null ? '' : texto)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDuracion(seg) {
            const s = Number(seg) || 0;
            const m = Math.floor(s / 60);
            return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
        }

        // PASO 1: dejar constancia de lo que la gente pide y no tenemos.
        // Corre siempre, aunque la busqueda en YouTube no este configurada:
        // es lo que alimenta el catalogo mas adelante.
        async function registrarBusquedaFallida(consulta) {
            try {
                await supabaseClient.rpc('registrar_busqueda_fallida', {
                    p_consulta: consulta,
                    p_norm: sinAcentos(consulta).toUpperCase(),
                    p_usuario: miNombre || null
                });
            } catch (e) {
                console.warn('No se pudo registrar la busqueda:', e);
            }
        }

        function htmlSinResultados() {
            const q = document.getElementById('searchBar').value.trim();

            if (!q) {
                return `<p class="text-center text-zinc-600 italic py-6">No se encontraron resultados</p>`;
            }

            return `
                <div class="text-center py-10 px-4">
                    <p class="text-zinc-400 text-[15px] font-medium mb-1.5">
                        No tenemos <span class="text-zinc-200">"${escaparHtml(q)}"</span> en el catálogo
                    </p>
                    <p class="text-zinc-600 text-xs mb-6 leading-relaxed">
                        Podemos buscarla en YouTube y ponerla igual
                    </p>
                    <button id="btnBuscarYoutube"
                        class="bg-red-600 hover:bg-red-500 text-white font-bold px-6 py-3.5 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-red-900/30">
                        🔎 Buscarla en YouTube
                    </button>
                </div>`;
        }

        async function buscarEnYouTube() {
            const consulta = document.getElementById('searchBar').value.trim();
            if (consulta.length < 3) return;

            const songList = document.getElementById('songList');
            const btn = document.getElementById('btnBuscarYoutube');
            if (btn) {
                btn.disabled = true;
                btn.textContent = 'Buscando...';
            }

            // El registro va primero y no bloquea: aunque YouTube falle,
            // el dato de "esto lo pidieron y no lo teniamos" queda guardado.
            registrarBusquedaFallida(consulta);

            let data;
            try {
                const res = await fetch('/api/buscar-youtube', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ consulta })
                });
                data = await res.json();
            } catch (e) {
                console.error('Error buscando en YouTube:', e);
                data = { ok: false };
            }

            if (!data || !data.ok) {
                const msg = data && data.motivo === 'quotaExceeded'
                    ? 'Se agotaron las búsquedas de hoy. Avísale al operador.'
                    : 'No se pudo buscar ahora mismo.';
                songList.innerHTML = htmlAvisoBusqueda(consulta, msg);
                return;
            }

            // Todavía sin API key: el paso 1 igual cumplió su función.
            if (data.configurado === false) {
                songList.innerHTML = htmlAvisoBusqueda(
                    consulta,
                    '✅ Anotada. La agregamos al catálogo pronto.'
                );
                return;
            }

            if (!data.candidatos || data.candidatos.length === 0) {
                songList.innerHTML = htmlAvisoBusqueda(
                    consulta,
                    'No encontramos un karaoke decente de esa canción. Quedó anotada.'
                );
                return;
            }

            renderizarCandidatos(consulta, data.candidatos);
        }

        function htmlAvisoBusqueda(consulta, mensaje) {
            return `
                <div class="text-center py-10 px-4">
                    <p class="text-zinc-300 text-[15px] font-medium mb-2">${escaparHtml(mensaje)}</p>
                    <p class="text-zinc-600 text-xs mb-6">"${escaparHtml(consulta)}"</p>
                    <button onclick="volverAlCatalogo()"
                        class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold px-5 py-3 rounded-xl text-sm active:scale-95 transition-all">
                        ← Volver al catálogo
                    </button>
                </div>`;
        }

        function volverAlCatalogo() {
            document.getElementById('searchBar').value = '';
            aplicarFiltros();
        }

        function renderizarCandidatos(consulta, candidatos) {
            const songList = document.getElementById('songList');
            songList.innerHTML = '';

            const cabecera = document.createElement('div');
            cabecera.className = 'mb-4 px-1';
            cabecera.innerHTML = `
                <div class="flex items-center justify-between gap-3 mb-1">
                    <h3 class="text-zinc-200 font-bold text-sm">Encontrado en YouTube</h3>
                    <button onclick="volverAlCatalogo()"
                        class="text-zinc-500 hover:text-zinc-300 text-xs font-medium shrink-0">
                        ← Catálogo
                    </button>
                </div>
                <p class="text-zinc-600 text-[11px] leading-relaxed">
                    Elige la versión que prefieras. En estas canciones no se puede ajustar el tono.
                </p>`;
            songList.appendChild(cabecera);

            candidatos.forEach((c, idx) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900/90 border border-zinc-800/90 hover:border-zinc-600 p-3 rounded-2xl flex items-center gap-3 transition-all shadow-sm mb-3';

                const miniatura = c.miniatura
                    ? `<img src="${escaparHtml(c.miniatura)}" alt="" class="w-full h-full object-cover" loading="lazy">`
                    : '<div class="w-full h-full bg-zinc-800"></div>';

                const info = document.createElement('div');
                info.className = 'flex-1 min-w-0';
                info.innerHTML = `
                    <h4 class="font-semibold text-zinc-50 text-[13px] leading-snug line-clamp-2">${escaparHtml(c.titulo)}</h4>
                    <p class="text-[11px] text-zinc-500 mt-1 truncate">${escaparHtml(c.canal)} · ${formatDuracion(c.duracion)}</p>
                    ${idx === 0 ? '<span class="inline-block mt-1.5 text-[9px] uppercase tracking-widest bg-emerald-900/40 border border-emerald-700/50 text-emerald-400 px-2 py-0.5 rounded-full font-bold">Recomendada</span>' : ''}`;

                const thumb = document.createElement('div');
                thumb.className = 'flex-shrink-0 w-20 h-[45px] rounded-lg overflow-hidden bg-zinc-800';
                thumb.innerHTML = miniatura;

                const btn = document.createElement('button');
                btn.className = 'flex-shrink-0 bg-zinc-800 hover:bg-amber-500 hover:text-black text-amber-400 font-bold px-4 py-2.5 rounded-xl text-xs active:scale-95 transition-all';
                btn.textContent = 'Pedir';
                btn.onclick = () => pedirDesdeYouTube(consulta, c, candidatos, btn);

                card.appendChild(thumb);
                card.appendChild(info);
                card.appendChild(btn);
                songList.appendChild(card);
            });
        }

        async function pedirDesdeYouTube(consulta, candidato, todos, btn) {
            // Los demas candidatos viajan como respaldo: si el primero falla en
            // vivo, el reproductor salta al siguiente sin cortar la fiesta.
            const respaldos = todos
                .filter((c) => c.videoId !== candidato.videoId)
                .slice(0, 2)
                .map((c) => c.videoId);

            await pedirCancion(
                candidato.titulo.slice(0, 120),
                candidato.titulo,
                candidato.canal,
                'YOUTUBE',
                btn,
                {
                    fuente: 'youtube',
                    video_id: candidato.videoId,
                    respaldo_ids: respaldos,
                    duracion_seg: candidato.duracion
                }
            );
        }

        function renderizarSliderGeneros() {
            const slider = document.getElementById('genreSlider');
            slider.innerHTML = '';

            const btnTodos = document.createElement('button');
            btnTodos.type = 'button';
            btnTodos.dataset.genero = 'Todos';
            btnTodos.textContent = 'Todos';
            btnTodos.className = generoActivo === 'Todos' ? CHIP_GENERO_ACTIVO : CHIP_GENERO_INACTIVO;
            btnTodos.onclick = () => seleccionarGenero('Todos');
            slider.appendChild(btnTodos);

            for (const genero of obtenerGenerosUnicos()) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.dataset.genero = genero;
                btn.textContent = genero;
                btn.className = generoActivo === genero ? CHIP_GENERO_ACTIVO : CHIP_GENERO_INACTIVO;
                btn.onclick = () => seleccionarGenero(genero);
                slider.appendChild(btn);
            }
        }

        function configurarScrollGeneros() {
            const slider = document.getElementById('genreSlider');
            const paso = () => Math.max(120, Math.round(slider.clientWidth * 0.65));
            document.getElementById('genreScrollPrev').onclick = () => {
                slider.scrollBy({ left: -paso(), behavior: 'smooth' });
            };
            document.getElementById('genreScrollNext').onclick = () => {
                slider.scrollBy({ left: paso(), behavior: 'smooth' });
            };
        }

        function cargarCanciones(lista) {
            const songList = document.getElementById('songList');
            songList.innerHTML = '';
            
            if (lista.length === 0) {
                songList.innerHTML = htmlSinResultados();
                const btnYt = document.getElementById('btnBuscarYoutube');
                if (btnYt) btnYt.onclick = () => buscarEnYouTube();
                return;
            }

            lista.forEach(song => {
                const nombreFormateado = `${song.artista.toUpperCase()} - ${song.titulo.toUpperCase()}`;
                const estrellaPopular = esCancionPopular(song.titulo, song.artista) ? '<span class="shrink-0 text-amber-400 text-sm">⭐</span>' : '';
                const card = document.createElement('div');
                card.className = 'cancion-card bg-zinc-900/90 border border-zinc-800/90 hover:border-zinc-600 p-4 rounded-2xl flex items-center gap-4 transition-all shadow-sm';
                card.dataset.artista = song.artista;
                card.dataset.titulo = song.titulo;

                const portada = document.createElement('div');
                portada.className = 'portada-slot flex-shrink-0 w-16 h-16';
                portada.dataset.portada = 'true';
                portada.innerHTML = htmlFallbackPortada();

                const info = document.createElement('div');
                info.className = 'flex-1 min-w-0 pr-1';
                info.innerHTML = `
                    <h3 class="font-semibold text-zinc-50 text-[15px] leading-snug tracking-tight flex items-center gap-1.5 min-w-0">
                        <span class="truncate">${song.titulo}</span>${estrellaPopular}
                    </h3>
                    <p class="text-[13px] text-zinc-400 mt-1 mb-2.5 truncate font-medium tracking-wide">${song.artista}</p>
                    <div class="flex flex-wrap gap-1.5">
                        <span class="text-[10px] uppercase tracking-widest bg-zinc-800/80 border border-zinc-700/80 text-zinc-400 px-2.5 py-0.5 rounded-full font-medium">${song.genero}</span>
                        <span class="text-[10px] uppercase tracking-widest bg-zinc-800/80 border border-zinc-700/80 text-zinc-400 px-2.5 py-0.5 rounded-full font-medium">${song.idioma}</span>
                    </div>
                `;

                const btn = document.createElement('button');
                btn.className = 'flex-shrink-0 bg-zinc-800 hover:bg-amber-500 hover:text-black text-amber-400 font-bold px-5 py-3 rounded-xl text-sm active:scale-95 transition-all shadow-sm';
                btn.textContent = 'Pedir';
                btn.onclick = () => pedirCancion(
                    nombreFormateado, song.titulo, song.artista, song.genero, btn,
                    song.fuente === 'youtube'
                        ? {
                            fuente: 'youtube',
                            video_id: song.video_id,
                            respaldo_ids: song.respaldo_ids || [],
                            duracion_seg: song.duracion_seg || null
                          }
                        : undefined
                );

                card.appendChild(portada);
                card.appendChild(info);
                card.appendChild(btn);
                songList.appendChild(card);

                observerPortadas.observe(card);
            });

            agregarPieYouTube(songList);
        }

        // Tener resultados no significa tener LA que buscaban: de un artista
        // puede haber una sola cancion en el catalogo y querer otra. Por eso
        // la opcion de YouTube va al final de toda busqueda, no solo cuando
        // no hay ningun resultado.
        function agregarPieYouTube(songList) {
            const q = document.getElementById('searchBar').value.trim();
            if (q.length < 3) return;

            const pie = document.createElement('div');
            pie.className = 'mt-2 mb-4 pt-5 border-t border-zinc-800/80 text-center';
            pie.innerHTML = `
                <p class="text-zinc-600 text-xs mb-3">¿No está la que buscas?</p>
                <button type="button"
                    class="bg-red-600/90 hover:bg-red-500 text-white font-bold px-5 py-3 rounded-xl text-sm active:scale-95 transition-all shadow-lg shadow-red-900/25">
                    🔎 Buscar "${escaparHtml(q)}" en YouTube
                </button>`;

            pie.querySelector('button').onclick = () => buscarEnYouTube();
            songList.appendChild(pie);
        }

        document.getElementById('searchBar').addEventListener('input', () => aplicarFiltros());

        async function actualizarCola() {
            const { data } = await supabaseClient.from('Solicitudes').select('cancion_info, nombre_usuario').eq('estado', 'pendiente').order('id', { ascending: true });
            const liveQueue = document.getElementById('liveQueue');
            if (!data || data.length === 0) {
                liveQueue.innerHTML = `<p class="text-zinc-600 italic">No hay canciones en espera.</p>`;
                return;
            }
            const MAX_COLA = 6;
            const visibles = data.slice(0, MAX_COLA);
            const restantes = data.length - MAX_COLA;
            let html = visibles.map((s, i) => `<div class="truncate"><span class="text-amber-500 font-bold mr-1">${i + 1}.</span> ${s.cancion_info} <span class="text-zinc-500 text-xs">(${s.nombre_usuario})</span></div>`).join('');
            if (restantes > 0) {
                const etiqueta = restantes === 1 ? 'canción' : 'canciones';
                html += `<p class="text-zinc-500 text-xs italic mt-2 pt-2 border-t border-zinc-800 text-center">...y ${restantes} ${etiqueta} más en cola</p>`;
            }
            liveQueue.innerHTML = html;
        }

        async function registrarPopularidad(titulo, artista) {
            const identificador = `${titulo} - ${artista}`;

            const { data: existente, error: errorConsulta } = await supabaseClient
                .from('canciones_populares')
                .select('total_pedidos')
                .eq('identificador', identificador)
                .maybeSingle();

            if (errorConsulta) {
                console.warn('No se pudo consultar canciones_populares:', errorConsulta);
                return;
            }

            if (existente) {
                await supabaseClient
                    .from('canciones_populares')
                    .update({ total_pedidos: existente.total_pedidos + 1 })
                    .eq('identificador', identificador);
            } else {
                await supabaseClient
                    .from('canciones_populares')
                    .insert({ identificador, total_pedidos: 1 });
            }
        }

        // `extra` trae los campos de YouTube (fuente, video_id, respaldos).
        // Si no viene, la solicitud queda como 'local' igual que siempre.
        async function pedirCancion(nombreArchivo, titulo, artista, genero, btn, extra) {
            if (!miNombre) return alert("Por favor ingresa tu nombre primero.");
            if (pedidoEnCurso) return;

            pedidoEnCurso = true;
            const textoBtn = btn ? btn.textContent : 'Pedir';
            if (btn) {
                btn.disabled = true;
                btn.textContent = '...';
            }

            try {
                const { data: dups, error: errDups } = await supabaseClient
                    .from('Solicitudes')
                    .select('id, nombre_usuario')
                    .eq('estado', 'pendiente')
                    .eq('cancion_info', nombreArchivo);

                if (errDups) {
                    console.error('Error al verificar duplicados:', errDups);
                    return mostrarAlerta("❌ Error al verificar la cola. Intenta de nuevo.", true);
                }

                if (dups && dups.length > 0) {
                    const yaLaPedí = dups.some(d => d.nombre_usuario === miNombre);
                    if (yaLaPedí) {
                        return mostrarAlerta("ℹ️ Ya agregaste esta canción a la lista.", true);
                    }
                    return mostrarAlerta("❌ Esta canción ya está en la cola.", true);
                }

                const { count: misTemas, error: errMisTemas } = await supabaseClient
                    .from('Solicitudes')
                    .select('*', { count: 'exact', head: true })
                    .eq('estado', 'pendiente')
                    .eq('nombre_usuario', miNombre);

                if (errMisTemas) {
                    console.error('Error al contar temas del usuario:', errMisTemas);
                    return mostrarAlerta("❌ Error al verificar tu cola. Intenta de nuevo.", true);
                }

                if (misTemas >= 3) {
                    return mostrarAlerta("⚠️ Canta primero las 3 que tienes en cola para seguir pidiendo.", true);
                }

                const { count: totalCola, error: errTotalCola } = await supabaseClient
                    .from('Solicitudes')
                    .select('*', { count: 'exact', head: true })
                    .eq('estado', 'pendiente');

                if (errTotalCola) {
                    console.error('Error al contar cola total:', errTotalCola);
                    return mostrarAlerta("❌ Error al enviar. Intenta de nuevo.", true);
                }

                const solicitud = {
                    nombre_usuario: miNombre,
                    cancion_info: nombreArchivo,
                    genero: genero || null,
                    estado: 'pendiente'
                };

                // Las columnas nuevas solo se mandan si de verdad hacen falta.
                // Asi el sistema sigue pidiendo canciones aunque el SQL de
                // sql/ todavia no se haya ejecutado y las columnas no existan.
                if (sesionSalaId) solicitud.sesion_id = sesionSalaId;
                Object.assign(solicitud, extra || {});

                const { error } = await supabaseClient
                    .from('Solicitudes')
                    .insert([solicitud]);

                if (error) {
                    console.error('Error al insertar solicitud:', error);
                    return mostrarAlerta("❌ No se pudo agregar la canción. Intenta de nuevo.", true);
                }

                // La lista de populares se mide sobre el catalogo propio; meterle
                // nombres de canales de YouTube la ensuciaria.
                if (!extra || extra.fuente !== 'youtube') {
                    await registrarPopularidad(titulo, artista);
                }

                if (totalCola === 0) {
                    mostrarAlerta("✅ ¡Enviada! Comenzará en unos segundos.");
                } else {
                    const minsAprox = totalCola * 3;
                    mostrarAlerta(`✅ ¡En cola! Tienes ${totalCola} canción(es) por delante (Aprox ${minsAprox} min).`);
                }
                actualizarCola();
            } finally {
                pedidoEnCurso = false;
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = textoBtn;
                }
            }
        }

        let alertTimeout;
        function mostrarAlerta(msg, isError = false) {
            const alertBox = document.getElementById('statusAlert');
            alertBox.innerText = msg;
            
            if(isError) {
                alertBox.className = "fixed bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-[200] rounded-xl p-4 text-center text-sm font-bold shadow-2xl transition-all duration-300 pointer-events-none bg-zinc-900 text-red-400 border-2 border-red-500 shadow-red-500/20";
            } else {
                alertBox.className = "fixed bottom-10 left-1/2 transform -translate-x-1/2 w-[90%] max-w-sm z-[200] rounded-xl p-4 text-center text-sm font-bold shadow-2xl transition-all duration-300 pointer-events-none bg-zinc-900 text-emerald-400 border-2 border-emerald-500 shadow-emerald-500/20";
            }

            setTimeout(() => {
                alertBox.classList.remove('opacity-0', 'translate-y-4');
                alertBox.classList.add('opacity-100', 'translate-y-0');
            }, 10);

            clearTimeout(alertTimeout);

            alertTimeout = setTimeout(() => {
                alertBox.classList.remove('opacity-100', 'translate-y-0');
                alertBox.classList.add('opacity-0', 'translate-y-4');
            }, 4000);
        }

        supabaseClient.channel('queue-sync').on('postgres_changes', { event: '*', schema: 'public', table: 'Solicitudes' }, actualizarCola).subscribe();

        document.getElementById('codeInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') validarCodigoSala();
        });

        async function iniciarPagina() {
            // El catalogo se carga detras del modal: cuando el cliente teclea
            // el codigo, la lista ya esta lista y entra de una vez.
            const puedePasar = await verificarSesionSala();
            if (puedePasar) mostrarGateNombre();

            await cargarCancionesPopulares();
            renderizarSliderGeneros();
            configurarScrollGeneros();
            aplicarFiltros();
            actualizarCola();

            // Si el operador cierra la sesion, el celular se entera solo.
            setInterval(verificarSesionSala, 30000);
        }

        iniciarPagina();
    </script>
