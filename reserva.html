<style>
    .degradado-marca {
        background: linear-gradient(100deg, #FF5A1F 0%, #FF8000 45%, #FFC000 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    /* El resplandor de fondo, el mismo recurso del home: una mancha de color
       muy difuminada detras del contenido para que el negro no sea plano. */
    .resplandor { position: relative; isolation: isolate; }
    .resplandor::before {
        content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background:
            radial-gradient(60% 50% at 15% 0%,   rgba(255,128,0,.16), transparent 70%),
            radial-gradient(50% 45% at 90% 100%, rgba(240,51,140,.10), transparent 70%);
    }

    /* Aparecer al bajar. Si el navegador no lleva IntersectionObserver, el
       arranque las deja visibles y no se nota la diferencia. */
    .aparece { opacity: 0; transform: translateY(14px); transition: opacity .6s ease, transform .6s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
    }
</style>

let idioma = 'es';

function escapar(t) {
    return String(t).replace(/[&<>"']/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    document.querySelectorAll('[data-t]').forEach((el) => {
        const valor = t[el.dataset.t];
        if (typeof valor === 'string') el.textContent = valor;
    });

    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    document.getElementById('waDudas').href =
        'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);

    document.getElementById('incluye').innerHTML = t.incluye.map((x) => `
        <li class="flex items-start gap-2.5">
            <svg class="w-4 h-4 text-marca-500 flex-shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
            <span>${escapar(x)}</span>
        </li>`).join('');

    document.getElementById('saberLista').innerHTML = t.saber.map((x) => `
        <div>
            <p class="text-crema-100 font-bold text-sm mb-1.5">${escapar(x.p)}</p>
            <p class="text-crema-400 text-sm leading-relaxed">${escapar(x.r)}</p>
        </div>`).join('');

    // El formulario tambien tiene texto dentro. Vive en reserva-comun.js,
    // que carga DESPUES de este script: en la primera pasada no existe.
    if (typeof resRefrescarTextos === 'function') resRefrescarTextos();

    observarAparicion();
    try { localStorage.setItem('kl_idioma', idioma); } catch (e) {}
}

// Lo que va apareciendo al bajar.
function observarAparicion() {
    const cajas = document.querySelectorAll('.aparece:not(.visible)');
    if (!('IntersectionObserver' in window)) {
        cajas.forEach((c) => c.classList.add('visible'));
        return;
    }
    const ojo = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => {
            if (e.isIntersecting) { e.target.classList.add('visible'); ojo.unobserve(e.target); }
        });
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    cajas.forEach((c) => ojo.observe(c));
}

document.getElementById('btnIdioma').addEventListener('click', () => {
    idioma = idioma === 'es' ? 'en' : 'es';
    aplicarIdioma();
});

document.getElementById('anio').textContent = new Date().getFullYear();

// Si ya eligio idioma en el home, se respeta: es la misma visita. Si no,
// SIEMPRE castellano, por el mismo motivo que en el home: un venezolano con
// el telefono en ingles es mas probable que un turista.
try {
    const guardado = localStorage.getItem('kl_idioma');
    if (guardado === 'es' || guardado === 'en') idioma = guardado;
} catch (e) {}

aplicarIdioma();
