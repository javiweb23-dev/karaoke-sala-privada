<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR de la Tienda - Para imprimir</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        /* Cartel de una sola cosa, aparte del de los codigos del karaoke: este
           se cuelga en el area, donde hay gente que no viene a cantar y a la
           que el cartel del karaoke no le dice nada. */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #fff;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }
        .cartel {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 20px;
            padding: 45px 35px;
            max-width: 430px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(255, 102, 0, 0.2);
        }
        .cartel h1 {
            color: #ff6600;
            font-size: 2.1em;
            margin: 0 0 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.15;
        }
        .cartel .sub { color: #aaa; font-size: 1.15em; margin: 0 0 28px; }
        .qr-box {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            display: inline-block;
            line-height: 0;
        }
        .pasos {
            color: #888;
            font-size: 0.95em;
            margin: 26px 0 0;
            line-height: 1.7;
        }
        .url {
            color: #ff6600;
            font-weight: bold;
            word-break: break-all;
            margin-top: 18px;
            font-size: 0.95em;
        }
        .btn-print {
            margin-top: 40px;
            background: #ff6600;
            color: #fff;
            padding: 15px 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-print:hover { background: #e65c00; }
        .nota { color: #666; font-size: 0.85em; margin-top: 14px; }

        @media print {
            body { background: #fff; color: #000; padding: 0; }
            .cartel { border: 2px solid #ccc; background: #fff; box-shadow: none; }
            .cartel h1 { color: #000; }
            .cartel .sub, .pasos { color: #333; }
            .url { color: #000; }
            .btn-print, .nota { display: none; }
        }
    </style>
</head>
<body>

    <div class="cartel">
        <h1>Pedir refrigerios<br>y otros</h1>
        <p class="sub">🛒 Hielo, refrescos, vasos y más</p>

        <div class="qr-box" id="qr"></div>

        <p class="pasos">
            Apunta la cámara de tu teléfono al código<br>
            y pide sin levantarte.<br>
            <strong style="color:#ccc;">No hace falta clave ni entrar al karaoke.</strong>
        </p>

        <div class="url" id="urlTexto"></div>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ Imprimir este cartel</button>
    <p class="nota">
        También puedes tomarle una captura al cartel y enviarlo por WhatsApp.
    </p>

    <script>
        // La direccion esta escrita una sola vez y de ahi salen el codigo y el
        // texto de abajo: asi no pueden acabar diciendo cosas distintas.
        const URL_TIENDA = 'https://mikaraokelatino.com/tienda.html';

        document.getElementById('urlTexto').textContent = URL_TIENDA;

        new QRCode(document.getElementById('qr'), {
            text: URL_TIENDA,
            width: 260,
            height: 260,
            colorDark: '#000000',
            colorLight: '#ffffff',
            // Correccion alta: el cartel va a estar en una pared, con luz mala
            // y a veces un poco sucio. Aguanta que se lea con parte tapada.
            correctLevel: QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
