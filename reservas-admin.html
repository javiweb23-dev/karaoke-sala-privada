<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservas · Panel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: { extend: { colors: {
            marca: { 300: '#FFC000', 400: '#FF9A1F', 500: '#FF8000', 600: '#FF5A1F' },
            noche: { 950: '#0D0B09', 900: '#15110E', 850: '#1B1613', 800: '#241D18', 700: '#362C25' },
            crema: { 100: '#F7F3EE', 300: '#D8D0C7', 400: '#A89E93', 500: '#85796D',
                     600: '#635A50', 700: '#443D36' }
        } } }
    };
</script>
</head>

<body class="bg-noche-950 text-crema-100 font-sans antialiased min-h-screen">

<div id="puerta" class="fixed inset-0 bg-noche-950 z-50 flex flex-col justify-center items-center p-6">
    <div class="w-full max-w-xs text-center">
        <img src="logo.png" alt="" class="h-16 w-auto mx-auto mb-6 object-contain">
        <h1 class="text-lg font-bold text-crema-100 mb-1">Reservas</h1>
        <p class="text-crema-500 text-xs mb-6">Introduce el PIN para continuar</p>
        <input type="password" id="campoPin" autocomplete="off" inputmode="numeric"
            class="w-full bg-noche-900 border border-noche-700 rounded-xl px-4 py-3 text-center
                   text-2xl tracking-[0.3em] text-crema-100 focus:outline-none focus:border-marca-500">
        <p id="errorPin" class="hidden text-red-400 text-xs mt-3"></p>
        <button id="btnEntrar" type="button"
            class="w-full mt-4 bg-marca-500 hover:bg-marca-400 text-black font-bold py-3 rounded-xl transition-colors">
            Entrar
        </button>
    </div>
</div>


<div class="max-w-3xl mx-auto px-5 py-8">

    <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="" class="h-10 w-auto object-contain">
            <div>
                <h1 class="font-black tracking-tight">Reservas</h1>
                <p class="text-crema-600 text-xs">Confirma el pago y queda cerrada</p>
            </div>
        </div>
        <button id="btnRefrescar" type="button"
            class="border border-noche-700 hover:border-noche-700 hover:bg-noche-900 text-crema-300
                   text-xs font-bold px-4 py-2 rounded-lg transition-colors">Refrescar</button>
    </header>

    <div id="aviso" class="hidden mb-6 bg-red-500/10 border border-red-500/30 rounded-xl p-4
                           text-red-300 text-sm leading-relaxed"></div>

    <section class="mb-12">
        <h2 class="text-marca-500 text-[11px] font-bold uppercase tracking-[0.15em] mb-4">
            Esperando que confirmes el pago · <span id="cuentaPendientes">0</span>
        </h2>
        <div id="pendientes" class="space-y-4"></div>
    </section>

    <section class="mb-12">
        <h2 class="text-crema-500 text-[11px] font-bold uppercase tracking-[0.15em] mb-4">
            Confirmadas · <span id="cuentaConfirmadas">0</span>
        </h2>
        <div id="confirmadas" class="space-y-4"></div>
    </section>

    <section>
        <h2 class="text-crema-700 text-[11px] font-bold uppercase tracking-[0.15em] mb-4">
            Canceladas · <span id="cuentaCanceladas">0</span>
        </h2>
        <div id="canceladas" class="space-y-4"></div>
    </section>
</div>


<script>
const CLAVE_PIN = 'karaoke_pin_operador';   // el mismo de siempre
let reservas = [];

const escapar = (t) => { const d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; };
const pin = () => { try { return localStorage.getItem(CLAVE_PIN) || ''; } catch (e) { return ''; } };

async function llamar(accion, extra = {}) {
    const r = await fetch('/api/reserva', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ accion, pin: pin(), ...extra })
    });
    return r.json();
}

function mostrarAviso(t) {
    const a = document.getElementById('aviso');
    a.textContent = t;
    a.classList.remove('hidden');
}

// Las horas llegan en minutos desde medianoche; mas de 1440 es madrugada.
function hora(min) {
    const h = Math.floor((min % 1440) / 60), m = min % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') +
           (min >= 1440 ? ' <span class="text-crema-600">(+1)</span>' : '');
}

function fecha(iso) {
    try {
        // Mediodia en UTC: asi la fecha no se corre de dia por la zona horaria.
        return new Date(iso + 'T12:00:00Z').toLocaleDateString('es-VE',
            { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) { return iso; }
}

async function verComprobante(ruta) {
    const r = await llamar('comprobante', { ruta });
    if (r.ok && r.url) window.open(r.url, '_blank', 'noopener');
    else mostrarAviso(r.error || 'No se pudo abrir el comprobante.');
}

function botones(r) {
    const base = 'text-xs font-bold px-4 py-2 rounded-lg transition-colors border';
    const comp = r.comprobante_url
        ? `<button onclick="verComprobante('${escapar(r.comprobante_url)}')"
              class="${base} border-noche-700 hover:border-marca-500/60 hover:text-marca-500 text-crema-400">Ver comprobante</button>`
        : '';

    if (r.estado === 'pendiente') {
        return comp + `
            <button onclick="cambiar(${r.id},'confirmar')"
                class="${base} bg-marca-500 hover:bg-marca-400 text-black border-marca-500">Confirmar pago</button>
            <button onclick="cambiar(${r.id},'cancelar')"
                class="${base} border-noche-700 hover:border-red-500/60 hover:text-red-400 text-crema-400">Cancelar</button>`;
    }
    if (r.estado === 'confirmada') {
        return comp + `
            <button onclick="cambiar(${r.id},'cancelar')"
                class="${base} border-noche-700 hover:border-red-500/60 hover:text-red-400 text-crema-400">Cancelar</button>`;
    }
    return comp;
}

function tarjeta(r) {
    const borde = r.estado === 'pendiente' ? 'border-marca-500/30' : 'border-noche-800';
    return `
    <article class="bg-noche-900/50 border ${borde} rounded-2xl p-5">
        <div class="flex items-start justify-between gap-4 mb-3">
            <div>
                <p class="font-bold text-crema-100 capitalize">${fecha(r.fecha)}</p>
                <p class="text-marca-500 text-sm font-bold">
                    ${hora(r.inicio_min)} a ${hora(r.fin_min)}
                    <span class="text-crema-500 font-normal">· ${r.horas} h</span>
                </p>
            </div>
            <div class="text-right flex-shrink-0">
                <p class="text-crema-100 font-black">$${r.total_usd}</p>
                <p class="text-crema-500 text-xs">abonó $${r.abono_usd}</p>
            </div>
        </div>
        <p class="text-crema-300 text-sm mb-1">${escapar(r.nombre)}</p>
        <p class="text-crema-500 text-sm mb-5">
            <a href="https://wa.me/${String(r.telefono).replace(/\D/g, '')}" target="_blank"
               rel="noopener" class="hover:text-marca-500 transition-colors">${escapar(r.telefono)}</a>
        </p>
        <div class="flex flex-wrap gap-2">${botones(r)}</div>
    </article>`;
}

function pintar() {
    const grupos = {
        pendiente:  { caja: 'pendientes',  cuenta: 'cuentaPendientes',  vacio: 'Nada esperando. Todo al día.' },
        confirmada: { caja: 'confirmadas', cuenta: 'cuentaConfirmadas', vacio: 'Ninguna confirmada todavía.' },
        cancelada:  { caja: 'canceladas',  cuenta: 'cuentaCanceladas',  vacio: 'Ninguna cancelada.' }
    };
    for (const [estado, g] of Object.entries(grupos)) {
        const lista = reservas.filter((r) => r.estado === estado);
        document.getElementById(g.cuenta).textContent = lista.length;
        document.getElementById(g.caja).innerHTML = lista.length
            ? lista.map(tarjeta).join('')
            : `<p class="text-crema-700 italic text-sm">${g.vacio}</p>`;
    }
}

async function cambiar(id, accion) {
    const r = await llamar(accion, { id });
    if (!r.ok) return mostrarAviso(r.error || 'No se pudo cambiar.');
    const fila = reservas.find((x) => x.id === id);
    if (fila) fila.estado = accion === 'confirmar' ? 'confirmada' : 'cancelada';
    pintar();
}

async function cargar() {
    const r = await llamar('listar');
    if (!r.ok) {
        if (r.error === 'PIN incorrecto') {
            try { localStorage.removeItem(CLAVE_PIN); } catch (e) {}
            return location.reload();
        }
        return mostrarAviso(r.error || 'No se pudieron cargar las reservas.');
    }
    document.getElementById('aviso').classList.add('hidden');
    reservas = r.reservas || [];
    pintar();
}

async function entrar() {
    const campo = document.getElementById('campoPin');
    const err = document.getElementById('errorPin');
    const valor = campo.value.trim();
    if (!valor) return;

    try { localStorage.setItem(CLAVE_PIN, valor); } catch (e) {}

    const r = await llamar('listar');
    if (!r.ok && r.error === 'PIN incorrecto') {
        try { localStorage.removeItem(CLAVE_PIN); } catch (e) {}
        err.textContent = 'PIN incorrecto.';
        err.classList.remove('hidden');
        campo.value = '';
        return;
    }
    document.getElementById('puerta').classList.add('hidden');
    if (r.ok) { reservas = r.reservas || []; pintar(); }
    else mostrarAviso(r.error || 'No se pudieron cargar las reservas.');
}

document.getElementById('btnEntrar').addEventListener('click', entrar);
document.getElementById('campoPin').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
document.getElementById('btnRefrescar').addEventListener('click', cargar);

if (pin()) {
    document.getElementById('puerta').classList.add('hidden');
    cargar();
} else {
    setTimeout(() => document.getElementById('campoPin').focus(), 100);
}
</script>
</body>
</html>
