<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor VIP - Karaoke Box</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="videos_disponibles.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
        /* Siempre visible y a pantalla completa.
           display:none + play() deja el video en negro en Chrome. */
        #karaokePlayer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            max-width: none;
            object-fit: contain;
            background: #000;
            display: block;
            z-index: 10;
        }
        /* Motor 2: YouTube. Solo se muestra cuando toca una cancion que no
           esta en videos_locales. Se monta encima del <video> nativo.
           Ojo: se hace visible ANTES de cargar el video, porque un iframe
           oculto no arranca solo. */
        #ytContainer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            z-index: 20;
        }
        #ytContainer iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Tapa la barra de titulo y el boton de "ver en YouTube": en una sala
           privada nadie debe poder navegar fuera del video. */
        #ytEscudo {
            position: fixed;
            inset: 0;
            z-index: 21;
            display: none;
            pointer-events: auto;
            background: transparent;
        }
        #ytAviso {
            position: fixed;
            bottom: 1rem;
            left: 1rem;
            z-index: 22;
            display: none;
        }
    </style>
</head>
<body class="text-white font-sans select-none">

    <div id="activationWall" class="fixed inset-0 bg-zinc-950 flex flex-col justify-center items-center z-50 cursor-pointer">
        <h1 class="text-3xl font-bold text-amber-400 animate-pulse">SALA PRIVADA LISTA</h1>
        <p class="text-zinc-500 mt-2 text-lg">Haz un clic para iniciar el sistema</p>
    </div>

    <div id="lobbyScreen" class="text-center w-full fixed inset-0 flex flex-col justify-center items-center bg-zinc-950 z-40">
        <h2 id="lobbyMessage" class="text-4xl font-extrabold text-zinc-300 tracking-wide">ESPERANDO SOLICITUDES...</h2>
        <h3 id="singerName" class="text-2xl font-bold text-emerald-400 mt-4 hidden"></h3>
        <h1 id="countdownText" class="text-9xl font-black text-amber-400 mt-6 hidden">5</h1>

        <!-- El codigo de sala. Solo se ve aqui dentro: eso es lo que prueba
             que quien lo teclea esta en la sala. -->
        <div id="codigoSala" class="hidden mt-12 text-center">
            <p class="text-zinc-500 text-sm uppercase tracking-[0.3em] mb-2">Código para pedir canciones</p>
            <div id="codigoSalaValor" class="text-7xl font-black text-amber-400 tracking-[0.3em]"></div>
        </div>
    </div>

    <video id="karaokePlayer" playsinline webkit-playsinline></video>

    <div id="ytContainer"><div id="ytFrame"></div></div>
    <div id="ytEscudo"></div>
    <div id="ytAviso" class="bg-zinc-950/90 backdrop-blur-sm border border-zinc-700/80 text-zinc-400 text-xs font-bold px-3 py-2 rounded-lg pointer-events-none tracking-wide">
        ▶ YouTube · sin ajuste de tono
    </div>

    <div id="timeCounter" class="fixed bottom-4 right-4 bg-zinc-950/90 backdrop-blur-sm border border-zinc-700/80 text-zinc-100 text-base font-mono font-black px-4 py-2.5 rounded-xl shadow-lg shadow-black/50 z-50 pointer-events-none hidden tracking-wide">
        00:00 / 00:00 (Restan: -00:00)
    </div>

    <script>
        const SUPABASE_URL = "https://mefrjbmjfdphdqndpzcw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const canalAdmin = supabaseClient.channel('admin-commands');

        // ⚠️ PON AQUI LA URL DE TU DESPLIEGUE EN VERCEL ⚠️
        //
        // Esta pantalla se abre con Live Server desde VS Code (localhost),
        // porque necesita la carpeta videos_locales/ que no se despliega.
        // Pero los endpoints /api/* viven en Vercel. Sin esta URL, el codigo
        // de sala no puede aparecer en la TV.
        //
        // Si algun dia mueves el reproductor a Vercel, dejalo en '' y usara
        // su propio origen.
        const URL_VERCEL = 'https://karaoke-sala-privada.vercel.app';

        const enLocal = ['localhost', '127.0.0.1', ''].includes(location.hostname);
        const API_BASE = enLocal ? URL_VERCEL : '';

        const player        = document.getElementById('karaokePlayer');
        const wall          = document.getElementById('activationWall');
        const lobbyScreen   = document.getElementById('lobbyScreen');
        const lobbyMessage  = document.getElementById('lobbyMessage');
        const singerName    = document.getElementById('singerName');
        const countdownText = document.getElementById('countdownText');
        const timeCounter   = document.getElementById('timeCounter');

        let isPlaying               = false;
        let systemActive            = false;
        let sistemaIniciado         = false;
        let idActual                = null;
        let cuentaRegresivaId       = null;
        let reproduccionToken       = 0;
        let completandoCancion      = false;

        let audioIniciado      = false;
        let audioContexto      = null;
        let source             = null;
        let gainNormalizacion  = null;
        let analizadorNorm     = null;
        let hpFilter           = null;
        let ecualizadorBajos   = null;
        let ecualizadorMedios  = null;
        let ecualizadorBrillo  = null;
        let deEsser            = null;
        let soundTouchNode     = null;
        let SoundTouchNodeClass = null;
        let soundTouchRegistrado = false;
        let compressor         = null;
        let limiter            = null;
        let gainFinal          = null;

        const PRESET_CABINA = {
            hpfHz: 35,
            hpfQ: 0.707,
            bajosDb: 0.6,
            bajosHz: 100,
            mediosDb: 1.5,
            mediosHz: 2800,
            mediosQ: 0.9,
            deEsserHz: 6200,
            deEsserQ: 2.2,
            deEsserDb: -2.0,
            brilloDb: 0.9,
            brilloHz: 10000,
            compThreshold: -20,
            compRatio: 2.5,
            compKnee: 12,
            compAttack: 0.008,
            compRelease: 0.22,
            limiterThreshold: -2.5,
            limiterRatio: 16,
            gainSalida: 0.95,
            autoVolTarget: 0.082,
            autoVolMin: 0.65,
            autoVolMax: 1.7,
            autoVolIntervalMs: 2500,
            autoVolRampaSeg: 4.0
        };

        let semitonos           = 0;
        let rampaTonoId         = null;

        function duracionRampaTono(inicio, destino) {
            const salto = Math.abs(destino - inicio);
            return Math.min(800, Math.round(420 + salto * 120));
        }
        let normInterval    = null;
        let medicionesRMS   = [];

        // Los .wav los genera scripts/generar-efectos.js (audio sintetizado,
        // libre de derechos). Los .mp3 son los originales de siempre.
        const efectosSonidos = {
            'aplausos': new Audio('efectos/aplausos.mp3'),
            'buuu':     new Audio('efectos/buuu.mp3'),
            'corneta':  new Audio('efectos/corneta.mp3'),
            'chacal':   new Audio('efectos/chacal.mp3'),
            'gato':     new Audio('efectos/gato.wav'),
            'trombon':  new Audio('efectos/trombon.wav'),
            'grillos':  new Audio('efectos/grillos.wav'),
            'redoble':  new Audio('efectos/redoble.wav')
        };

        function reproducirEfecto(valor) {
            const audio = efectosSonidos[valor];
            if (!audio) return;
            audio.currentTime = 0;
            try {
                const p = audio.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            } catch (e) {}
        }

        function formatTiempo(s) {
            if (!isFinite(s) || s < 0) s = 0;
            const m = Math.floor(s / 60);
            const ss = Math.floor(s % 60);
            return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
        }

        async function cargarSoundTouch() {
            if (SoundTouchNodeClass) return SoundTouchNodeClass;

            const localUrl = new URL('lib/soundtouch/SoundTouchNode.js', document.baseURI || window.location.href).href;
            try {
                const mod = await import(localUrl);
                SoundTouchNodeClass = mod.SoundTouchNode;
                console.log('[Audio] SoundTouch cargado desde lib local');
                return SoundTouchNodeClass;
            } catch (eLocal) {
                console.warn('[Audio] lib local no disponible, probando CDN...', eLocal.message);
            }

            const mod = await import('https://cdn.jsdelivr.net/npm/@soundtouchjs/audio-worklet@2.0.3/+esm');
            SoundTouchNodeClass = mod.SoundTouchNode;
            console.log('[Audio] SoundTouch cargado desde CDN');
            return SoundTouchNodeClass;
        }

        function urlProcessorSoundTouch() {
            return new URL('lib/soundtouch-processor.js', document.baseURI || window.location.href).href;
        }

        async function registrarSoundTouch() {
            const STN = await cargarSoundTouch();
            if (!soundTouchRegistrado) {
                await STN.register(audioContexto, urlProcessorSoundTouch());
                soundTouchRegistrado = true;
                console.log('[Audio] SoundTouch processor registrado');
            }
        }

        function configurarSoundTouchCalidad(node) {
            if (!node || typeof node.setStretchParameters !== 'function') return;
            node.setStretchParameters({
                overlapMs: 12,
                quickSeek: false,
                sequenceMs: 0
            });
        }

        function obtenerPitchActual() {
            if (!soundTouchNode) return semitonos;
            return soundTouchNode.pitchSemitones.value;
        }

        function aplicarTonoSuave(destino) {
            destino = Math.max(-6, Math.min(6, destino));
            semitonos = destino;
            asegurarCadenaParaTono(Math.abs(destino) > 0.01);

            if (!soundTouchNode || !audioContexto || !cadenaConPitch) {
                return;
            }

            const inicio = obtenerPitchActual();

            if (Math.abs(inicio - destino) < 0.01) {
                soundTouchNode.pitchSemitones.value = destino;
                return;
            }

            if (rampaTonoId !== null) {
                cancelAnimationFrame(rampaTonoId);
                rampaTonoId = null;
            }

            const duracionMs = duracionRampaTono(inicio, destino);
            const param = soundTouchNode.pitchSemitones;
            const t = audioContexto.currentTime;

            if (param && typeof param.cancelScheduledValues === 'function') {
                param.cancelScheduledValues(t);
                param.setValueAtTime(inicio, t);
                param.linearRampToValueAtTime(destino, t + duracionMs / 1000);
                return;
            }

            const t0 = performance.now();
            function animar(ahora) {
                const progreso = Math.min(1, (ahora - t0) / duracionMs);
                const suave = progreso * progreso * (3 - 2 * progreso);
                soundTouchNode.pitchSemitones.value = inicio + (destino - inicio) * suave;
                if (progreso < 1) {
                    rampaTonoId = requestAnimationFrame(animar);
                } else {
                    soundTouchNode.pitchSemitones.value = destino;
                    rampaTonoId = null;
                }
            }
            rampaTonoId = requestAnimationFrame(animar);
        }

        function cambiarTono(delta) {
            // El audio de YouTube viene dentro de un iframe de otro origen:
            // no pasa por el AudioContext, asi que no hay nada que transponer.
            if (fuenteActual === 'youtube') {
                console.info('[Tono] No disponible en canciones de YouTube.');
                return;
            }
            aplicarTonoSuave(semitonos + delta);
        }

        function resetTono(notificarAdmin) {
            if (rampaTonoId !== null) {
                cancelAnimationFrame(rampaTonoId);
                rampaTonoId = null;
            }
            aplicarTonoSuave(0);
            if (notificarAdmin) {
                try {
                    canalAdmin.send({
                        type: 'broadcast',
                        event: 'control',
                        payload: { accion: 'sync_tono', valor: 0 }
                    });
                } catch (e) {}
            }
        }

        async function asegurarAudioContextoActivo() {
            if (!audioContexto) return false;
            if (audioContexto.state === 'suspended') {
                try { await audioContexto.resume(); } catch (e) {}
            }
            return audioContexto.state === 'running';
        }

        function aplicarGananciaNormalizada(valor) {
            if (!gainNormalizacion || !audioContexto) return;
            const t = audioContexto.currentTime;
            const ganancia = Math.max(0.001, Math.min(PRESET_CABINA.autoVolMax, valor));
            gainNormalizacion.gain.cancelScheduledValues(t);
            const actual = Math.max(0.001, gainNormalizacion.gain.value);
            gainNormalizacion.gain.setValueAtTime(actual, t);
            gainNormalizacion.gain.exponentialRampToValueAtTime(ganancia, t + PRESET_CABINA.autoVolRampaSeg);
            notificarAutoVolAdmin(ganancia);
        }

        // Le dice al admin desde que motor esta sonando, para que atenue los
        // controles de tono cuando no sirven de nada.
        function notificarFuenteAdmin(fuente) {
            try {
                canalAdmin.send({
                    type: 'broadcast',
                    event: 'control',
                    payload: { accion: 'sync_fuente', valor: fuente }
                });
            } catch (e) {}
        }

        function notificarAutoVolAdmin(ganancia) {
            try {
                canalAdmin.send({
                    type: 'broadcast',
                    event: 'control',
                    payload: { accion: 'autovol', valor: ganancia }
                });
            } catch (e) {}
        }

        function iniciarNormalizacion() {
            detenerNormalizacion();
            medicionesRMS = [];

            if (gainNormalizacion && audioContexto) {
                const t = audioContexto.currentTime;
                gainNormalizacion.gain.cancelScheduledValues(t);
                gainNormalizacion.gain.setValueAtTime(1.0, t);
            }

            normInterval = setInterval(async () => {
                if (!isPlaying || !analizadorNorm || !gainNormalizacion || !audioContexto) return;
                if (!(await asegurarAudioContextoActivo())) return;

                const buffer = new Float32Array(analizadorNorm.fftSize);
                analizadorNorm.getFloatTimeDomainData(buffer);

                let sumaCuadrados = 0;
                for (let i = 0; i < buffer.length; i++) {
                    sumaCuadrados += buffer[i] * buffer[i];
                }
                const rms = Math.sqrt(sumaCuadrados / buffer.length);

                if (rms < 0.008) return;

                medicionesRMS.push(rms);
                if (medicionesRMS.length > 6) medicionesRMS.shift();
                const rmsPromedio = medicionesRMS.reduce((a, b) => a + b, 0) / medicionesRMS.length;

                const correccion = Math.max(
                    PRESET_CABINA.autoVolMin,
                    Math.min(PRESET_CABINA.autoVolMax, PRESET_CABINA.autoVolTarget / rmsPromedio)
                );

                try {
                    aplicarGananciaNormalizada(correccion);
                } catch (e) {
                    console.warn('Auto-vol:', e);
                }
            }, PRESET_CABINA.autoVolIntervalMs);
        }

        function detenerNormalizacion() {
            if (normInterval) { clearInterval(normInterval); normInterval = null; }
            medicionesRMS = [];
        }

        let cadenaConPitch = false;

        function desconectarCadenaAudio() {
            const nodos = [
                source, gainNormalizacion, analizadorNorm, hpFilter,
                ecualizadorBajos, ecualizadorMedios, deEsser, ecualizadorBrillo,
                soundTouchNode, compressor, limiter, gainFinal
            ];
            for (const n of nodos) {
                if (!n) continue;
                try { n.disconnect(); } catch (e) {}
            }
        }

        function conectarCadenaPrincipal(usarPitch) {
            source.connect(gainNormalizacion);
            gainNormalizacion.connect(hpFilter);
            hpFilter.connect(ecualizadorBajos);
            ecualizadorBajos.connect(ecualizadorMedios);
            ecualizadorMedios.connect(deEsser);
            deEsser.connect(ecualizadorBrillo);
            ecualizadorBrillo.connect(analizadorNorm);
            if (usarPitch && soundTouchNode) {
                ecualizadorBrillo.connect(soundTouchNode);
                soundTouchNode.connect(compressor);
                cadenaConPitch = true;
                console.log('[Audio] Cadena: fuente→gain→HPF→EQ→SoundTouch→comp→limit→out');
            } else {
                ecualizadorBrillo.connect(compressor);
                cadenaConPitch = false;
                console.log('[Audio] Cadena: fuente→gain→HPF→EQ→comp→limit→out (sin SoundTouch)');
            }
            compressor.connect(limiter);
            limiter.connect(gainFinal);
            gainFinal.connect(audioContexto.destination);
        }

        function asegurarCadenaParaTono(necesitaPitch) {
            if (!source || !audioContexto) return;
            if (necesitaPitch === cadenaConPitch) return;
            if (necesitaPitch && !soundTouchNode) return;
            try {
                desconectarCadenaAudio();
                conectarCadenaPrincipal(!!necesitaPitch);
            } catch (e) {
                console.warn('[Audio] Reconnect pitch falló, audio sin pitch:', e);
                try { desconectarCadenaAudio(); } catch (err) {}
                conectarCadenaPrincipal(false);
            }
        }

        function conectarCadenaAudio() {
            if (!source) {
                source = audioContexto.createMediaElementSource(player);
                console.log('[Audio] MediaElementSource creado (una sola vez)');
            }

            if (!gainNormalizacion) {
                gainNormalizacion = audioContexto.createGain();
                gainNormalizacion.gain.value = 1.0;
            }

            if (!analizadorNorm) {
                analizadorNorm = audioContexto.createAnalyser();
                analizadorNorm.fftSize = 4096;
                analizadorNorm.smoothingTimeConstant = 0.65;
            }

            const p = PRESET_CABINA;

            if (!hpFilter) {
                hpFilter = audioContexto.createBiquadFilter();
                hpFilter.type = 'highpass';
                hpFilter.frequency.setValueAtTime(p.hpfHz, audioContexto.currentTime);
                hpFilter.Q.value = p.hpfQ;
            }

            if (!ecualizadorBajos) {
                ecualizadorBajos = audioContexto.createBiquadFilter();
                ecualizadorBajos.type = 'lowshelf';
                ecualizadorBajos.frequency.setValueAtTime(p.bajosHz, audioContexto.currentTime);
                ecualizadorBajos.gain.value = p.bajosDb;
            }

            if (!ecualizadorMedios) {
                ecualizadorMedios = audioContexto.createBiquadFilter();
                ecualizadorMedios.type = 'peaking';
                ecualizadorMedios.frequency.setValueAtTime(p.mediosHz, audioContexto.currentTime);
                ecualizadorMedios.Q.value = p.mediosQ;
                ecualizadorMedios.gain.value = p.mediosDb;
            }

            if (!deEsser) {
                deEsser = audioContexto.createBiquadFilter();
                deEsser.type = 'peaking';
                deEsser.frequency.setValueAtTime(p.deEsserHz, audioContexto.currentTime);
                deEsser.Q.value = p.deEsserQ;
                deEsser.gain.value = p.deEsserDb;
            }

            if (!ecualizadorBrillo) {
                ecualizadorBrillo = audioContexto.createBiquadFilter();
                ecualizadorBrillo.type = 'highshelf';
                ecualizadorBrillo.frequency.setValueAtTime(p.brilloHz, audioContexto.currentTime);
                ecualizadorBrillo.gain.value = p.brilloDb;
            }

            if (!soundTouchNode && SoundTouchNodeClass) {
                try {
                    soundTouchNode = new SoundTouchNodeClass({ context: audioContexto });
                    soundTouchNode.playbackRate.value = 1;
                    soundTouchNode.pitchSemitones.value = semitonos;
                    configurarSoundTouchCalidad(soundTouchNode);
                } catch (e) {
                    console.warn('[Audio] No se pudo crear SoundTouchNode:', e);
                    soundTouchNode = null;
                }
            }

            player.muted = false;
            player.volume = 1;
            player.preservesPitch = false;

            if (!compressor) {
                compressor = audioContexto.createDynamicsCompressor();
                compressor.threshold.value = p.compThreshold;
                compressor.knee.value      = p.compKnee;
                compressor.ratio.value     = p.compRatio;
                compressor.attack.value    = p.compAttack;
                compressor.release.value   = p.compRelease;
            }

            if (!limiter) {
                limiter = audioContexto.createDynamicsCompressor();
                limiter.threshold.value = p.limiterThreshold;
                limiter.knee.value      = 0;
                limiter.ratio.value     = p.limiterRatio;
                limiter.attack.value    = 0.002;
                limiter.release.value   = 0.08;
            }

            if (!gainFinal) {
                gainFinal = audioContexto.createGain();
                gainFinal.gain.value = p.gainSalida;
            }

            // Por defecto SIN SoundTouch: así hay audio seguro.
            // SoundTouch solo se inserta cuando el admin cambia el tono.
            try {
                desconectarCadenaAudio();
                conectarCadenaPrincipal(false);
            } catch (e) {
                console.warn('[Audio] Cadena falló, reintento simple:', e);
                try { desconectarCadenaAudio(); } catch (err) {}
                conectarCadenaPrincipal(false);
            }
        }

        async function iniciarAudio() {
            if (audioIniciado) {
                await asegurarAudioContextoActivo();
                return;
            }
            audioIniciado = true;

            // Misma origen (videos_locales): NO usar crossOrigin anonymous.
            // Con anonymous sin CORS el video se ve pero MediaElementSource queda mudo.
            try { player.removeAttribute('crossorigin'); } catch (e) {}
            player.crossOrigin = null;
            player.muted = false;
            player.volume = 1;

            audioContexto = new (window.AudioContext || window.webkitAudioContext)();

            try {
                await audioContexto.resume();
                console.log('[Audio] AudioContext activado:', audioContexto.state);
            } catch (e) {
                console.error('[Audio] No se pudo reanudar AudioContext:', e);
            }

            try {
                await registrarSoundTouch();
                console.log('[Audio] SoundTouch listo');
            } catch (e) {
                console.error('[Audio] No se pudo cargar SoundTouch:', e);
                SoundTouchNodeClass = null;
            }

            try {
                conectarCadenaAudio();
            } catch (e) {
                console.error('[Audio] Falló cadena de audio:', e);
            }

            player.addEventListener('playing', () => { asegurarAudioContextoActivo(); });

            if (audioContexto.state === 'suspended') {
                await audioContexto.resume();
            }
            console.log('[Audio] Estado final AudioContext:', audioContexto.state);
        }

        async function iniciarSistema() {
            wall.style.display = 'none';

            if (sistemaIniciado) return;
            sistemaIniciado = true;
            systemActive    = true;

            await iniciarAudio();

            // El PIN se pide una sola vez por TV y queda guardado. Si se
            // cancela, el sistema sigue funcionando sin control de sala.
            pinOperadorTv(false);
            await refrescarSesion();

            // Detecta que el operador abrio o cerro sesion desde el admin.
            setInterval(refrescarSesion, 15000);

            buscarSiguienteCancion();
        }

        wall.addEventListener('click', () => {
            iniciarSistema().catch(e => console.error('[Audio] iniciarSistema:', e));
        });

        function cancelarCuentaRegresiva() {
            if (cuentaRegresivaId !== null) {
                clearInterval(cuentaRegresivaId);
                cuentaRegresivaId = null;
            }
        }

        function claveSinAcentos(texto) {
            return String(texto || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toUpperCase()
                .replace(/\s+/g, ' ')
                .trim();
        }

        function resolverArchivoVideo(nombre) {
            if (typeof VIDEOS_DISPONIBLES !== 'undefined' && VIDEOS_DISPONIBLES && VIDEOS_DISPONIBLES[nombre]) {
                return VIDEOS_DISPONIBLES[nombre];
            }
            if (typeof VIDEOS_DISPONIBLES_NORM !== 'undefined' && VIDEOS_DISPONIBLES_NORM) {
                const n = claveSinAcentos(nombre);
                if (VIDEOS_DISPONIBLES_NORM[n]) return VIDEOS_DISPONIBLES_NORM[n];
            }
            return null;
        }

        function candidatosSrcVideo(nombre) {
            const visto = new Set();
            const lista = [];
            const push = (src) => {
                if (!src || visto.has(src)) return;
                visto.add(src);
                lista.push(src);
            };

            const archivo = resolverArchivoVideo(nombre);
            if (archivo) push(`videos_locales/${archivo}`);
            push(`videos_locales/${nombre}.mp4`);
            push(`videos_locales/${nombre}.MP4`);
            return lista;
        }

        function esperarEventoMedia(evento, timeoutMs = 12000) {
            return new Promise((resolve, reject) => {
                let listo = false;
                const timer = setTimeout(() => {
                    if (listo) return;
                    listo = true;
                    limpiar();
                    reject(new Error('timeout media'));
                }, timeoutMs);

                const onOk = () => {
                    if (listo) return;
                    listo = true;
                    limpiar();
                    resolve();
                };
                const onErr = () => {
                    if (listo) return;
                    listo = true;
                    limpiar();
                    const code = player.error ? player.error.code : '?';
                    reject(new Error('media error ' + code));
                };

                function limpiar() {
                    clearTimeout(timer);
                    player.removeEventListener(evento, onOk);
                    player.removeEventListener('error', onErr);
                }

                player.addEventListener(evento, onOk, { once: true });
                player.addEventListener('error', onErr, { once: true });
            });
        }

        async function cargarFuenteVideo(nombre) {
            const candidatos = candidatosSrcVideo(nombre);
            let ultimoError = null;

            for (const src of candidatos) {
                try {
                    player.onended = null;
                    player.onerror = null;
                    player.src = src;
                    player.load();
                    await esperarEventoMedia('loadeddata', 10000);
                    return src;
                } catch (err) {
                    ultimoError = err;
                    console.warn('[Video] Falló fuente:', src, err.message || err);
                    try {
                        player.removeAttribute('src');
                        player.load();
                    } catch (e) {}
                }
            }

            throw ultimoError || new Error('sin fuente de video');
        }

        // ==================================================================
        // MOTOR 2: YouTube
        //
        // Para las canciones que no estan en videos_locales. Se reproduce con
        // el IFrame Player API oficial: nada de descargar ni proxear.
        //
        // Limitacion conocida y asumida: el audio del iframe es de otro origen
        // y NUNCA entra al AudioContext, asi que aqui no hay cambio de tono ni
        // normalizacion. Por eso YouTube es el plan B, no el motor principal.
        // ==================================================================

        const ytContainer = document.getElementById('ytContainer');
        const ytEscudo    = document.getElementById('ytEscudo');
        const ytAviso     = document.getElementById('ytAviso');

        let ytPlayer         = null;
        let ytApiPromesa     = null;
        let ytPlayerPromesa  = null;
        let ytEsperando      = null;   // handlers de la carga en curso
        let ytIntervalTiempo = null;
        let fuenteActual     = 'local';

        function cargarApiYouTube() {
            if (ytApiPromesa) return ytApiPromesa;

            ytApiPromesa = new Promise((resolve, reject) => {
                if (window.YT && window.YT.Player) return resolve();

                const timer = setTimeout(
                    () => reject(new Error('timeout cargando API de YouTube')),
                    15000
                );

                const anterior = window.onYouTubeIframeAPIReady;
                window.onYouTubeIframeAPIReady = () => {
                    if (typeof anterior === 'function') anterior();
                    clearTimeout(timer);
                    resolve();
                };

                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                tag.onerror = () => {
                    clearTimeout(timer);
                    reject(new Error('no se pudo cargar la API de YouTube'));
                };
                document.head.appendChild(tag);
            });

            return ytApiPromesa;
        }

        function crearPlayerYouTube() {
            if (ytPlayerPromesa) return ytPlayerPromesa;

            ytPlayerPromesa = new Promise((resolve, reject) => {
                const timer = setTimeout(
                    () => reject(new Error('timeout creando player de YouTube')),
                    15000
                );

                ytPlayer = new YT.Player('ytFrame', {
                    width: '100%',
                    height: '100%',
                    playerVars: {
                        autoplay: 0,
                        controls: 0,          // los controles los da el admin
                        disablekb: 1,
                        modestbranding: 1,
                        rel: 0,
                        iv_load_policy: 3,    // sin anotaciones encima de la letra
                        fs: 0,
                        playsinline: 1,
                        cc_load_policy: 0
                    },
                    events: {
                        onReady: () => { clearTimeout(timer); resolve(ytPlayer); },
                        onStateChange: manejarEstadoYt,
                        onError: manejarErrorYt
                    }
                });
            });

            return ytPlayerPromesa;
        }

        function manejarEstadoYt(evento) {
            // PLAYING tambien se dispara durante un anuncio previo, que es lo
            // que queremos: significa que el video existe y va a sonar.
            if (evento.data === YT.PlayerState.PLAYING) {
                if (ytEsperando) ytEsperando.ok();
                return;
            }

            if (evento.data === YT.PlayerState.ENDED) {
                if (fuenteActual === 'youtube' && idActual !== null) {
                    marcarComoCompletada(idActual);
                }
            }
        }

        function manejarErrorYt(evento) {
            // 101 y 150 = el dueño no permite embeber. 100 = borrado o privado.
            const codigo = evento.data;
            console.warn('[YT] error de reproduccion, codigo', codigo);
            if (ytEsperando) ytEsperando.fallo('codigo ' + codigo);
        }

        function mostrarYouTube(visible) {
            ytContainer.style.display = visible ? 'block' : 'none';
            ytEscudo.style.display    = visible ? 'block' : 'none';
            ytAviso.style.display     = visible ? 'block' : 'none';
        }

        // Intenta un video concreto. Resuelve cuando empieza a sonar de verdad;
        // rechaza si YouTube devuelve error o si nunca arranca.
        function intentarVideoYt(videoId) {
            return new Promise((resolve, reject) => {
                let resuelto = false;

                const limpiar = () => {
                    clearTimeout(timer);
                    ytEsperando = null;
                };

                const timer = setTimeout(() => {
                    if (resuelto) return;
                    resuelto = true;
                    limpiar();
                    reject(new Error('timeout'));
                }, 20000);

                ytEsperando = {
                    ok: () => {
                        if (resuelto) return;
                        resuelto = true;
                        limpiar();
                        resolve();
                    },
                    fallo: (motivo) => {
                        if (resuelto) return;
                        resuelto = true;
                        limpiar();
                        reject(new Error(motivo));
                    }
                };

                // El contenedor se muestra ANTES de cargar: un iframe oculto
                // no arranca reproduccion automatica.
                mostrarYouTube(true);
                try {
                    ytPlayer.loadVideoById(videoId);
                } catch (e) {
                    ytEsperando.fallo('loadVideoById fallo');
                }
            });
        }

        async function reproducirDesdeYouTube(solicitud) {
            // El candidato principal mas los respaldos que guardo el cliente:
            // si el primero esta caido, se salta al siguiente sin que se note.
            const respaldos = Array.isArray(solicitud.respaldo_ids)
                ? solicitud.respaldo_ids
                : [];
            const ids = [solicitud.video_id, ...respaldos].filter(Boolean);

            if (ids.length === 0) throw new Error('solicitud de YouTube sin video_id');

            await cargarApiYouTube();
            await crearPlayerYouTube();

            // El <video> nativo se apaga del todo para que no suenen los dos.
            try {
                player.pause();
                player.removeAttribute('src');
                player.load();
            } catch (e) {}

            let ultimoError = null;
            for (const id of ids) {
                try {
                    await intentarVideoYt(id);
                    return id;
                } catch (err) {
                    ultimoError = err;
                    console.warn('[YT] fallo el video', id, '-', err.message);
                }
            }

            throw ultimoError || new Error('ningun video de YouTube funciono');
        }

        function detenerYouTube() {
            if (ytIntervalTiempo) {
                clearInterval(ytIntervalTiempo);
                ytIntervalTiempo = null;
            }
            ytEsperando = null;
            if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
                try { ytPlayer.stopVideo(); } catch (e) {}
            }
            mostrarYouTube(false);
        }

        // El <video> nativo emite 'timeupdate'; el iframe no, hay que preguntarle.
        function iniciarContadorYt() {
            if (ytIntervalTiempo) clearInterval(ytIntervalTiempo);
            ytIntervalTiempo = setInterval(() => {
                if (fuenteActual !== 'youtube' || !ytPlayer) return;
                try {
                    const t = ytPlayer.getCurrentTime();
                    const d = ytPlayer.getDuration();
                    if (!d || isNaN(d)) return;
                    timeCounter.innerText =
                        `${formatTiempo(t)} / ${formatTiempo(d)} (Restan: -${formatTiempo(d - t)})`;
                } catch (e) {}
            }, 500);
        }

        player.addEventListener('timeupdate', () => {
            if (!isPlaying || !player.duration || isNaN(player.duration)) return;
            const t = player.currentTime;
            const d = player.duration;
            timeCounter.innerText = `${formatTiempo(t)} / ${formatTiempo(d)} (Restan: -${formatTiempo(d - t)})`;
        });

        // ==================================================================
        // Sesion de sala
        //
        // El codigo se muestra SOLO en esta pantalla. Verlo exige estar en la
        // sala, que es justo lo que queriamos comprobar: nada de GPS ni de
        // contraseñas que el cliente tenga que inventarse.
        //
        // Es opcional: sin sesion abierta, todo funciona como siempre.
        // ==================================================================

        const codigoSala      = document.getElementById('codigoSala');
        const codigoSalaValor = document.getElementById('codigoSalaValor');

        let sesionActual   = null;
        let pinReintentado = false;

        function pinOperadorTv(forzar) {
            let pin = localStorage.getItem('karaoke_pin_operador');
            if (!pin || forzar) {
                pin = prompt('PIN de operador (solo la primera vez en esta TV):');
                if (!pin) return null;
                localStorage.setItem('karaoke_pin_operador', pin);
            }
            return pin;
        }

        async function refrescarSesion() {
            const pin = localStorage.getItem('karaoke_pin_operador');
            if (!pin) {
                sesionActual = null;
                codigoSala.classList.add('hidden');
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/sesion`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accion: 'estado', pin })
                });
                const data = await res.json();

                if (!data.ok) {
                    if (data.error === 'PIN incorrecto') {
                        localStorage.removeItem('karaoke_pin_operador');

                        // Volver a preguntarlo en el momento, sin obligar a
                        // recargar. Solo una vez por carga: este refresco corre
                        // cada 15 s y seria insoportable un prompt cada vez.
                        if (!pinReintentado) {
                            pinReintentado = true;
                            if (pinOperadorTv(true)) return refrescarSesion();
                        }
                    } else {
                        console.warn('[Sesion]', data.error || 'error desconocido');
                    }
                    sesionActual = null;
                    codigoSala.classList.add('hidden');
                    return;
                }

                sesionActual = data.sesion || null;

                if (sesionActual) {
                    codigoSalaValor.innerText = sesionActual.codigo;
                    codigoSala.classList.remove('hidden');
                } else {
                    codigoSala.classList.add('hidden');
                }
            } catch (e) {
                console.warn('[Sesion] No se pudo consultar:', e.message);
            }
        }

        async function buscarSiguienteCancion() {
            if (!systemActive || isPlaying || completandoCancion) return;

            let consulta = supabaseClient
                .from('Solicitudes')
                .select('*')
                .eq('estado', 'pendiente');

            // Con sesion abierta suena lo pedido en ESTA sesion. Aqui es donde
            // el control se hace de verdad: una solicitud de la sesion de ayer
            // no llega a la TV.
            //
            // Tambien entran las que no tienen sesion: son las que se pidieron
            // ANTES de que el operador abriera la sesion. Sin esto se quedaban
            // invisibles y colgadas en la cola para siempre.
            if (sesionActual) {
                consulta = consulta.or(
                    `sesion_id.eq.${sesionActual.id},sesion_id.is.null`
                );
            }

            const { data, error } = await consulta
                .order('id', { ascending: true })
                .limit(1);

            if (error || !data || data.length === 0) {
                lobbyScreen.style.display = 'flex';
                lobbyMessage.innerText    = "ESPERANDO SOLICITUDES...";
                singerName.classList.add('hidden');
                countdownText.classList.add('hidden');
                timeCounter.classList.add('hidden');
                return;
            }

            iniciarCuentaRegresiva(data[0]);
        }

        function iniciarCuentaRegresiva(solicitud) {
            cancelarCuentaRegresiva();
            reproduccionToken++;

            isPlaying = true;
            idActual = solicitud.id;
            let segundos = 5;

            resetTono(true);

            timeCounter.classList.add('hidden');
            lobbyScreen.style.display = 'flex';
            lobbyMessage.innerText = `PRÓXIMO TEMA:\n${solicitud.cancion_info}`;
            singerName.innerText = `🎤 LA CANTA: ${solicitud.nombre_usuario.toUpperCase()}`;
            singerName.classList.remove('hidden');
            countdownText.innerText = segundos;
            countdownText.classList.remove('hidden');

            cuentaRegresivaId = setInterval(() => {
                segundos--;
                if (segundos > 0) {
                    countdownText.innerText = segundos;
                } else {
                    cancelarCuentaRegresiva();
                    countdownText.classList.add('hidden');
                    reproducirVideo(solicitud);
                }
            }, 1000);
        }

        async function reproducirVideo(solicitud) {
            const token = ++reproduccionToken;
            const nombre = solicitud.cancion_info;

            lobbyScreen.style.display = 'flex';
            lobbyMessage.innerText = `CARGANDO:\n${nombre}`;
            singerName.classList.remove('hidden');
            countdownText.classList.add('hidden');
            timeCounter.classList.add('hidden');

            // Las solicitudes viejas no tienen la columna: se asumen locales.
            fuenteActual = solicitud.fuente === 'youtube' ? 'youtube' : 'local';
            notificarFuenteAdmin(fuenteActual);

            if (fuenteActual === 'youtube') {
                try {
                    await reproducirDesdeYouTube(solicitud);
                    if (token !== reproduccionToken || idActual !== solicitud.id) {
                        detenerYouTube();
                        return;
                    }

                    lobbyScreen.style.display = 'none';
                    timeCounter.classList.remove('hidden');
                    iniciarContadorYt();
                } catch (err) {
                    console.warn('No se pudo reproducir en YouTube:', nombre, err);
                    detenerYouTube();
                    if (token === reproduccionToken && idActual === solicitud.id) {
                        lobbyMessage.innerText = `NO DISPONIBLE:\n${nombre}`;
                        await new Promise(r => setTimeout(r, 900));
                        await marcarComoCompletada(solicitud.id);
                    }
                }
                return;
            }

            mostrarYouTube(false);

            try {
                await cargarFuenteVideo(nombre);
                if (token !== reproduccionToken || idActual !== solicitud.id) return;

                await asegurarAudioContextoActivo();
                iniciarNormalizacion();

                await player.play();
                if (token !== reproduccionToken || idActual !== solicitud.id) return;

                resetTono(true);

                lobbyScreen.style.display = 'none';
                timeCounter.classList.remove('hidden');

                player.onended = () => {
                    if (idActual === solicitud.id) marcarComoCompletada(solicitud.id);
                };
                player.onerror = () => {
                    console.error('Error durante reproducción:', player.error);
                    if (idActual === solicitud.id) marcarComoCompletada(solicitud.id);
                };
            } catch (err) {
                console.warn('No se pudo reproducir:', nombre, err);
                if (token === reproduccionToken && idActual === solicitud.id) {
                    lobbyMessage.innerText = `NO DISPONIBLE:\n${nombre}`;
                    await new Promise(r => setTimeout(r, 900));
                    await marcarComoCompletada(solicitud.id);
                }
            }
        }

        async function marcarComoCompletada(id) {
            if (!id || completandoCancion) return;
            if (idActual !== null && id !== idActual) return;

            completandoCancion = true;
            cancelarCuentaRegresiva();
            reproduccionToken++;

            try {
                const { error } = await supabaseClient
                    .from('Solicitudes')
                    .update({ estado: 'completada' })
                    .eq('id', id);

                if (error) console.error('Error al marcar completada:', error);
            } catch (e) {
                console.error('Error al marcar completada:', e);
            }

            isPlaying = false;
            idActual  = null;

            timeCounter.classList.add('hidden');

            detenerYouTube();
            fuenteActual = 'local';
            notificarFuenteAdmin('local');

            detenerNormalizacion();
            resetTono(true);

            player.onended = null;
            player.onerror = null;
            try {
                player.pause();
                player.removeAttribute('src');
                player.load();
            } catch (e) {
                player.src = '';
            }

            completandoCancion = false;
            buscarSiguienteCancion();
        }

        supabaseClient.channel('cambios-db')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'Solicitudes' }, () => {
                buscarSiguienteCancion();
            })
            .subscribe();

        setInterval(() => {
            if (systemActive && !isPlaying && !completandoCancion) {
                buscarSiguienteCancion();
            }
        }, 4000);

        canalAdmin
            .on('broadcast', { event: 'control' }, ({ payload }) => {
                switch (payload.accion) {

                    case 'pausa':
                        if (fuenteActual === 'youtube') {
                            if (!ytPlayer) break;
                            try {
                                const estado = ytPlayer.getPlayerState();
                                if (estado === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                                else ytPlayer.playVideo();
                            } catch (e) {}
                        } else if (player.paused) {
                            try { const p = player.play(); if (p?.catch) p.catch(() => {}); } catch (e) {}
                        } else {
                            player.pause();
                        }
                        break;

                    case 'reiniciar':
                        if (!isPlaying) break;
                        if (fuenteActual === 'youtube') {
                            if (!ytPlayer) break;
                            try {
                                ytPlayer.seekTo(0, true);
                                ytPlayer.playVideo();
                            } catch (e) {}
                        } else if (player.src) {
                            player.currentTime = 0;
                            try { const p = player.play(); if (p?.catch) p.catch(() => {}); } catch (e) {}
                        }
                        break;

                    case 'saltar':
                        if (isPlaying && idActual) marcarComoCompletada(idActual);
                        break;

                    case 'efecto':
                        if (payload.valor) reproducirEfecto(payload.valor);
                        break;

                    case 'tono':
                        if (payload.delta !== undefined) cambiarTono(payload.delta);
                        break;

                    case 'reset_tono':
                        resetTono(false);
                        break;
                }
            })
            .subscribe();
    </script>
</body>
</html>
