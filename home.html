<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Latino · Sala privada en Lechería</title>
<meta name="description" content="Sala privada de karaoke en Lechería. Más de 4.000 canciones, pantalla de 65 pulgadas, tres micrófonos inalámbricos y un sistema donde pides desde tu propio celular.">

<meta property="og:title" content="Karaoke Latino · Sala privada en Lechería">
<meta property="og:description" content="Más de 4.000 canciones, pantalla de 65″ y la sala solo para ustedes.">
<meta property="og:type" content="website">

<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    html { scroll-behavior: smooth; }

    /* La barra de arriba es fija y mide 64 px. Sin esto, al saltar a una
       seccion su titulo queda escondido justo debajo. */
    section[id] { scroll-margin-top: 4rem; }

    /* ------------------------------------------------------------------
       Hueco de foto
       ------------------------------------------------------------------
       Javier todavia no tiene las fotos buenas. Cada hueco es un bloque con
       degradado y un icono, para que la pagina no se vea rota mientras tanto.

       PARA PONER UNA FOTO DE VERDAD:
       cambia  <div class="foto-hueco"> ... </div>
       por     <img src="fotos/loquesea.jpg" alt="" class="w-full h-full object-cover">
       ------------------------------------------------------------------ */
    .foto-hueco {
        background:
            radial-gradient(circle at 30% 20%, rgba(251,191,36,.10), transparent 60%),
            linear-gradient(135deg, #1c1917 0%, #292524 50%, #1c1917 100%);
    }

    /* La foto de portada va difuminada: pone ambiente sin competir con el
       titulo, que es lo que tiene que leerse. El scale de mas tapa el borde
       claro que el difuminado deja en los cuatro lados. */
    .foto-portada {
        filter: blur(7px) saturate(1.06);
        transform: scale(1.07);
    }

    /* El velo por encima. Va fuerte a proposito: la foto tiene fondo casi
       blanco y el titulo es blanco; con menos, no se leia. */
    .velo-hero {
        background: linear-gradient(to bottom,
            rgba(9,9,11,.62) 0%, rgba(9,9,11,.84) 50%, rgb(9,9,11) 100%);
    }

    /* Aparecer al hacer scroll. Si el navegador no soporta el observador, las
       secciones se quedan visibles: nunca se esconde nada sin poder mostrarlo. */
    .aparece { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
        html { scroll-behavior: auto; }
    }
</style>
</head>

<body class="bg-zinc-950 text-zinc-100 font-sans antialiased">

<!-- ══════════════════════════════════════════════════════════ BARRA ═══ -->
<header class="fixed top-0 inset-x-0 z-50 backdrop-blur-md bg-zinc-950/80 border-b border-zinc-800/80">
    <div class="max-w-6xl mx-auto px-5 h-16 flex items-center justify-between gap-4">

        <a href="#inicio" class="flex items-center gap-2.5 flex-shrink-0">
            <img src="logo.png" alt="Karaoke Latino" class="h-9 w-auto object-contain">
            <span class="font-black tracking-tight text-[15px] hidden sm:block">KARAOKE LATINO</span>
        </a>

        <nav class="hidden md:flex items-center gap-7 text-[13px] font-medium text-zinc-400">
            <a href="#como" class="hover:text-amber-400 transition-colors" data-t="navComo"></a>
            <a href="#sistema" class="hover:text-amber-400 transition-colors" data-t="navSistema"></a>
            <a href="#sala" class="hover:text-amber-400 transition-colors" data-t="navSala"></a>
            <a href="#precios" class="hover:text-amber-400 transition-colors" data-t="navPrecios"></a>
            <a href="#resenas" class="hover:text-amber-400 transition-colors" data-t="navResenas"></a>
        </nav>

        <div class="flex items-center gap-2.5 flex-shrink-0">
            <!-- Cambio de idioma. La bandera que se ve es la del idioma en
                 el que esta la pagina ahora mismo. -->
            <button id="btnIdioma" type="button"
                class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-zinc-700
                       hover:border-amber-500/60 hover:bg-zinc-900 transition-colors"
                aria-label="Cambiar idioma / Switch language">
                <span id="banderaIcono" class="block w-6 h-4 rounded-[2px] overflow-hidden shadow-sm"></span>
                <span id="banderaTexto" class="text-[11px] font-bold text-zinc-400 tracking-wider"></span>
            </button>

            <a id="waBarra" href="#" target="_blank" rel="noopener"
               class="bg-amber-400 hover:bg-amber-300 text-black font-bold text-[13px]
                      px-4 py-2 rounded-lg transition-colors whitespace-nowrap"
               data-t="btnReservar"></a>
        </div>
    </div>
</header>


<!-- ═══════════════════════════════════════════════════════════ HERO ═══ -->
<section id="inicio" class="relative min-h-[88vh] flex items-center pt-16 overflow-hidden">

    <!-- FOTO DE PORTADA. Provisional hasta que haya fotos de la sala de
         verdad: para cambiarla, se deja otra en fotos/ y se cambia el src.
         El alt va vacio porque es decoracion; lo que cuenta lo dice el
         titulo que va encima. -->
    <img src="fotos/cantando.jpg" alt="" aria-hidden="true" fetchpriority="high"
         class="foto-portada absolute inset-0 w-full h-full object-cover">
    <div class="velo-hero absolute inset-0"></div>

    <div class="relative max-w-6xl mx-auto px-5 py-20 w-full">
        <div class="max-w-2xl">

            <p class="inline-flex items-center gap-2 bg-amber-400/10 border border-amber-400/30
                      text-amber-300 text-[11px] font-bold tracking-[0.15em] uppercase
                      px-3 py-1.5 rounded-full mb-6">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                <span data-t="heroEtiqueta"></span>
            </p>

            <h1 class="text-[2.6rem] sm:text-6xl lg:text-7xl font-black leading-[1.05] tracking-tight mb-6">
                <span data-t="heroTitulo1"></span><br>
                <span class="text-amber-400" data-t="heroTitulo2"></span>
            </h1>

            <p class="text-zinc-300 text-lg sm:text-xl leading-relaxed mb-9 max-w-xl" data-t="heroTexto"></p>

            <div class="flex flex-col sm:flex-row gap-3">
                <a id="waHero" href="#" target="_blank" rel="noopener"
                   class="bg-amber-400 hover:bg-amber-300 text-black font-bold text-base
                          px-7 py-4 rounded-xl transition-colors text-center
                          shadow-lg shadow-amber-400/20">
                    <span data-t="btnReservarLargo"></span>
                </a>
                <a href="#como"
                   class="border border-zinc-700 hover:border-zinc-500 hover:bg-zinc-900
                          text-zinc-200 font-bold text-base px-7 py-4 rounded-xl
                          transition-colors text-center" data-t="btnComoFunciona"></a>
            </div>
        </div>
    </div>
</section>


<!-- ══════════════════════════════════════════════════════════ CIFRAS ═══ -->
<section class="border-y border-zinc-800/80 bg-zinc-900/30">
    <div class="max-w-6xl mx-auto px-5 grid grid-cols-2 lg:grid-cols-4 divide-x divide-y lg:divide-y-0 divide-zinc-800/80">
        <div class="py-8 px-4 text-center">
            <svg class="w-7 h-7 mx-auto mb-3 text-amber-400/55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17.25V5.4l11-2.15v11.6"/><path d="M9 9.3l11-2.15"/><ellipse cx="6.6" cy="18.4" rx="2.45" ry="2.1" fill="currentColor" stroke="none" transform="rotate(-18 6.6 18.4)"/><ellipse cx="17.6" cy="16.2" rx="2.45" ry="2.1" fill="currentColor" stroke="none" transform="rotate(-18 17.6 16.2)"/></svg>
            <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">4.000+</p>
            <p class="text-[11px] sm:text-xs text-zinc-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraCanciones"></p>
        </div>
        <div class="py-8 px-4 text-center">
            <svg class="w-7 h-7 mx-auto mb-3 text-amber-400/55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.9 2.6 7.6 12 12.3l9.4-4.7z"/><path d="M2.6 12.2 12 16.9l9.4-4.7"/><path d="M2.6 16.4 12 21.1l9.4-4.7"/></svg>
            <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">40</p>
            <p class="text-[11px] sm:text-xs text-zinc-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraGeneros"></p>
        </div>
        <div class="py-8 px-4 text-center">
            <svg class="w-7 h-7 mx-auto mb-3 text-amber-400/55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.4" y="3.9" width="19.2" height="13.2" rx="2.2"/><path d="M12 17.1v3.2"/><path d="M8.3 20.3h7.4"/></svg>
            <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">65″</p>
            <p class="text-[11px] sm:text-xs text-zinc-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraPantalla"></p>
        </div>
        <div class="py-8 px-4 text-center">
            <svg class="w-7 h-7 mx-auto mb-3 text-amber-400/55" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.8 20.4v-1.7a3.9 3.9 0 0 0-3.9-3.9H6.5a3.9 3.9 0 0 0-3.9 3.9v1.7"/><circle cx="9.2" cy="7.6" r="3.4"/><path d="M21.4 20.4v-1.7a3.9 3.9 0 0 0-2.9-3.77"/><path d="M15.1 4.4a3.9 3.9 0 0 1 0 6.4"/></svg>
            <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">15</p>
            <p class="text-[11px] sm:text-xs text-zinc-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraPersonas"></p>
        </div>
    </div>
</section>


<!-- ═══════════════════════════════════════════════════ COMO FUNCIONA ═══ -->
<section id="como" class="py-24 px-5">
    <div class="max-w-6xl mx-auto">
        <div class="aparece text-center max-w-2xl mx-auto mb-16">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="comoTitulo"></h2>
            <p class="text-zinc-400 text-lg leading-relaxed" data-t="comoTexto"></p>
        </div>

        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <!-- Los cuatro pasos se pintan desde JS para no repetir el molde
                 cuatro veces en dos idiomas. -->
            <div id="pasos" class="contents"></div>
        </div>
    </div>
</section>


<!-- ════════════════════════════════════════════════════════ SISTEMA ═══ -->
<section id="sistema" class="py-24 px-5 bg-zinc-900/30 border-y border-zinc-800/80">
    <div class="max-w-6xl mx-auto">

        <div class="aparece text-center max-w-2xl mx-auto mb-16">
            <p class="text-amber-400 text-[11px] font-bold tracking-[0.2em] uppercase mb-3" data-t="sistemaEtiqueta"></p>
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="sistemaTitulo"></h2>
            <p class="text-zinc-400 text-lg leading-relaxed" data-t="sistemaTexto"></p>
        </div>

        <div class="grid md:grid-cols-3 gap-5" id="ventajas"></div>

        <div class="aparece mt-12 text-center">
            <p class="text-zinc-500 text-sm italic" data-t="sistemaPie"></p>
        </div>
    </div>
</section>


<!-- ═══════════════════════════════════════════════════════════ SALA ═══ -->
<section id="sala" class="py-24 px-5">
    <div class="max-w-6xl mx-auto">

        <div class="grid lg:grid-cols-2 gap-14 items-center">

            <div class="aparece">
                <p class="text-amber-400 text-[11px] font-bold tracking-[0.2em] uppercase mb-3" data-t="salaEtiqueta"></p>
                <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-5" data-t="salaTitulo"></h2>
                <p class="text-zinc-400 text-lg leading-relaxed mb-8" data-t="salaTexto"></p>

                <ul id="equipos" class="space-y-3.5"></ul>
            </div>

            <div class="aparece grid grid-cols-2 gap-4">
                <!-- FOTOS DE LA SALA: cuatro. La primera es la que manda. -->
                <div class="foto-hueco aspect-[4/5] rounded-2xl border border-zinc-800 col-span-2 flex items-center justify-center">
                    <span class="text-zinc-700 text-xs font-bold tracking-wider uppercase" data-t="fotoPendiente"></span>
                </div>
                <div class="foto-hueco aspect-square rounded-2xl border border-zinc-800"></div>
                <div class="foto-hueco aspect-square rounded-2xl border border-zinc-800"></div>
            </div>
        </div>
    </div>
</section>


<!-- ══════════════════════════════════════════════════════ GENEROS ════ -->
<section class="py-24 px-5 bg-zinc-900/30 border-y border-zinc-800/80">
    <div class="max-w-5xl mx-auto text-center">
        <div class="aparece">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="generosTitulo"></h2>
            <p class="text-zinc-400 text-lg leading-relaxed mb-10 max-w-2xl mx-auto" data-t="generosTexto"></p>
        </div>
        <div id="generos" class="aparece flex flex-wrap justify-center gap-2.5"></div>
    </div>
</section>


<!-- ════════════════════════════════════════════════════════ PRECIOS ═══ -->
<section id="precios" class="py-24 px-5">
    <div class="max-w-3xl mx-auto">

        <div class="aparece text-center mb-12">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="preciosTitulo"></h2>
            <p class="text-zinc-400 text-lg" data-t="preciosTexto"></p>
        </div>

        <div class="aparece bg-gradient-to-b from-zinc-900 to-zinc-900/40 border border-zinc-800
                    rounded-3xl p-8 sm:p-12 text-center">

            <!-- ⚠️ PRECIO: si algun dia cambia, se cambia AQUI y en las dos
                 traducciones de mas abajo (precioNota). -->
            <p class="text-zinc-500 text-sm font-bold uppercase tracking-[0.15em] mb-3" data-t="precioEtiqueta"></p>
            <p class="text-6xl sm:text-7xl font-black text-amber-400 tracking-tight mb-2">$20</p>
            <p class="text-zinc-300 text-lg font-medium mb-8" data-t="precioUnidad"></p>

            <div class="border-t border-zinc-800 pt-8 space-y-3 text-left max-w-sm mx-auto mb-9" id="precioDetalles"></div>

            <a id="waPrecios" href="#" target="_blank" rel="noopener"
               class="inline-block bg-amber-400 hover:bg-amber-300 text-black font-bold
                      px-8 py-4 rounded-xl transition-colors shadow-lg shadow-amber-400/20"
               data-t="btnReservarLargo"></a>
        </div>

        <!-- La tienda de refrigerios, que ya existe y funciona aparte. -->
        <div class="aparece mt-6 bg-zinc-900/50 border border-zinc-800 rounded-2xl p-6
                    flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <p class="font-bold text-zinc-100 mb-1" data-t="tiendaTitulo"></p>
                <p class="text-zinc-500 text-sm" data-t="tiendaTexto"></p>
            </div>
            <a href="tienda.html"
               class="flex-shrink-0 border border-zinc-700 hover:border-amber-500/60 hover:bg-zinc-800
                      text-zinc-200 font-bold text-sm px-6 py-3 rounded-xl transition-colors whitespace-nowrap"
               data-t="btnVerTienda"></a>
        </div>
    </div>
</section>


<!-- ════════════════════════════════════════════════════════ RESENAS ═══ -->
<section id="resenas" class="py-24 px-5 bg-zinc-900/30 border-t border-zinc-800/80">
    <div class="max-w-6xl mx-auto">

        <div class="aparece text-center max-w-2xl mx-auto mb-14">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="resenasTitulo"></h2>
            <p class="text-zinc-400 text-lg leading-relaxed" data-t="resenasTexto"></p>
        </div>

        <div id="listaResenas" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 mb-10"></div>

        <div class="text-center">
            <a href="resenas.html"
               class="inline-block border border-zinc-700 hover:border-amber-500/60 hover:bg-zinc-900
                      text-zinc-200 font-bold px-7 py-3.5 rounded-xl transition-colors"
               data-t="btnDejarResena"></a>
        </div>
    </div>
</section>


<!-- ═════════════════════════════════════════════════════════ CIERRE ═══ -->
<section class="py-24 px-5 border-t border-zinc-800/80">
    <div class="max-w-3xl mx-auto text-center">
        <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-5" data-t="cierreTitulo"></h2>
        <p class="text-zinc-400 text-lg leading-relaxed mb-9" data-t="cierreTexto"></p>
        <a id="waCierre" href="#" target="_blank" rel="noopener"
           class="inline-flex items-center gap-2.5 bg-amber-400 hover:bg-amber-300 text-black

            </svg>
            <span data-t="btnWhatsapp"></span>
        </a>
    </div>
</section>


<!-- ═════════════════════════════════════════════════════════ FOOTER ═══ -->
<!-- ═══════════════════════════════════════════════ BOTONES FLOTANTES ═══ -->

let idioma = 'es';


// ------------------------------------------------------------------ pintar
function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
}

function estrellas(n) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<svg class="w-4 h-4 ' + (i <= n ? 'text-amber-400' : 'text-zinc-700') +
                '" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' +
                '<path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L1.5 7.7l5.9-.9z"/></svg>';
    }
    return '<div class="flex gap-0.5">' + html + '</div>';
}

function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    // Todo lo que lleva data-t.
    document.querySelectorAll('[data-t]').forEach((el) => {
        const valor = t[el.dataset.t];
        if (typeof valor === 'string') el.textContent = valor;
    });

    // El boton enseña el idioma que se esta leyendo AHORA, no al que se
    // cambiaria. Se probo al reves y confundia: se leia como si la pagina
    // estuviera en el idioma de la bandera de al lado.
    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    // Los enlaces de WhatsApp, con el mensaje ya escrito.
    const enlace = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);
    ['waBarra', 'waHero', 'waPrecios', 'waCierre', 'waFooter', 'waBurbuja'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.href = enlace;
    });

    // Los cuatro pasos.
    document.getElementById('pasos').innerHTML = t.pasos.map((p, i) => `
        <div class="aparece bg-zinc-900/60 border border-zinc-800 rounded-2xl p-6 hover:border-zinc-700 transition-colors">
            <div class="w-9 h-9 rounded-lg bg-amber-400/10 border border-amber-400/30
                        flex items-center justify-center mb-4">
                <span class="text-amber-400 font-black text-sm">${i + 1}</span>
            </div>
            <h3 class="font-bold text-zinc-100 mb-2">${escapar(p.t)}</h3>
            <p class="text-zinc-400 text-sm leading-relaxed">${escapar(p.d)}</p>
        </div>`).join('');

    // Las tres ventajas del sistema.
    document.getElementById('ventajas').innerHTML = t.ventajas.map((v) => `
        <div class="aparece bg-zinc-950/60 border border-zinc-800 rounded-2xl p-7">
            <h3 class="font-bold text-amber-400 mb-3 leading-snug">${escapar(v.t)}</h3>
            <p class="text-zinc-400 text-sm leading-relaxed">${escapar(v.d)}</p>
        </div>`).join('');

    // La lista de equipos.
    document.getElementById('equipos').innerHTML = t.equipos.map((e) => `
        <li class="flex items-start gap-3">
            <svg class="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">

            </svg>
            <span class="text-zinc-300">${escapar(e)}</span>
        </li>`).join('');

    // Lo que incluye el precio.
    document.getElementById('precioDetalles').innerHTML = t.precioDetalles.map((d) => `
        <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-zinc-600 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0z"/>
            </svg>
            <span class="text-zinc-400 text-sm">${escapar(d)}</span>
        </div>`).join('');

    // Los generos.
    document.getElementById('generos').innerHTML = t.generos.map((g) => `
        <span class="bg-zinc-800/60 border border-zinc-700/60 text-zinc-300 text-sm
                     font-medium px-4 py-2 rounded-full">${escapar(g)}</span>`).join('');

    pintarResenas();
    observarAparicion();

    try { localStorage.setItem('kl_idioma', idioma); } catch (e) {}
}

        </article>`).join('');

    observarAparicion();
}

// -------------------------------------------------------------- apariciones
let observador = null;

function observarAparicion() {
    if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.aparece').forEach((el) => el.classList.add('visible'));
        return;
    }
    if (!observador) {
        observador = new IntersectionObserver((entradas) => {
            entradas.forEach((e) => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    observador.unobserve(e.target);
                }
            });
        }, { rootMargin: '0px 0px -60px 0px' });
    }
    document.querySelectorAll('.aparece:not(.visible)').forEach((el) => observador.observe(el));
}


// ------------------------------------------------------------------ arranque
document.getElementById('btnIdioma').addEventListener('click', () => {
    idioma = idioma === 'es' ? 'en' : 'es';
    aplicarIdioma();
});

// Los enlaces del menu movian la pagina poniendo "#como" y demas en la barra
// de direcciones. Funcionaba, pero se ve descuidado y encima deja la
// direccion rara si alguien la copia para compartirla. Se desplaza a mano y
// la direccion se queda limpia.
document.querySelectorAll('a[href^="#"]').forEach((enlace) => {
    enlace.addEventListener('click', (ev) => {
        const destino = document.getElementById(enlace.getAttribute('href').slice(1));
        if (!destino) return;               // por si el enlace apunta a nada
        ev.preventDefault();
        // El hero es el principio de la pagina: ahi se sube del todo, para que
        // no quede un dedo de hueco por encima.
        if (destino.id === 'inicio') window.scrollTo({ top: 0, behavior: 'smooth' });
        else destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

// Si llegan con un "#algo" pegado (de un enlace viejo o de compartir), se
// quita de la barra sin recargar ni perder el sitio.
if (location.hash) {
    history.replaceState(null, '', location.pathname + location.search);
}

// El boton de subir solo aparece cuando ya se bajo lo suficiente como para
// que volver a mano sea un fastidio.
const btnArriba = document.getElementById('btnArriba');

btnArriba.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Marcar en que seccion se esta. En una pagina de una sola hoja no hay
// jerarquia que enseñar, asi que lo util es esto: saber donde estas.
const enlacesMenu = [...document.querySelectorAll('nav a[href^="#"]')];
const secciones = enlacesMenu
    .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
    .filter(Boolean);

function alDesplazarse() {
    // Boton de subir
    if (window.scrollY > 600) {
        btnArriba.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    } else {
        btnArriba.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }

    // Seccion activa: la ultima cuyo principio ya quedo por encima de la
    // mitad de la pantalla.
    let activa = null;
    for (const sec of secciones) {
        if (sec.getBoundingClientRect().top <= window.innerHeight * 0.5) activa = sec.id;
    }
    enlacesMenu.forEach((a) => {
        const suya = a.getAttribute('href').slice(1) === activa;
        a.classList.toggle('text-amber-400', suya);
        a.classList.toggle('text-zinc-400', !suya);
    });
}

window.addEventListener('scroll', alDesplazarse, { passive: true });
alDesplazarse();

document.getElementById('anio').textContent = new Date().getFullYear();

// Redes: cada una se enseña solo si tiene usuario puesto arriba.
const enlaceTiktok = document.getElementById('tiktok');
if (REDES.tiktok) {
    enlaceTiktok.href = 'https://tiktok.com/@' + REDES.tiktok;
} else {
    enlaceTiktok.remove();
}

// Si ya eligio idioma antes, se respeta. Si no, se mira el del navegador:
// el turista que llega de fuera ve la web en ingles sin tener que buscar
// el boton.
try {
    const guardado = localStorage.getItem('kl_idioma');
    if (guardado === 'es' || guardado === 'en') {
        idioma = guardado;
    } else if (!String(navigator.language || '').toLowerCase().startsWith('es')) {
        idioma = 'en';
    }
} catch (e) {}

aplicarIdioma();
cargarResenas();
</script>
