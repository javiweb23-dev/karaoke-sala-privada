<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Karaoke Latino · Sala privada en Lechería">

<meta property="og:type" content="website">

<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    html { scroll-behavior: smooth; }

    /* La barra de arriba es fija y mide 64 px. Sin esto, al saltar a una
       seccion su titulo queda escondido justo debajo. */
    section[id] { scroll-margin-top: 4rem; }

    /* ------------------------------------------------------------------
       LAS FOTOS
       ------------------------------------------------------------------
       Estan todas en fotos/ y se cambian dejando otra con el mismo nombre:

         cantando.jpg        la portada de arriba
         sala-principal.jpg  la de la seccion "La sala"
         paso-1-reservas.jpg
         paso-2-escanea.jpg   los cuatro pasos de "Como funciona"
         paso-3-pide.jpg
         paso-4-canta.jpg
         app-*.jpg           las capturas del telefono

       Las de los pasos son de Pexels: uso comercial permitido y sin
       obligacion de acreditar al autor.
       ------------------------------------------------------------------ */

    /* La foto de portada se ve nitida. Lo unico que se toca es un punto de
       contraste y saturacion, para que no compita en claridad con el texto
       blanco que lleva encima. */
    .foto-portada {
        filter: saturate(1.08) contrast(1.04);
    }

    /* El velo. En pantalla ancha va en horizontal: muy oscuro a la izquierda,
       donde esta el titulo, y casi transparente a la derecha, donde estan
       ellos cantando. Asi el texto se lee y la foto se ve.
       La segunda capa, vertical, mete la foto por debajo de la barra de
       arriba y la funde con el negro de la seccion siguiente. */
    .velo-hero {
        background:
            linear-gradient(to right,
                rgba(9,9,11,.95) 0%,  rgba(9,9,11,.88) 26%,
                rgba(9,9,11,.55) 52%, rgba(9,9,11,.30) 78%,
                rgba(9,9,11,.28) 100%),
            linear-gradient(to bottom,
                rgba(9,9,11,.55) 0%,  rgba(9,9,11,.05) 20%,
                rgba(9,9,11,.35) 72%, rgb(9,9,11) 100%);
    }

    /* En el telefono el texto ocupa todo el ancho, asi que un velo lateral no
       sirve de nada: tiene que ser parejo. Se deja mas claro en la franja de
       arriba, que es donde quedan las caras. */
    @media (max-width: 767px) {
        .velo-hero {
            background: linear-gradient(to bottom,
                rgba(9,9,11,.60) 0%,  rgba(9,9,11,.42) 22%,
                rgba(9,9,11,.80) 48%, rgba(9,9,11,.92) 72%,
                rgb(9,9,11) 100%);
        }
    }

    /* El marco de telefono que envuelve cada captura. Recortadas a una franja
       se veian como un trozo de pantalla arrancado; dentro de un telefono se
       entiende de que son sin tener que explicarlo. */
    .telefono {
        background: linear-gradient(160deg, #3f3f46 0%, #18181b 45%, #27272a 100%);
        box-shadow: 0 18px 40px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05) inset;
    }

    /* ------------------------------------------------------------------
       El cintillo de caratulas
       ------------------------------------------------------------------
       La pista lleva la lista DOS veces seguidas y se desplaza hasta el -50%.
       Justo en ese punto el segundo juego esta donde arrancó el primero, asi
       que al volver a cero no se nota el salto y parece infinito.

       Las caratulas salen de la API de iTunes, la misma que ya usa la app
       para las portadas de la lista. Cada una es de una cancion que esta de
       verdad en la sala.
       ------------------------------------------------------------------ */
    .cintillo {
        overflow: hidden;
        /* Se desvanece por los lados para que no se vea el corte seco. */
        -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
                mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
    }
    .cintillo-pista {
        display: flex;
        gap: 14px;
        width: max-content;
        animation: correr 70s linear infinite;
    }
    .cintillo-pista.al-reves { animation-direction: reverse; }
    .cintillo:hover .cintillo-pista { animation-play-state: paused; }
    @keyframes correr { to { transform: translateX(-50%); } }

    /* A quien le moleste el movimiento se le deja quieto. */
    @media (prefers-reduced-motion: reduce) {
        .cintillo-pista { animation: none; }
    }

    /* Aparecer al hacer scroll. Si el navegador no soporta el observador, las
       secciones se quedan visibles: nunca se esconde nada sin poder mostrarlo. */
    .aparece { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
        html { scroll-behavior: auto; }
    }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════ HERO ═══ -->

            <div class="flex flex-col sm:flex-row gap-3">

                    <span data-t="btnReservarLargo"></span>

                          transition-colors text-center" data-t="btnSistema"></a>
            </div>

</section>

            <p class="text-3xl sm:text-4xl font-black text-amber-400 tracking-tight">15</p>
            <p class="text-[11px] sm:text-xs text-zinc-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraPersonas"></p>
        </div>

</section>

<!-- ═══════════════════════════════════════════════════════════ SALA ═══ -->

            <div class="aparece">

                <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-5" data-t="salaTitulo"></h2>

                <ul id="equipos" class="space-y-3.5"></ul>

                 mismo nombre y ya esta.

                 La foto tiene fondo blanco de estudio, que sobre esta web
                 canta: el velo de abajo la asienta en el negro sin apagar el
                 amarillo de la camisa, que justo es el color de la casa. -->
            <div class="aparece relative rounded-2xl overflow-hidden border border-zinc-800
                        aspect-[4/3] sm:aspect-square bg-zinc-900">
                <img src="fotos/sala-principal.jpg" alt="" loading="lazy"

                        linear-gradient(to bottom, rgba(9,9,11,.58) 0%, rgba(9,9,11,0) 30%),
                        linear-gradient(to top, rgba(9,9,11,.80) 0%, rgba(9,9,11,0) 42%)"></div>
            </div>
        </div>

</section>


<!-- ══════════════════════════════════════════════════════ GENEROS ════ -->
<section class="py-24 px-5 bg-zinc-900/30 border-y border-zinc-800/80">
    <div class="max-w-5xl mx-auto text-center">
        <div class="aparece">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="generosTitulo"></h2>
            <p class="text-zinc-400 text-lg leading-relaxed mb-10 max-w-2xl mx-auto" data-t="generosTexto"></p>
        </div>
        <!-- El cintillo va antes que los generos: entra por los ojos y deja
             claro de un vistazo que la lista no son cuatro nombres. -->
        <div class="cintillo mb-4 -mx-5"><div class="cintillo-pista" id="cintillo1"></div></div>
        <div class="cintillo mb-12 -mx-5"><div class="cintillo-pista al-reves" id="cintillo2"></div></div>

        <p class="text-zinc-500 text-sm mt-8 max-w-2xl mx-auto leading-relaxed" data-t="generosPie"></p>
    </div>
</section>


<!-- ════════════════════════════════════════════════════════ PRECIOS ═══ -->
<section id="precios" class="py-24 px-5">
    <div class="max-w-5xl mx-auto">

        <div class="aparece text-center mb-12">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="preciosTitulo"></h2>
            <p class="text-zinc-400 text-lg" data-t="preciosTexto"></p>
        </div>

        <div class="grid lg:grid-cols-2 gap-6 items-stretch">

            <!-- La foto va a la IZQUIERDA, al reves que en "La sala": asi las
                 dos secciones con foto no se ven calcadas al bajar.

                 Esta viene con la chica pegada a su izquierda y medio encuadre
                 de fondo vacio, por eso el object-position tira hacia ahi. -->
            <div class="aparece relative rounded-2xl overflow-hidden border border-zinc-800
                        bg-zinc-900 min-h-[300px] lg:min-h-0 order-2 lg:order-1">
                <img src="fotos/precios.jpg" alt="" loading="lazy"
                     class="absolute inset-0 w-full h-full object-cover object-[22%_40%]"
                     style="filter:saturate(.82) brightness(.94)">
                <div class="absolute inset-0 pointer-events-none"
                     style="background:
                        radial-gradient(110% 80% at 30% 40%, transparent 42%, rgba(9,9,11,.55) 100%),
                        linear-gradient(to bottom, rgba(9,9,11,.45) 0%, rgba(9,9,11,0) 28%),
                        linear-gradient(to top, rgba(9,9,11,.72) 0%, rgba(9,9,11,0) 40%)"></div>
            </div>

            <!-- La tarjeta, ajustada a lo que lleva dentro: antes ocupaba el
                 ancho entero para cuatro lineas y sobraba aire por todos lados. -->
            <div class="aparece bg-gradient-to-b from-zinc-900 to-zinc-900/40 border border-zinc-800
                        rounded-2xl p-7 sm:p-8 flex flex-col justify-center order-1 lg:order-2">

                <!-- ⚠️ PRECIO: si cambia, se cambia AQUI y en precioUnidad
                     y precioDetalles de las dos traducciones. -->
                <p class="text-zinc-500 text-xs font-bold uppercase tracking-[0.15em] mb-2" data-t="precioEtiqueta"></p>
                <p class="text-5xl sm:text-6xl font-black text-amber-400 tracking-tight leading-none mb-2">$20</p>
                <p class="text-zinc-300 font-medium mb-6" data-t="precioUnidad"></p>

                <div class="border-t border-zinc-800 pt-6 space-y-2.5 mb-7" id="precioDetalles"></div>

                <a id="waPrecios" href="#" target="_blank" rel="noopener"
                   class="block text-center bg-amber-400 hover:bg-amber-300 text-black font-bold
                          px-6 py-3.5 rounded-xl transition-colors shadow-lg shadow-amber-400/20"
                   data-t="btnReservarLargo"></a>
            </div>
        </div>

        <!-- La tienda de refrigerios, que ya existe y funciona aparte. -->

                    flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">

                      text-zinc-200 font-bold text-sm px-6 py-3 rounded-xl transition-colors whitespace-nowrap"
               data-t="btnVerTienda"></a>
        </div>
    </div>
</section>


<!-- ════════════════════════════════════════════════════════ RESENAS ═══ -->

<!-- ═════════════════════════════════════════════════════════ CIERRE ═══ -->
<section class="py-24 px-5 border-t border-zinc-800/80">

        <a id="waCierre" href="#" target="_blank" rel="noopener"
           class="inline-flex items-center gap-2.5 bg-amber-400 hover:bg-amber-300 text-black
                  font-bold text-lg px-9 py-4 rounded-xl transition-colors shadow-lg shadow-amber-400/20">

const WHATSAPP = '584121591072';
const MENSAJES_WA = {
    es: 'Hola! Quiero reservar la sala de karaoke.',
    en: 'Hi! I would like to book the karaoke room.'
};

let idioma = 'es';


// ------------------------------------------------------------------ pintar
function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
}

function estrellas(n) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<svg class="w-4 h-4 ' + (i <= n ? 'text-amber-400' : 'text-zinc-700') +
                '" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' +
                '<path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L1.5 7.7l5.9-.9z"/></svg>';
    }
    return '<div class="flex gap-0.5">' + html + '</div>';
}

function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    // Todo lo que lleva data-t.
    document.querySelectorAll('[data-t]').forEach((el) => {
        const valor = t[el.dataset.t];
        if (typeof valor === 'string') el.textContent = valor;
    });

    // El boton enseña el idioma que se esta leyendo AHORA, no al que se
    // cambiaria. Se probo al reves y confundia: se leia como si la pagina
    // estuviera en el idioma de la bandera de al lado.
    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    // Los enlaces de WhatsApp, con el mensaje ya escrito.
    const enlace = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);
    ['waBarra', 'waHero', 'waPrecios', 'waCierre', 'waFooter', 'waBurbuja'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.href = enlace;
    });

    // Los cuatro pasos.

    // Las tres ventajas del sistema.
    // Cada captura va dentro de un telefono. Las dos del control de audio son
    // el mismo archivo, asi que a esas se les acerca la imagen (zoom) y se
    // ancla arriba o abajo: una enseña el tono y la otra los efectos, y se ven
    // como dos pantallas distintas, que es lo que son.
    document.getElementById('ventajas').innerHTML = t.ventajas.map((v) => `
        <div class="aparece flex flex-col items-center text-center">

            <div class="telefono w-[228px] lg:w-[186px] rounded-[1.9rem] p-[6px] mb-6">
                <div class="relative overflow-hidden rounded-[1.55rem] bg-black aspect-[9/16]">
                    <div class="absolute top-2 left-1/2 -translate-x-1/2 z-10
                                h-[3px] w-9 rounded-full bg-zinc-600/70"></div>
                    <img src="${v.img}" alt="" loading="lazy"
                         class="w-full h-full object-cover ${v.pos}"
                         style="${v.zoom || ''}">
                </div>
            </div>

            <h3 class="font-bold text-amber-400 mb-2.5 leading-snug">${escapar(v.t)}</h3>
            <p class="text-zinc-400 text-sm leading-relaxed">${escapar(v.d)}</p>
        </div>`).join('');

    // La lista de equipos.
    document.getElementById('equipos').innerHTML = t.equipos.map((e) => `
        <li class="flex items-start gap-3">
            <svg class="w-5 h-5 text-amber-400 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0z"/>
            </svg>
            <span class="text-zinc-300">${escapar(e)}</span>
        </li>`).join('');

    // Lo que incluye el precio.
    document.getElementById('precioDetalles').innerHTML = t.precioDetalles.map((d) => `
        <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-zinc-600 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0z"/>
            </svg>
            <span class="text-zinc-400 text-sm">${escapar(d)}</span>
        </div>`).join('');

    // El cintillo. Dos filas, cada una con la mitad de las caratulas y en
    // sentido contrario: asi no parecen la misma cinta repetida.
    const mitad = Math.ceil(PORTADAS.length / 2);
    const pintarCintillo = (id, lista) => {
        const una = (p) => `
            <figure class="flex-shrink-0 w-[104px] sm:w-[124px] m-0">
                <img src="fotos/portadas/${p.f}" alt="" loading="lazy"
                     class="w-full aspect-square object-cover rounded-xl border border-zinc-800">
                <figcaption class="text-zinc-500 text-[10px] mt-1.5 text-center truncate">${escapar(p.a)}</figcaption>
            </figure>`;
        // Dos veces la misma lista: es lo que hace que el bucle no se note.
        document.getElementById(id).innerHTML = lista.map(una).join('') + lista.map(una).join('');
    };
    pintarCintillo('cintillo1', PORTADAS.slice(0, mitad));
    pintarCintillo('cintillo2', PORTADAS.slice(mitad));


    pintarResenas();
    observarAparicion();

    try { localStorage.setItem('kl_idioma', idioma); } catch (e) {}
}


// ----------------------------------------------------------------- reseñas
// Se guardan al cargar para no volver a pedirlas cada vez que se cambia de
// idioma: la reseña la escribio un cliente y no se traduce.
let resenasCargadas = null;

function pintarResenas() {
    const caja = document.getElementById('listaResenas');
    if (!caja) return;

    if (resenasCargadas === null) {
        caja.innerHTML = '<p class="col-span-full text-center text-zinc-600 text-sm py-8">···</p>';
        return;
    }

    if (resenasCargadas.length === 0) {
        caja.innerHTML = '<p class="col-span-full text-center text-zinc-600 py-8">' +
            escapar(TEXTOS[idioma].resenasVacio) + '</p>';
        return;
    }

    caja.innerHTML = resenasCargadas.map((r) => `
        <article class="aparece bg-zinc-950/60 border border-zinc-800 rounded-2xl overflow-hidden
                        flex flex-col hover:border-zinc-700 transition-colors">
            ${r.foto_url ? `<img src="${escapar(r.foto_url)}" alt=""
                 loading="lazy" class="w-full h-44 object-cover border-b border-zinc-800">` : ''}
            <div class="p-6 flex flex-col flex-1">
                ${estrellas(r.estrellas)}
                <p class="text-zinc-300 text-sm leading-relaxed my-4 flex-1">${escapar(r.texto)}</p>
                <p class="text-zinc-500 text-xs font-bold tracking-wide">${escapar(r.nombre)}</p>
            </div>
        </article>`).join('');

    observarAparicion();
}

async function cargarResenas() {
    try {
        const cliente = supabase.createClient(
            'https://mefrjbmjfdphdqndpzcw.supabase.co',
            'sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8'
        );
        const { data, error } = await cliente
            .from('resenas')
            .select('nombre,texto,estrellas,foto_url')
            .eq('estado', 'publicada')
            .order('creada_en', { ascending: false })
            .limit(9);

        if (error) throw error;
        resenasCargadas = data || [];
    } catch (e) {
        // Si la tabla todavia no existe o falla la red, la seccion se queda
        // vacia con su mensaje. La web no se cae por esto.
        console.warn('[Reseñas]', e.message);
        resenasCargadas = [];
    }
    pintarResenas();
}


// -------------------------------------------------------------- apariciones
let observador = null;

function observarAparicion() {
    if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.aparece').forEach((el) => el.classList.add('visible'));
        return;
    }
    if (!observador) {
        observador = new IntersectionObserver((entradas) => {
            entradas.forEach((e) => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    observador.unobserve(e.target);
                }
            });
        }, { rootMargin: '0px 0px -60px 0px' });
    }
    document.querySelectorAll('.aparece:not(.visible)').forEach((el) => observador.observe(el));
}


// ------------------------------------------------------------------ arranque
document.getElementById('btnIdioma').addEventListener('click', () => {
    idioma = idioma === 'es' ? 'en' : 'es';
    aplicarIdioma();
});

// Los enlaces del menu movian la pagina poniendo "#como" y demas en la barra
// de direcciones. Funcionaba, pero se ve descuidado y encima deja la
// direccion rara si alguien la copia para compartirla. Se desplaza a mano y
// la direccion se queda limpia.
document.querySelectorAll('a[href^="#"]').forEach((enlace) => {
    enlace.addEventListener('click', (ev) => {
        const destino = document.getElementById(enlace.getAttribute('href').slice(1));
        if (!destino) return;               // por si el enlace apunta a nada
        ev.preventDefault();
        // El hero es el principio de la pagina: ahi se sube del todo, para que
        // no quede un dedo de hueco por encima.
        if (destino.id === 'inicio') window.scrollTo({ top: 0, behavior: 'smooth' });
        else destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

// Si llegan con un "#algo" pegado (de un enlace viejo o de compartir), se
// quita de la barra sin recargar ni perder el sitio.
if (location.hash) {
    history.replaceState(null, '', location.pathname + location.search);
}

// El boton de subir solo aparece cuando ya se bajo lo suficiente como para
// que volver a mano sea un fastidio.
const btnArriba = document.getElementById('btnArriba');

btnArriba.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Marcar en que seccion se esta. En una pagina de una sola hoja no hay
// jerarquia que enseñar, asi que lo util es esto: saber donde estas.
const enlacesMenu = [...document.querySelectorAll('nav a[href^="#"]')];
const secciones = enlacesMenu
    .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
    .filter(Boolean);

function alDesplazarse() {
    // Boton de subir
    if (window.scrollY > 600) {
        btnArriba.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    } else {
        btnArriba.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }

    // Seccion activa: la ultima cuyo principio ya quedo por encima de la
    // mitad de la pantalla.
    let activa = null;
    for (const sec of secciones) {
        if (sec.getBoundingClientRect().top <= window.innerHeight * 0.5) activa = sec.id;
    }
    enlacesMenu.forEach((a) => {
        const suya = a.getAttribute('href').slice(1) === activa;
        a.classList.toggle('text-amber-400', suya);
        a.classList.toggle('text-zinc-400', !suya);
    });
}

window.addEventListener('scroll', alDesplazarse, { passive: true });
alDesplazarse();

document.getElementById('anio').textContent = new Date().getFullYear();

// Redes: cada una se enseña solo si tiene usuario puesto arriba.
const enlaceTiktok = document.getElementById('tiktok');
if (REDES.tiktok) {
    enlaceTiktok.href = 'https://tiktok.com/@' + REDES.tiktok;
} else {
    enlaceTiktok.remove();
}

// Si ya eligio idioma antes, se respeta. Si no, se mira el del navegador:
// el turista que llega de fuera ve la web en ingles sin tener que buscar
// el boton.
try {
    const guardado = localStorage.getItem('kl_idioma');
    if (guardado === 'es' || guardado === 'en') {
        idioma = guardado;
    } else if (!String(navigator.language || '').toLowerCase().startsWith('es')) {
        idioma = 'en';
    }
} catch (e) {}

aplicarIdioma();
cargarResenas();
</script>
