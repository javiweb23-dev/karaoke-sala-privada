<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Latino · Sala privada en Lechería</title>
<meta name="description" content="Sala privada de karaoke en Lechería. Más de 4.000 canciones, pantalla de 65 pulgadas, tres micrófonos inalámbricos y un sistema donde pides desde tu propio celular.">

<meta property="og:title" content="Karaoke Latino · Sala privada en Lechería">

<link rel="icon" href="logo.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    // ------------------------------------------------------------------
    // La paleta, sacada del logo
    // ------------------------------------------------------------------
    //   marca   el degradado del microfono: de naranja rojizo a dorado.
    //           El 500 es el corazon del logo, el que mas pixeles ocupa.
    //   noche   negro CALIDO. El de antes (#09090B) tiraba a azul y con el
    //           naranja al lado se veia sucio.
    //   crema   los grises, tambien calidos, para que no desentonen.
    //   fiesta  el magenta. Va con cuentagotas: existe para que el naranja
    //           no este solo, no para competir con el.
    // ------------------------------------------------------------------
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    marca:  { 300: '#FFC000', 400: '#FF9A1F', 500: '#FF8000', 600: '#FF5A1F' },
                    noche:  { 950: '#0D0B09', 900: '#15110E', 850: '#1B1613',
                              800: '#241D18', 700: '#362C25' },
                    crema:  { 100: '#F7F3EE', 300: '#D8D0C7', 400: '#A89E93',
                              500: '#85796D', 600: '#635A50', 700: '#443D36' },
                    fiesta: '#F0338C'
                }
            }
        }
    };
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    html { scroll-behavior: smooth; }

    /* La barra de arriba es fija y mide 64 px. Sin esto, al saltar a una
       seccion su titulo queda escondido justo debajo. */
    section[id] { scroll-margin-top: 4rem; }

    /* ------------------------------------------------------------------
       LAS FOTOS
       ------------------------------------------------------------------
       Estan todas en fotos/ y se cambian dejando otra con el mismo nombre:

         cantando.jpg        la portada de arriba
         sala-principal.jpg  la de la seccion "La sala"
         paso-1-reservas.jpg
         paso-2-escanea.jpg   los cuatro pasos de "Como funciona"
         paso-3-pide.jpg
         paso-4-canta.jpg
         app-*.jpg           las capturas del telefono

       Las de los pasos son de Pexels: uso comercial permitido y sin
       obligacion de acreditar al autor.
       ------------------------------------------------------------------ */

    /* La foto de portada se ve nitida. Lo unico que se toca es un punto de
       contraste y saturacion, para que no compita en claridad con el texto
       blanco que lleva encima. */
    .foto-portada {
        filter: saturate(1.08) contrast(1.04);
    }

    /* El velo. En pantalla ancha va en horizontal: muy oscuro a la izquierda,
       donde esta el titulo, y casi transparente a la derecha, donde estan
       ellos cantando. Asi el texto se lee y la foto se ve.
       La segunda capa, vertical, mete la foto por debajo de la barra de
       arriba y la funde con el negro de la seccion siguiente. */
    .velo-hero {
        background:
            linear-gradient(to right,
                rgba(13,11,9,.95) 0%,  rgba(13,11,9,.88) 26%,
                rgba(13,11,9,.55) 52%, rgba(13,11,9,.30) 78%,
                rgba(13,11,9,.28) 100%),
            linear-gradient(to bottom,
                rgba(13,11,9,.55) 0%,  rgba(13,11,9,.05) 20%,
                rgba(13,11,9,.35) 72%, rgb(13,11,9) 100%);
    }

    /* En el telefono el texto ocupa todo el ancho, asi que un velo lateral no
       sirve de nada: tiene que ser parejo. Se deja mas claro en la franja de
       arriba, que es donde quedan las caras. */
    @media (max-width: 767px) {
        .velo-hero {
            background: linear-gradient(to bottom,
                rgba(13,11,9,.60) 0%,  rgba(13,11,9,.42) 22%,
                rgba(13,11,9,.80) 48%, rgba(13,11,9,.92) 72%,
                rgb(13,11,9) 100%);
        }
    }

    /* El marco de telefono que envuelve cada captura. Recortadas a una franja
       se veian como un trozo de pantalla arrancado; dentro de un telefono se
       entiende de que son sin tener que explicarlo. */
    .telefono {
        background: linear-gradient(160deg, #4A3E35 0%, #15110E 45%, #241D18 100%);
        box-shadow: 0 18px 40px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05) inset;
    }

    /* El degradado del logo, aplicado a texto. El microfono del logo va de
       dorado a naranja rojizo; las cifras grandes hacen lo mismo. Un naranja
       plano se veia correcto pero muerto. */
    .degradado-marca {
        background: linear-gradient(135deg, #FFC000 0%, #FF8000 52%, #FF5A1F 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
    }

    /* Resplandores. Son las luces de colores que de verdad hay en la sala,
       traidas a la pagina: manchas muy difusas detras del contenido, que se
       notan sin que nadie sepa por que. */
    .resplandor { position: relative; isolation: isolate; }
    .resplandor::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: var(--luz);
    }
    .luz-naranja { --luz: radial-gradient(60% 55% at 15% 0%, rgba(255,128,0,.13), transparent 70%); }
    .luz-fiesta  { --luz: radial-gradient(55% 50% at 85% 10%, rgba(240,51,140,.11), transparent 70%); }
    .luz-doble   { --luz: radial-gradient(50% 45% at 8% 100%, rgba(255,128,0,.12), transparent 70%),
                          radial-gradient(45% 40% at 92% 0%, rgba(240,51,140,.10), transparent 70%); }

    /* ------------------------------------------------------------------
       El cintillo de caratulas
       ------------------------------------------------------------------
       La pista lleva la lista DOS veces seguidas y se desplaza hasta el -50%.
       Justo en ese punto el segundo juego esta donde arrancó el primero, asi
       que al volver a cero no se nota el salto y parece infinito.

       Las caratulas salen de la API de iTunes, la misma que ya usa la app
       para las portadas de la lista. Cada una es de una cancion que esta de
       verdad en la sala.
       ------------------------------------------------------------------ */
    .cintillo {
        overflow: hidden;
        /* Se desvanece por los lados para que no se vea el corte seco. */
        -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
                mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
    }
    .cintillo-pista {
        display: flex;
        gap: 14px;
        width: max-content;
        animation: correr 70s linear infinite;
    }
    .cintillo-pista.al-reves { animation-direction: reverse; }
    .cintillo:hover .cintillo-pista { animation-play-state: paused; }
    @keyframes correr { to { transform: translateX(-50%); } }

    /* A quien le moleste el movimiento se le deja quieto. */
    @media (prefers-reduced-motion: reduce) {
        .cintillo-pista { animation: none; }
    }

    /* Aparecer al hacer scroll. Si el navegador no soporta el observador, las
       secciones se quedan visibles: nunca se esconde nada sin poder mostrarlo. */
    .aparece { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
        html { scroll-behavior: auto; }
    }
</style>
</head>

         titulo que va encima. -->
    <img src="fotos/cantando.jpg" alt="" aria-hidden="true" fetchpriority="high"

                object-[38%_0%] sm:object-[50%_0%]">

    <div class="relative max-w-6xl mx-auto px-5 py-20 w-full">
        <div class="max-w-2xl">

            <p class="inline-flex items-center gap-2 bg-marca-500/10 border border-marca-500/30
                      text-marca-400 text-[11px] font-bold tracking-[0.15em] uppercase
                      px-3 py-1.5 rounded-full mb-6">
                <span class="w-1.5 h-1.5 rounded-full bg-marca-500"></span>
                <span data-t="heroEtiqueta"></span>
            </p>

            <h1 class="text-[2.6rem] sm:text-6xl lg:text-7xl font-black leading-[1.05] tracking-tight mb-6">
                <span data-t="heroTitulo1"></span><br>
                <span class="degradado-marca" data-t="heroTitulo2"></span>

            <div class="flex flex-col sm:flex-row gap-3">

            <p class="text-3xl sm:text-4xl font-black degradado-marca tracking-tight">14</p>
            <p class="text-[11px] sm:text-xs text-crema-500 font-bold uppercase tracking-[0.12em] mt-1.5" data-t="cifraPersonas"></p>
        </div>
    </div>

<!-- ════════════════════════════════════════════════════════ SISTEMA ═══ -->

<!-- ═══════════════════════════════════════════════════════════ SALA ═══ -->
<section id="sala" class="resplandor luz-fiesta py-24 px-5">
    <div class="max-w-6xl mx-auto">

        <div class="grid lg:grid-cols-2 gap-14 items-center">

                     class="w-full h-full object-cover object-[50%_28%]">
                <div class="absolute inset-0 pointer-events-none"
                     style="background:

</section>


<!-- ══════════════════════════════════════════════════════ GENEROS ════ -->

    <div class="max-w-5xl mx-auto text-center">
        <div class="aparece">
            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="generosTitulo"></h2>
            <p class="text-crema-400 text-lg leading-relaxed mb-10 max-w-2xl mx-auto" data-t="generosTexto"></p>

<!-- ════════════════════════════════════════════════════════ PRECIOS ═══ -->

            <h2 class="text-3xl sm:text-5xl font-black tracking-tight mb-4" data-t="preciosTitulo"></h2>
            <p class="text-crema-400 text-lg" data-t="preciosTexto"></p>

        <div class="grid lg:grid-cols-2 gap-6 items-stretch">

            <!-- La foto va a la IZQUIERDA, al reves que en "La sala": asi las
                 dos secciones con foto no se ven calcadas al bajar.

                 Esta viene con la chica pegada a su izquierda y medio encuadre

                     y precioDetalles de las dos traducciones. -->

                <div class="border-t border-noche-800 pt-6 space-y-2.5 mb-7" id="precioDetalles"></div>

        </div>

        <!-- La tienda de refrigerios, que ya existe y funciona aparte. -->

                    flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <p class="font-bold text-crema-100 mb-1" data-t="tiendaTitulo"></p>
                <p class="text-crema-500 text-sm" data-t="tiendaTexto"></p>
            </div>
            <a href="tienda.html"
               class="flex-shrink-0 border border-noche-700 hover:border-marca-500/60 hover:bg-noche-800

function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
}

function estrellas(n) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<svg class="w-4 h-4 ' + (i <= n ? 'text-marca-500' : 'text-noche-700') +
                '" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' +
                '<path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L1.5 7.7l5.9-.9z"/></svg>';
    }
    return '<div class="flex gap-0.5">' + html + '</div>';
}

    // El boton enseña el idioma que se esta leyendo AHORA, no al que se
    // cambiaria. Se probo al reves y confundia: se leia como si la pagina

    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    // Los enlaces de WhatsApp, con el mensaje ya escrito.
    const enlace = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);
    // Los de 'reservar' llevan ahora al formulario; los de contacto siguen

    ['waCierre', 'waFooter', 'waBurbuja'].forEach((id) => {

        if (el) el.href = enlace;

    pintarCintillo('cintillo1', PORTADAS.slice(0, mitad));

// -------------------------------------------------------------- apariciones
let observador = null;

function observarAparicion() {
    if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.aparece').forEach((el) => el.classList.add('visible'));
        return;
    }
    if (!observador) {
        observador = new IntersectionObserver((entradas) => {
            entradas.forEach((e) => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    observador.unobserve(e.target);
                }
            });
        }, { rootMargin: '0px 0px -60px 0px' });
    }
    document.querySelectorAll('.aparece:not(.visible)').forEach((el) => observador.observe(el));
}

// la direccion se queda limpia.
document.querySelectorAll('a[href^="#"]').forEach((enlace) => {
    enlace.addEventListener('click', (ev) => {
        const destino = document.getElementById(enlace.getAttribute('href').slice(1));
        if (!destino) return;               // por si el enlace apunta a nada
        ev.preventDefault();
        // El hero es el principio de la pagina: ahi se sube del todo, para que
        // no quede un dedo de hueco por encima.
        if (destino.id === 'inicio') window.scrollTo({ top: 0, behavior: 'smooth' });
        else destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

// Si llegan con un "#algo" pegado (de un enlace viejo o de compartir), se
// quita de la barra sin recargar ni perder el sitio.
if (location.hash) {
    history.replaceState(null, '', location.pathname + location.search);
}

// El boton de subir solo aparece cuando ya se bajo lo suficiente como para
// que volver a mano sea un fastidio.
const btnArriba = document.getElementById('btnArriba');

btnArriba.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Marcar en que seccion se esta. En una pagina de una sola hoja no hay
// jerarquia que enseñar, asi que lo util es esto: saber donde estas.
const enlacesMenu = [...document.querySelectorAll('nav a[href^="#"]')];
const secciones = enlacesMenu
    .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
    .filter(Boolean);

function alDesplazarse() {
    // Boton de subir
    if (window.scrollY > 600) {
        btnArriba.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    } else {
        btnArriba.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }

    // Seccion activa: la ultima cuyo principio ya quedo por encima de la
    // mitad de la pantalla.
    let activa = null;
    for (const sec of secciones) {
        if (sec.getBoundingClientRect().top <= window.innerHeight * 0.5) activa = sec.id;
    }
    enlacesMenu.forEach((a) => {
        const suya = a.getAttribute('href').slice(1) === activa;
        a.classList.toggle('text-marca-500', suya);
        a.classList.toggle('text-crema-400', !suya);
    });
}

window.addEventListener('scroll', alDesplazarse, { passive: true });
alDesplazarse();

document.getElementById('anio').textContent = new Date().getFullYear();

// Redes: cada una se enseña solo si tiene usuario puesto arriba.
const enlaceTiktok = document.getElementById('tiktok');
if (REDES.tiktok) {
    enlaceTiktok.href = 'https://tiktok.com/@' + REDES.tiktok;
} else {
    enlaceTiktok.remove();
}

// Si ya eligio idioma antes, se respeta. Si no, se mira el del navegador:
// el turista que llega de fuera ve la web en ingles sin tener que buscar
// el boton.
try {
    const guardado = localStorage.getItem('kl_idioma');
    if (guardado === 'es' || guardado === 'en') {
        idioma = guardado;
    } else if (!String(navigator.language || '').toLowerCase().startsWith('es')) {
        idioma = 'en';
    }
} catch (e) {}

aplicarIdioma();
cargarResenas();

// =========================================================================
// Cotizacion y reserva
//
// Las reglas estan repetidas aqui y en api/reserva.js, y es a proposito: aqui
// para que el cliente no pierda el tiempo, y alli porque es quien decide. Si
// alguna vez cambian, hay que tocar LOS DOS sitios.
// =========================================================================
var RES = {
    ABRE: 20 * 60,
    HORAS_MIN: 3,
    HORAS_MAX: 8,
    BASE_USD: 60,          // las primeras 3 horas
    HORA_EXTRA: 15,
    CORTESIA: 20           // minutos de regalo, antes y despues
};

var reserva = {
    fecha: '', horas: 3,
    inicio: null, comprobante: null, tasa: null
};

function nodo(id) { return document.getElementById(id); }

function resHora(min) {
    const h = Math.floor((min % 1440) / 60), m = min % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

function resPrecio(horas) {
    return RES.BASE_USD + Math.max(0, horas - RES.HORAS_MIN) * RES.HORA_EXTRA;
}

function resBolivares(usd) {
    if (!reserva.tasa) return null;
    return (usd * reserva.tasa).toLocaleString('es-VE', { maximumFractionDigits: 0 });
}

// ------------------------------------------------- los desplegables, una vez
function resLlenarSelects() {
    const t = TEXTOS[idioma];

    // Se eligen horas ADICIONALES, no totales: la reserva ya son 3 horas, y
    // preguntar "cuantas horas" invitaba a elegir 3 como si fuera una opcion
    // entre otras. Asi la base se da por hecha y solo se decide si se alarga.
    nodo('resHoras').innerHTML = Array.from(
        { length: RES.HORAS_MAX - RES.HORAS_MIN + 1 }, (_, i) => {
            const extra = i;
            const total = RES.HORAS_MIN + extra;
            const texto = extra === 0
                ? t.resSinExtra
                : `+${extra} ${extra === 1 ? t.resHoraSing : t.resHoraPl} · $${extra * RES.HORA_EXTRA}`;
            return `<option value="${total}"${total === reserva.horas ? ' selected' : ''}>${texto}</option>`;
        }).join('');

    // Desde hoy: no tiene sentido ofrecer ayer.
    const hoy = new Date();
    const dosDigitos = (n) => String(n).padStart(2, '0');
    nodo('resFecha').min = hoy.getFullYear() + '-' +
        dosDigitos(hoy.getMonth() + 1) + '-' + dosDigitos(hoy.getDate());
}

// ------------------------------------------------ pedir y pintar las horas
async function resBuscarHoras() {
    const t = TEXTOS[idioma];
    const caja = nodo('resHorasLibres');
    const aviso = nodo('resAvisoHoras');

    reserva.inicio = null;
    resPintarResumen();

    if (!reserva.fecha) {
        caja.innerHTML = '';
        aviso.textContent = t.resElegirDia;
        return;
    }

    caja.innerHTML = '';
    aviso.textContent = t.resCargando;

    try {
        const r = await fetch('/api/reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                accion: 'disponibilidad',
                fecha: reserva.fecha,
                horas: reserva.horas
            })
        });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'sin horas');

        if (d.tasa) reserva.tasa = d.tasa;

        if (!d.horas.length) {
            aviso.textContent = t.resSinHoras;
            return;
        }

        aviso.textContent = '';
        caja.innerHTML = d.horas.map((h) => `
            <button type="button" data-min="${h.min}"
                class="res-hora border border-noche-700 hover:border-marca-500/60
                       text-crema-300 text-sm font-bold px-4 py-2.5 rounded-xl
                       transition-colors">${h.texto}</button>`).join('');

        caja.querySelectorAll('.res-hora').forEach((b) => {
            b.addEventListener('click', () => {
                reserva.inicio = Number(b.dataset.min);
                caja.querySelectorAll('.res-hora').forEach((o) => {
                    const suyo = o === b;
                    o.classList.toggle('bg-marca-500', suyo);
                    o.classList.toggle('text-black', suyo);
                    o.classList.toggle('border-marca-500', suyo);
                    o.classList.toggle('text-crema-300', !suyo);
                });
                resPintarResumen();
            });
        });
    } catch (e) {
        console.warn('[reserva]', e.message);
        aviso.textContent = t.resSinHoras;
    }
}

// ------------------------------------------------------------- el resumen
function resPintarResumen() {
    const t = TEXTOS[idioma];
    const caja = nodo('resResumen');

    const listo = Boolean(reserva.fecha && reserva.inicio !== null);
    ['resResumen', 'resQuien', 'resPago'].forEach((id) =>
        nodo(id).classList.toggle('hidden', !listo));
    if (!listo) return;

    const fin = reserva.inicio + reserva.horas * 60;
    const total = resPrecio(reserva.horas);
    const abono = total / 2;
    const bsTotal = resBolivares(total);
    const bsAbono = resBolivares(abono);

    caja.innerHTML = `
        <div class="space-y-1.5 text-sm mb-4">
            <p class="text-crema-300">${t.resResumenEntran}
               <strong class="text-crema-100">${resHora(reserva.inicio - RES.CORTESIA)}</strong></p>
            <p class="text-crema-300">${t.resResumenCantan}
               <strong class="text-crema-100">${resHora(reserva.inicio)} a ${resHora(fin)}</strong></p>
            <p class="text-crema-300">${t.resResumenSalen}
               <strong class="text-crema-100">${resHora(fin + RES.CORTESIA)}</strong></p>
        </div>
        <p class="text-crema-500 text-xs leading-relaxed mb-5">${t.resResumenCortesia}</p>

        <div class="border-t border-noche-800 pt-4 space-y-2">
            <div class="flex items-baseline justify-between">
                <span class="text-crema-400 text-sm">${t.resResumenTotal}</span>
                <span class="text-crema-100 font-bold">$${total}${bsTotal ? `
                    <span class="text-crema-500 font-normal text-sm"> · Bs ${bsTotal}</span>` : ''}</span>
            </div>
            <div class="flex items-baseline justify-between">
                <span class="text-marca-400 text-sm font-bold">${t.resResumenAbono}</span>
                <span class="degradado-marca font-black text-xl">$${abono}${bsAbono ? `
                    <span class="text-crema-400 font-normal text-sm"> · Bs ${bsAbono}</span>` : ''}</span>
            </div>
            <p class="text-crema-600 text-xs pt-1">${t.resResumenResto}${
                reserva.tasa ? ` · ${t.resTasaNota}: ${reserva.tasa.toLocaleString('es-VE',
                    { maximumFractionDigits: 2 })}` : ''}</p>
        </div>`;
}

// ---------------------------------------------------------- el comprobante
nodo('resComprobante').addEventListener('change', (ev) => {
    const t = TEXTOS[idioma];
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;

    if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(f.type)) {
        return resMostrarError(t.resErrArchivo);
    }
    if (f.size > 5 * 1024 * 1024) return resMostrarError(t.resErrPesado);

    reserva.comprobante = f;
    resOcultarError();

    const ok = nodo('resComprobanteOk');
    ok.textContent = t.resComprobanteListo + ' ' + f.name;
    ok.classList.remove('hidden');
    nodo('resEnviar').disabled = false;
});

function resMostrarError(texto) {
    const e = nodo('resError');
    e.textContent = texto;
    e.classList.remove('hidden');
}
function resOcultarError() { nodo('resError').classList.add('hidden'); }

// --------------------------------------------------------------- enviarla
async function resEnviar() {
    const t = TEXTOS[idioma];
    const nombre = nodo('resNombre').value.trim();
    const telefono = nodo('resTelefono').value.trim();

    if (nombre.length < 2) return resMostrarError(t.resErrNombre);
    if (telefono.replace(/\D/g, '').length < 10) return resMostrarError(t.resErrTelefono);
    if (!reserva.comprobante) return resMostrarError(t.resErrComprobante);

    resOcultarError();
    const btn = nodo('resEnviar');
    btn.disabled = true;
    btn.textContent = t.resSubiendo;

    try {
        // El comprobante va primero: si falla, no queda una reserva sin pago.
        const cliente = supabase.createClient(
            'https://mefrjbmjfdphdqndpzcw.supabase.co',
            'sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8'
        );
        const ext = (reserva.comprobante.name.split('.').pop() || 'jpg').toLowerCase().slice(0, 4);
        const ruta = Date.now() + '-' + Math.random().toString(36).slice(2, 10) + '.' + ext;

        const { error: errSubida } = await cliente.storage
            .from('comprobantes')
            .upload(ruta, reserva.comprobante, { contentType: reserva.comprobante.type });
        if (errSubida) throw errSubida;

        btn.textContent = t.resEnviando;

        const r = await fetch('/api/reserva', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                accion: 'crear',
                fecha: reserva.fecha,
                inicio_min: reserva.inicio,
                horas: reserva.horas,
                nombre, telefono,
                comprobante: ruta
            })
        });
        const d = await r.json();

        if (!d.ok) {
            // Si alguien se adelanto, se vuelven a pedir las horas para que
            // vea el hueco real en vez de insistir contra uno ocupado.
            if (d.ocupado) resBuscarHoras();
            throw new Error(d.error || t.resErrEnvio);
        }

        nodo('resGracias').previousElementSibling.classList.add('hidden');
        nodo('resGracias').classList.remove('hidden');
        nodo('resGracias').scrollIntoView({ behavior: 'smooth', block: 'center' });

    } catch (e) {
        console.warn('[reserva]', e.message);
        resMostrarError(e.message || t.resErrEnvio);
        btn.disabled = false;
        btn.textContent = t.resBtnEnviar;
    }
}

nodo('resEnviar').addEventListener('click', resEnviar);
nodo('resFecha').addEventListener('change', (e) => {
    reserva.fecha = e.target.value; resBuscarHoras();
});
nodo('resHoras').addEventListener('change', (e) => {
    reserva.horas = Number(e.target.value); resBuscarHoras();
});

resLlenarSelects();
resBuscarHoras();

</script>
</body>
</html>
