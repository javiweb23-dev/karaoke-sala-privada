<!-- Lo que se ve al compartir el enlace por WhatsApp, Instagram o donde sea.
     La direccion de la imagen tiene que ser ABSOLUTA: quien pinta la vista
     previa es el servidor de WhatsApp, no el navegador, y una ruta relativa

     La foto de compartir va aparte de la portada a proposito: aqui se recorta
     a lo ancho (1.91:1) y conviene poder cambiarla sin tocar el hero. -->

<script>
    // ------------------------------------------------------------------
    // La paleta, sacada del logo
    // ------------------------------------------------------------------
    //   marca   el degradado del microfono: de naranja rojizo a dorado.
    //           El 500 es el corazon del logo, el que mas pixeles ocupa.
    //   noche   negro CALIDO. El de antes (#09090B) tiraba a azul y con el
    //           naranja al lado se veia sucio.
    //   crema   los grises, tambien calidos, para que no desentonen.
    //   fiesta  el magenta. Va con cuentagotas: existe para que el naranja
    //           no este solo, no para competir con el.
    // ------------------------------------------------------------------
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    marca:  { 300: '#FFC000', 400: '#FF9A1F', 500: '#FF8000', 600: '#FF5A1F' },
                    noche:  { 950: '#0D0B09', 900: '#15110E', 850: '#1B1613',
                              800: '#241D18', 700: '#362C25' },
                    crema:  { 100: '#F7F3EE', 300: '#D8D0C7', 400: '#A89E93',
                              500: '#85796D', 600: '#635A50', 700: '#443D36' },
                    fiesta: '#F0338C'
                }
            }
        }
    };
</script>

<style>
    html { scroll-behavior: smooth; }

    /* La barra de arriba es fija y mide 64 px. Sin esto, al saltar a una
       seccion su titulo queda escondido justo debajo. */
    /* La barra fija mide 80 px, pero cada seccion lleva ademas 96 px de aire
       propio por arriba. Descontar solo la barra dejaba el titulo casi 100 px
       por debajo de ella y se veia un hueco raro al llegar desde el menu.
       Con 1rem la seccion entra un poco por encima y el titulo queda justo
       debajo de la barra, con aire pero sin hueco. */
    section[id] { scroll-margin-top: 1rem; }

    /* ------------------------------------------------------------------
       LAS FOTOS
       ------------------------------------------------------------------
       Estan todas en fotos/ y se cambian dejando otra con el mismo nombre:

         cantando.jpg        la portada de arriba
         sala-principal.jpg  la de la seccion "La sala"
         paso-1-reservas.jpg
         paso-2-escanea.jpg   los cuatro pasos de "Como funciona"
         paso-3-pide.jpg
         paso-4-canta.jpg
         app-*.jpg           las capturas del telefono

       Las de los pasos son de Pexels: uso comercial permitido y sin
       obligacion de acreditar al autor.
       ------------------------------------------------------------------ */

    /* La foto de portada se ve nitida. Lo unico que se toca es un punto de
       contraste y saturacion, para que no compita en claridad con el texto
       blanco que lleva encima. */
    .foto-portada {
        filter: saturate(1.08) contrast(1.04);
    }

    /* El velo. En pantalla ancha va en horizontal: muy oscuro a la izquierda,
       donde esta el titulo, y casi transparente a la derecha, donde estan
       ellos cantando. Asi el texto se lee y la foto se ve.
       La segunda capa, vertical, mete la foto por debajo de la barra de
       arriba y la funde con el negro de la seccion siguiente. */
    .velo-hero {
        background:
            linear-gradient(to right,
                rgba(13,11,9,.95) 0%,  rgba(13,11,9,.88) 26%,
                rgba(13,11,9,.55) 52%, rgba(13,11,9,.30) 78%,
                rgba(13,11,9,.28) 100%),
            linear-gradient(to bottom,
                rgba(13,11,9,.55) 0%,  rgba(13,11,9,.05) 20%,
                rgba(13,11,9,.35) 72%, rgb(13,11,9) 100%);
    }

    /* En el telefono el texto ocupa todo el ancho, asi que un velo lateral no
       sirve de nada: tiene que ser parejo. Se deja mas claro en la franja de
       arriba, que es donde quedan las caras. */
    @media (max-width: 767px) {
        .velo-hero {
            background: linear-gradient(to bottom,
                rgba(13,11,9,.60) 0%,  rgba(13,11,9,.42) 22%,
                rgba(13,11,9,.80) 48%, rgba(13,11,9,.92) 72%,
                rgb(13,11,9) 100%);
        }
    }

    /* El marco de telefono que envuelve cada captura. Recortadas a una franja
       se veian como un trozo de pantalla arrancado; dentro de un telefono se
       entiende de que son sin tener que explicarlo. */
    .telefono {
        background: linear-gradient(160deg, #4A3E35 0%, #15110E 45%, #241D18 100%);
        box-shadow: 0 18px 40px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.05) inset;
    }

    /* El icono del calendario viene oscuro de serie y sobre este fondo no se
       veia. Invertido se distingue, que es la segunda via por si showPicker()
       no esta disponible en ese telefono. */
    input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(1);
        opacity: .55;
        cursor: pointer;
    }
    input[type="date"] { cursor: pointer; }

    /* El degradado del logo, aplicado a texto. El microfono del logo va de
       dorado a naranja rojizo; las cifras grandes hacen lo mismo. Un naranja
       plano se veia correcto pero muerto. */
    .degradado-marca {
        background: linear-gradient(135deg, #FFC000 0%, #FF8000 52%, #FF5A1F 100%);
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
    }

    /* Resplandores. Son las luces de colores que de verdad hay en la sala,
       traidas a la pagina: manchas muy difusas detras del contenido, que se
       notan sin que nadie sepa por que. */
    .resplandor { position: relative; isolation: isolate; }
    .resplandor::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: var(--luz);
    }
    .luz-naranja { --luz: radial-gradient(60% 55% at 15% 0%, rgba(255,128,0,.13), transparent 70%); }
    .luz-fiesta  { --luz: radial-gradient(55% 50% at 85% 10%, rgba(240,51,140,.11), transparent 70%); }
    .luz-doble   { --luz: radial-gradient(50% 45% at 8% 100%, rgba(255,128,0,.12), transparent 70%),
                          radial-gradient(45% 40% at 92% 0%, rgba(240,51,140,.10), transparent 70%); }

    /* ------------------------------------------------------------------
       El cintillo de caratulas
       ------------------------------------------------------------------
       La pista lleva la lista DOS veces seguidas y se desplaza hasta el -50%.
       Justo en ese punto el segundo juego esta donde arrancó el primero, asi
       que al volver a cero no se nota el salto y parece infinito.

       Las caratulas salen de la API de iTunes, la misma que ya usa la app
       para las portadas de la lista. Cada una es de una cancion que esta de
       verdad en la sala.
       ------------------------------------------------------------------ */
    .cintillo {
        overflow: hidden;
        /* Se desvanece por los lados para que no se vea el corte seco. */
        -webkit-mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
                mask-image: linear-gradient(to right, transparent, #000 7%, #000 93%, transparent);
    }
    .cintillo-pista {
        display: flex;
        gap: 14px;
        width: max-content;
        animation: correr 70s linear infinite;
    }
    .cintillo-pista.al-reves { animation-direction: reverse; }
    .cintillo:hover .cintillo-pista { animation-play-state: paused; }
    @keyframes correr { to { transform: translateX(-50%); } }

    /* A quien le moleste el movimiento se le deja quieto. */
    @media (prefers-reduced-motion: reduce) {
        .cintillo-pista { animation: none; }
    }

    /* Aparecer al hacer scroll. Si el navegador no soporta el observador, las
       secciones se quedan visibles: nunca se esconde nada sin poder mostrarlo. */
    .aparece { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s ease; }
    .aparece.visible { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
        .aparece { opacity: 1; transform: none; transition: none; }
        html { scroll-behavior: auto; }
    }
</style>
</head>

// ------------------------------------------------------------------ pintar
function escapar(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : String(t);
    return d.innerHTML;
}

function estrellas(n) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
        html += '<svg class="w-4 h-4 ' + (i <= n ? 'text-marca-500' : 'text-noche-700') +
                '" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">' +
                '<path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L1.5 7.7l5.9-.9z"/></svg>';
    }
    return '<div class="flex gap-0.5">' + html + '</div>';
}

function aplicarIdioma() {
    const t = TEXTOS[idioma];
    document.documentElement.lang = idioma;

    // Todo lo que lleva data-t.
    document.querySelectorAll('[data-t]').forEach((el) => {
        const valor = t[el.dataset.t];
        if (typeof valor === 'string') el.textContent = valor;
    });

    // El boton enseña el idioma que se esta leyendo AHORA, no al que se
    // cambiaria. Se probo al reves y confundia: se leia como si la pagina
    // estuviera en el idioma de la bandera de al lado.
    document.getElementById('banderaIcono').innerHTML = BANDERAS[idioma];
    document.getElementById('banderaTexto').textContent = idioma.toUpperCase();

    // Los enlaces de WhatsApp, con el mensaje ya escrito.
    const enlace = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(MENSAJES_WA[idioma]);
    // Los de 'reservar' llevan ahora al formulario; los de contacto siguen
    // yendo a WhatsApp, que para preguntar una duda sigue siendo lo comodo.
    ['waFooter', 'waBurbuja'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.href = enlace;
    });

    // Los cuatro pasos.

    // Las tres ventajas del sistema.
    // Cada captura va dentro de un telefono. Las dos del control de audio son
    // el mismo archivo, asi que a esas se les acerca la imagen (zoom) y se
    // ancla arriba o abajo: una enseña el tono y la otra los efectos, y se ven
    // como dos pantallas distintas, que es lo que son.
    document.getElementById('ventajas').innerHTML = t.ventajas.map((v) => `
        <div class="aparece flex flex-col items-center text-center">

            <div class="telefono w-[228px] lg:w-[186px] rounded-[1.9rem] p-[6px] mb-6">
                <div class="relative overflow-hidden rounded-[1.55rem] bg-black aspect-[9/16]">
                    <div class="absolute top-2 left-1/2 -translate-x-1/2 z-10
                                h-[3px] w-9 rounded-full bg-crema-600/70"></div>
                    <img src="${v.img}" alt="" loading="lazy"
                         class="w-full h-full object-cover ${v.pos}"
                         style="${v.zoom || ''}">
                </div>
            </div>

            <h3 class="font-bold text-marca-500 mb-2.5 leading-snug">${escapar(v.t)}</h3>
            <p class="text-crema-400 text-sm leading-relaxed">${escapar(v.d)}</p>
        </div>`).join('');

    // La lista de equipos.
    document.getElementById('equipos').innerHTML = t.equipos.map((e) => `
        <li class="flex items-start gap-3">
            <svg class="w-5 h-5 text-marca-500 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0z"/>
            </svg>
            <span class="text-crema-300">${escapar(e)}</span>
        </li>`).join('');

    // Lo que incluye el precio.
    document.getElementById('precioDetalles').innerHTML = t.precioDetalles.map((d) => `
        <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-crema-600 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.7-9.3a1 1 0 00-1.4-1.4L9 10.6 7.7 9.3a1 1 0 00-1.4 1.4l2 2a1 1 0 001.4 0z"/>
            </svg>
            <span class="text-crema-400 text-sm">${escapar(d)}</span>
        </div>`).join('');

    // El cintillo. Dos filas, cada una con la mitad de las caratulas y en
    // sentido contrario: asi no parecen la misma cinta repetida.
    const mitad = Math.ceil(PORTADAS.length / 2);
    const pintarCintillo = (id, lista) => {
        const una = (p) => `
            <figure class="flex-shrink-0 w-[104px] sm:w-[124px] m-0">
                <img src="fotos/portadas/${p.f}" alt="" loading="lazy"
                     class="w-full aspect-square object-cover rounded-xl border border-noche-800">
                <figcaption class="text-crema-500 text-[10px] mt-1.5 text-center truncate">${escapar(p.a)}</figcaption>
            </figure>`;
        // Dos veces la misma lista: es lo que hace que el bucle no se note.
        document.getElementById(id).innerHTML = lista.map(una).join('') + lista.map(una).join('');
    };
    pintarCintillo('cintillo1', PORTADAS.slice(0, mitad));
    pintarCintillo('cintillo2', PORTADAS.slice(mitad));

    // Las preguntas. Se usa <details>, que es el desplegable del propio
    // navegador: funciona sin JavaScript, se abre con el teclado y el buscador
    // del navegador (Ctrl+F) encuentra el texto aunque este cerrado.
    document.getElementById('faq').innerHTML = t.faq.map((g) => `
        <div class="aparece">
            <h3 class="text-marca-500 text-[11px] font-bold uppercase tracking-[0.18em] mb-4">
                ${escapar(g.grupo)}</h3>
            <div class="space-y-2">
                ${g.lista.map((f) => `
                    <details class="group bg-noche-950/60 border border-noche-800 rounded-xl
                                    overflow-hidden hover:border-noche-700 transition-colors">
                        <summary class="flex items-start gap-3 cursor-pointer list-none
                                        px-5 py-4 font-bold text-crema-100 text-[15px] leading-snug">
                            <svg class="w-4 h-4 mt-1 flex-shrink-0 text-marca-500 transition-transform
                                        group-open:rotate-45" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                            <span>${escapar(f.p)}</span>
                        </summary>
                        <p class="text-crema-400 text-sm leading-relaxed px-5 pb-5 pl-12">${escapar(f.r)}</p>
                    </details>`).join('')}
            </div>
        </div>`).join('');



    // La lista del bloque de fiestas y eventos.
    document.getElementById('evLista').innerHTML = t.evLista.map((x) => `
        <li class="flex items-start gap-2.5 text-crema-300">
            <svg class="w-4 h-4 text-marca-500 flex-shrink-0 mt-1" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>
            <span>${escapar(x)}</span>
        </li>`).join('');

    pintarResenas();
    // El formulario de reserva tambien tiene texto dentro.
    // Vive en reserva-comun.js, que carga DESPUES de este script: en la
    // primera pasada todavia no existe y no hay nada que repintar.
    if (typeof resRefrescarTextos === 'function') resRefrescarTextos();
    observarAparicion();

    try { localStorage.setItem('kl_idioma', idioma); } catch (e) {}
}


// ----------------------------------------------------------------- reseñas
// Se guardan al cargar para no volver a pedirlas cada vez que se cambia de
// idioma: la reseña la escribio un cliente y no se traduce.
let resenasCargadas = null;

function pintarResenas() {
    const caja = document.getElementById('listaResenas');
    if (!caja) return;

    if (resenasCargadas === null) {
        caja.innerHTML = '<p class="col-span-full text-center text-crema-600 text-sm py-8">···</p>';
        return;
    }

    if (resenasCargadas.length === 0) {
        caja.innerHTML = '<p class="col-span-full text-center text-crema-600 py-8">' +
            escapar(TEXTOS[idioma].resenasVacio) + '</p>';
        return;
    }

    caja.innerHTML = resenasCargadas.map((r) => `
        <article class="aparece bg-noche-950/60 border border-noche-800 rounded-2xl overflow-hidden
                        flex flex-col hover:border-noche-700 transition-colors">
            ${r.foto_url ? `<img src="${escapar(r.foto_url)}" alt=""
                 loading="lazy" class="w-full h-44 object-cover border-b border-noche-800">` : ''}
            <div class="p-6 flex flex-col flex-1">
                ${estrellas(r.estrellas)}
                <p class="text-crema-300 text-sm leading-relaxed my-4 flex-1">${escapar(r.texto)}</p>
                <p class="text-crema-500 text-xs font-bold tracking-wide">${escapar(r.nombre)}</p>
            </div>
        </article>`).join('');

    observarAparicion();
}

async function cargarResenas() {
    try {
        const cliente = supabase.createClient(
            'https://mefrjbmjfdphdqndpzcw.supabase.co',
            'sb_publishable_Xfq71bq0xH8DQ62OHekwCQ_B5dAPsz8'
        );
        const { data, error } = await cliente
            .from('resenas')
            .select('nombre,texto,estrellas,foto_url')
            .eq('estado', 'publicada')
            .order('creada_en', { ascending: false })
            .limit(9);

        if (error) throw error;
        resenasCargadas = data || [];
    } catch (e) {
        // Si la tabla todavia no existe o falla la red, la seccion se queda
        // vacia con su mensaje. La web no se cae por esto.
        console.warn('[Reseñas]', e.message);
        resenasCargadas = [];
    }
    pintarResenas();
}


// -------------------------------------------------------------- apariciones
let observador = null;

function observarAparicion() {
    if (!('IntersectionObserver' in window)) {
        document.querySelectorAll('.aparece').forEach((el) => el.classList.add('visible'));
        return;
    }
    if (!observador) {
        observador = new IntersectionObserver((entradas) => {
            entradas.forEach((e) => {
                if (e.isIntersecting) {
                    e.target.classList.add('visible');
                    observador.unobserve(e.target);
                }
            });
        }, { rootMargin: '0px 0px -60px 0px' });
    }
    document.querySelectorAll('.aparece:not(.visible)').forEach((el) => observador.observe(el));
}


// ------------------------------------------------------------------ arranque
document.getElementById('btnIdioma').addEventListener('click', () => {
    idioma = idioma === 'es' ? 'en' : 'es';
    aplicarIdioma();
});

// Los enlaces del menu movian la pagina poniendo "#como" y demas en la barra
// de direcciones. Funcionaba, pero se ve descuidado y encima deja la
// direccion rara si alguien la copia para compartirla. Se desplaza a mano y
// la direccion se queda limpia.
// Ojo: esto solo coge los que empiezan por "#". Los botones naranjas de
// reservar apuntan a /reserva, que es otra pagina, y por eso se quedan fuera
// de aqui y navegan como un enlace normal.
document.querySelectorAll('a[href^="#"]').forEach((enlace) => {
    enlace.addEventListener('click', (ev) => {
        const destino = document.getElementById(enlace.getAttribute('href').slice(1));
        if (!destino) return;               // por si el enlace apunta a nada
        ev.preventDefault();
        // El hero es el principio de la pagina: ahi se sube del todo, para que
        // no quede un dedo de hueco por encima.
        if (destino.id === 'inicio') window.scrollTo({ top: 0, behavior: 'smooth' });
        else destino.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
});

// Si llegan con un "#algo" pegado (de un enlace viejo o de compartir), se
// quita de la barra sin recargar ni perder el sitio.
if (location.hash) {
    history.replaceState(null, '', location.pathname + location.search);
}

// El boton de subir solo aparece cuando ya se bajo lo suficiente como para
// que volver a mano sea un fastidio.
const btnArriba = document.getElementById('btnArriba');

btnArriba.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Marcar en que seccion se esta. En una pagina de una sola hoja no hay
// jerarquia que enseñar, asi que lo util es esto: saber donde estas.
const enlacesMenu = [...document.querySelectorAll('nav a[href^="#"]')];
const secciones = enlacesMenu
    .map((a) => document.getElementById(a.getAttribute('href').slice(1)))
    .filter(Boolean);

function alDesplazarse() {
    // Boton de subir
    if (window.scrollY > 600) {
        btnArriba.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    } else {
        btnArriba.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }

    // Seccion activa: la ultima cuyo principio ya quedo por encima de la
    // mitad de la pantalla.
    let activa = null;
    for (const sec of secciones) {
        if (sec.getBoundingClientRect().top <= window.innerHeight * 0.5) activa = sec.id;
    }
    enlacesMenu.forEach((a) => {
        const suya = a.getAttribute('href').slice(1) === activa;
        a.classList.toggle('text-marca-500', suya);
        a.classList.toggle('text-crema-400', !suya);
    });
}

window.addEventListener('scroll', alDesplazarse, { passive: true });
alDesplazarse();

document.getElementById('anio').textContent = new Date().getFullYear();

// Redes: cada una se enseña solo si tiene usuario puesto arriba.
const enlaceTiktok = document.getElementById('tiktok');
if (REDES.tiktok) {
    enlaceTiktok.href = 'https://tiktok.com/@' + REDES.tiktok;
} else {
    enlaceTiktok.remove();
}

// Si ya eligio idioma antes, se respeta. Si no, SIEMPRE castellano.
//
// Antes se miraba el idioma del navegador y se abria en ingles a quien no lo
// tuviera en castellano. Suena razonable pero para este negocio sale al reves:
// un venezolano con el telefono en ingles —que hay muchos— llegaba a una web
// en ingles de un karaoke de Lecheria. Eso enfria; un turista viendo castellano
// solo tiene que tocar la bandera, que esta arriba a la vista.
//
// O sea: equivocarse hacia el castellano cuesta un toque. Equivocarse hacia el
// ingles cuesta un cliente.
try {
    const guardado = localStorage.getItem('kl_idioma');
    if (guardado === 'es' || guardado === 'en') idioma = guardado;
} catch (e) {}

aplicarIdioma();
cargarResenas();
</script>
